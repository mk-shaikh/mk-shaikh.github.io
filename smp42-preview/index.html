.mx-list button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;font-size:15px}
.mx-list button.seen{border-color:var(--teal)}.mx-list button.seen::after{content:" \2713";color:var(--teal);font-weight:700}
.mm-tl{position:relative;height:30px;margin:12px 0 4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.mm-played{position:absolute;left:0;top:0;bottom:0;background:var(--orange-soft);border-radius:8px}
.mm-pin{position:absolute;top:-6px;width:4px;height:42px;margin-left:-2px;border-radius:2px}
.mm-pin span{position:absolute;top:-22px;left:-9px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:22px}
.mm-pin.ok,.mm-pin.ok span{background:var(--teal)}.mm-pin.no,.mm-pin.no span{background:var(--amber)}
.mm-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mm-t{margin-left:auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mm-ctl .mm-mark{background:#f5b400;border-color:#f5b400;color:var(--ink);flex:1 1 220px}
.mm-found{display:grid;gap:8px;margin-top:12px}
.mm-row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mm-row.ok{border-color:var(--teal);background:var(--teal-tint)}
.mm-num{width:26px;height:26px;border-radius:50%;background:var(--line);text-align:center;line-height:26px;font-weight:700;flex:none}.mm-row.ok .mm-num{background:var(--teal);color:#fff}
.mm-ask{border:2px solid var(--orange);border-radius:12px;padding:14px;margin-top:12px}
.mm-ask.mm-nudge{animation:hpulse .5s ease 3}   /* Play pressed while a question is open (2026-10-25) */
@media (prefers-reduced-motion: reduce){.mm-ask.mm-nudge{animation:none;outline:3px solid var(--orange)}}
.mm-opts{display:grid;gap:8px;margin-top:8px}
.mm-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:52px;font:inherit}
.mm-opt .ico{width:34px;height:34px;flex:none}.mm-opt.no{border-color:var(--red);background:var(--red-tint)}.mm-x{margin-left:auto;color:var(--red);font-weight:700}
.qs-top{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.qs-clock{font-family:var(--font-display);font-size:26px;color:var(--navy);font-weight:700}
.qs-dots{display:flex;gap:6px;margin-left:auto}.qs-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.qs-dots i.on{background:var(--orange)}.qs-dots i.done{background:var(--teal)}
.qs-yard{border:1px solid var(--line);border-radius:12px;overflow:hidden}.qs-yard svg{display:block;width:100%;height:auto}
.qs-ground{fill:#e3ddcf}.qs-gate{fill:var(--navy)}.qs-gatet{fill:#fff;font:700 15px var(--font)}.qs-side{fill:#d6cfbd}.qs-sidet{fill:#7a705a;font:700 11px var(--font)}
.qs-barrier{stroke:#666;stroke-width:4}.qs-barrier.low{stroke:var(--red)}.qs-lane{stroke:#9a9a9a;stroke-width:2;stroke-dasharray:4 4}
.qs-fan{transition:cx .8s,cy .8s,opacity .8s;fill:var(--orange)}.qs-fan.mid{fill:var(--amber)}.qs-fan.low{fill:var(--red)}
.qs-me{fill:#f5b400;stroke:#fff;stroke-width:2}.qs-met{font:700 9px var(--font);fill:var(--ink)}
.qs-meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.qs-meter{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.qs-lab{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.qs-tr{height:10px;background:var(--surface-2);border-radius:6px;margin-top:6px;overflow:hidden}.qs-fl{height:100%;border-radius:6px;transition:width .6s}
.qs-fl.ok{background:var(--teal)}.qs-fl.mid{background:var(--amber)}.qs-fl.low{background:var(--red)}
.qs-event{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--orange-soft);background:var(--orange-tint);border-radius:12px;padding:12px 14px;margin-top:10px}
.qs-event .ico{width:48px;height:48px;flex:none}.qs-who{font-weight:700;color:var(--orange)}
.qs-opts{display:grid;gap:8px;margin-top:10px}
.qs-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:54px;font:inherit}
.qs-opt:disabled{cursor:default;opacity:.55}.qs-opt.pick{opacity:1;border-width:2px}.qs-opt.g{border-color:var(--teal)}.qs-opt.m{border-color:var(--amber)}.qs-opt.b{border-color:var(--red)}
.qs-mk{font-weight:700}.qs-opt.g .qs-mk,.qs-mk.g{color:var(--teal)}.qs-opt.m .qs-mk,.qs-mk.m{color:var(--amber)}.qs-opt.b .qs-mk,.qs-mk.b{color:var(--red)}
.qs-red{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:4px}
.qs-sum{display:grid;gap:6px;margin-top:10px}.qs-sum div{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.es-rnd{font-weight:700;color:var(--orange);margin-bottom:6px}
.es-view{border:1px solid var(--line);border-radius:12px;overflow:hidden}.es-view svg{display:block;width:100%;height:auto}
.es-ground{fill:#d8d2c2}.es-head{fill:var(--navy);transition:fill .4s}.es-head.lit{fill:#f5b400}
.es-sq{fill:rgba(245,180,0,.12);stroke:#f5b400;stroke-width:4}.es-sqt{font:700 14px var(--font);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
.es-est{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.es-val{font-family:var(--font-display);font-size:40px;color:var(--navy);line-height:1}.es-val small{font-size:16px;color:var(--muted);font-family:var(--font)}
.es-est input{width:100%;max-width:420px;accent-color:var(--orange);height:34px}.es-step{display:flex;gap:10px}.es-step .btn{min-width:56px;font-size:22px}
.es-bands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:13px;font-weight:700;text-align:center}
.es-bands div{border-radius:8px;padding:6px}.es-b0{background:var(--teal-tint);color:var(--teal)}.es-b1{background:var(--amber-tint);color:var(--amber)}.es-b2{background:var(--red-tint);color:var(--red)}
.es-bands .hit{outline:3px solid var(--ink)}
.es-dec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.es-dec button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:58px;font:inherit}
.es-dec .ico{width:36px;height:36px;flex:none}.es-dec button.no{border-color:var(--red);background:var(--red-tint)}
.chip2 .chdual{display:block;margin-top:3px;font-size:.95em;opacity:.85}
/* listenChoose */
.lc-play{margin:10px 0 6px}.lc-btn{font-size:1.1em;padding:14px 24px;min-height:52px}.lc-words{margin:4px 0 10px;color:var(--ink-2,inherit)}.lc-words summary{cursor:pointer;text-decoration:underline}.lc-ops button.yes{border-color:var(--teal);background:var(--teal-tint)}
@media (max-width:560px){.mx-list ol,.es-dec,.qs-meters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mx-pulse{animation:none}.qs-fan,.es-head{transition:none}}

/* x_compare on teach (2026-10-14): tabs per thing compared, the same rows under each */
.cmp{margin:6px 0 18px}.cmp-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.cmp-tab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--navy);font-weight:700;font-size:15px;cursor:pointer;line-height:1.25}
.cmp-tab .ico{width:44px;height:44px;display:inline-flex}.cmp-tab .ico img,.cmp-h .ico img,.cmp-row .ico img{width:100%;height:100%;object-fit:contain}
.cmp-tab.on{border-color:var(--blue);background:var(--sky-tint)}.cmp-tab.seen:not(.on)::after{content:'\2713';font-size:15px;font-weight:700;color:var(--blue)}   /* opened: a tick (the \2713 escape was lost before, 2026-10-14) */
.cmp-tab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* x_groups (2026-10-14): a big panel for the chosen group + all groups as small cards with round pictures */
.grp{margin:6px 0 18px}.grp-panel{border:2px solid var(--blue);border-radius:14px;padding:14px 10px 16px;margin-bottom:12px;background:var(--surface)}
.grp-h{margin:0 0 12px;text-align:center;font-weight:700;color:var(--blue)}.grp-h span{font-weight:400}
.grp-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;text-align:center}
.grp-item .ico{width:76px;height:76px;max-width:100%;display:inline-flex}.grp-item .ico img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.grp-item b{display:block;margin-top:6px;font-size:15px;line-height:1.3;color:var(--navy)}
.grp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grp-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit}
.grp-card.on{border-color:var(--blue);background:var(--sky-tint)}.grp-card:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.grp-t{font-weight:700;font-size:14px;color:var(--blue)}.grp-card.seen:not(.on) .grp-t::after{content:' \2713'}
.grp-mini{display:flex;gap:3px}.grp-mini .ico{width:22px;height:22px;display:inline-flex}.grp-mini .ico img{width:100%;height:100%;border-radius:50%}
@media (max-width:420px){.grp-item .ico{width:58px;height:58px}.grp-item b{font-size:13px}.grp-mini .ico{width:17px;height:17px}}
.cmp-pane{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
.cmp-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--font-display);font-size:20px;color:var(--navy)}.cmp-h .ico{width:36px;height:36px;display:inline-flex}
.cmp-row{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.cmp-row:first-of-type{border-top:0}
.cmp-row .ico{width:40px;height:40px;flex:none;display:inline-flex}.cmp-row b{display:block;color:var(--navy)}.cmp-row p{margin:2px 0 0}

/* scene cards (2026-10-14): the back keeps its line breaks; a first line is the headline (e.g. a figure) */
.scn-say{white-space:pre-line}.scn-say::first-line{font-size:1.3em;font-weight:800}

/* teach x_picture "banner" (2026-10-14): the photo as a short, wide strip above the text */
img.simg.banner{width:100%;height:clamp(120px,22vw,190px);object-fit:cover;object-position:center 50%;border-radius:12px;display:block;margin:0 0 14px}

/* country flags on a card (x_flags) — user, 2026-10-15: "flags are good but make sure this is aesthetically beautiful".
   A soft panel in the theme colours; the flags centred in balanced rows, sized by how many there are, each with a gentle lift. */
.flashflags{min-height:170px;padding:22px 26px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  gap:10px 16px;background:radial-gradient(120% 140% at 50% 0%,#fff 0%,var(--sky-tint) 70%);border-bottom:1.5px solid var(--line-2);margin:0 auto}
.flashflags .flg{display:inline-block;line-height:1;font-family:'Twemoji Country Flags','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  filter:drop-shadow(0 2px 3px rgba(42,27,82,.22));transition:transform .18s ease}
.flip .flashflags .flg,.flipcard:hover .flashflags .flg{transform:translateY(-1px)}
.flashflags.one .flg{font-size:96px}
.flashflags.few{gap:12px 22px}.flashflags.few .flg{font-size:68px}
.flashflags.some .flg{font-size:52px}
.flashflags.many{max-width:430px;gap:8px 14px}.flashflags.many .flg{font-size:40px}
@media (max-width:480px){.flashflags{min-height:150px;padding:16px 14px}.flashflags.one .flg{font-size:80px}.flashflags.few .flg{font-size:56px}
  .flashflags.some .flg{font-size:44px}.flashflags.many{max-width:300px}.flashflags.many .flg{font-size:32px}}
/* chips x_choiceIcons (2026-10-14): 'Which crowd?' as big icon tiles under a framed scene card, with a progress bar */
.tilesm .rbar{display:flex;gap:6px;margin:0 0 12px}.tilesm .rbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}.tilesm .rbar .done{background:var(--blue)}.tilesm .rbar .now{background:var(--sky)}
.tilesm .rdn{display:none}.tilesm .mscene{border:2px solid var(--blue);border-radius:14px;padding:22px 18px;text-align:center;font-size:19px;font-weight:700;line-height:1.45;color:var(--navy);background:var(--surface);margin:0}
.tilesm .mprompt{text-align:center;color:var(--muted);margin:12px 0 10px;font-size:15px}
.chips.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips.tiles .chip2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;border:2px solid var(--blue);border-radius:14px;background:#fff;color:var(--blue);font-weight:700;font-size:15px;line-height:1.25;min-height:0;width:auto;height:auto}
.chips.tiles .chip2 .ico{width:52px;height:52px;flex:none;display:inline-flex;border:0;padding:0;background:none}.chips.tiles .chip2 .ico img{width:100%;height:100%;object-fit:contain}
.chips.tiles .chip2.on{background:var(--blue);color:#fff}.chips.tiles .chip2:disabled:not(.on){opacity:.55}
@media (max-width:420px){.chips.tiles .chip2{font-size:13px;padding:12px 4px}.chips.tiles .chip2 .ico{width:40px;height:40px}}

  /* ===== card look v2 (system change 2026-10-18; user: the cards looked dull, "text is at the end") =====
     flashcards: the icons stay exactly as before (user: "icons were good"); only the layout changes. On a wide card
     (600 px and up) the icon, flags or photo sit beside the text and the text is centred in the card's height; on a phone
     the icon area is only as tall as the icon. Arrows and dots form one row under the card (the card gets the full width
     on a phone); the current dot is a long dark pill. revealCards: a "+" corner mark that becomes ✓ once read.
     Colours come only from the theme variables; right-to-left mirrors by itself (grid, flex, inline-start/end). */
  #fc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:14px;container-type:inline-size}
  #fc .fcrow{display:contents}
  #fc .flash{grid-column:1/-1;grid-row:1;margin:0;display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line-2)}
  #fc .fcarrow.prev{grid-column:1;grid-row:2}
  #fc .fcarrow.next{grid-column:3;grid-row:2}
  #fc .fdots{grid-column:2;grid-row:2;margin:0;flex-wrap:wrap;align-items:center;gap:6px}
  #fc .fdots i{width:10px;height:10px;border-radius:5px;background:var(--line-2);transform:none;box-shadow:none;transition:width .25s ease,background .25s ease}
  #fc .fdots i.on{background:var(--sky)}
  #fc .fdots i.on:not(:has(+ i.on)){width:30px;background:var(--navy)}
  #fc .fcarrow{width:46px;height:46px;border:0;background:var(--navy);color:#fff;font-size:28px;box-shadow:0 3px 10px rgba(var(--navy-rgb,24,30,48),.22);transition:transform .15s ease,background .15s ease}
  #fc .fcarrow:hover:not(:disabled){transform:translateY(-1px);background:var(--orange);color:var(--on-orange,#fff)}
  #fc .fcarrow:disabled{opacity:1;background:var(--surface-2);color:var(--faint);border:1.5px solid var(--line-2);box-shadow:none}
  /* the icon area: the icons stay exactly as before (plain, no circle or tint); the area is only as tall as the icon needs */
  #fc .flashico,#fc .flashflags{height:auto;padding:24px 20px;background:var(--surface);border-bottom:1.5px solid var(--line)}
  #fc .flashico .ico:has(img){animation:fcPop .35s ease}
  @keyframes fcPop{from{transform:scale(.92);opacity:.5}to{transform:none;opacity:1}}
  /* the text */
  #fc .fcbody{padding:18px 22px 22px;display:flex;flex-direction:column;align-items:flex-start}
  #fc .fcn{display:inline-block;font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1.3;color:var(--navy);background:var(--sky-tint);padding:4px 11px;border-radius:999px;margin:0 0 12px}
  #fc .fcbody b{font-family:var(--font-display);font-size:22px;line-height:1.2;color:var(--navy);margin:0 0 12px}
  #fc .fcbody b::after{content:"";display:block;width:40px;height:3px;border-radius:2px;background:var(--orange);margin-top:10px}
  #fc .fcbody p{font-size:16px;line-height:1.55;color:var(--ink)}
  #fc .flipcard .fchint{display:inline-flex;align-items:center;gap:8px;margin:2px 0 0;padding:8px 16px;border:1.5px solid var(--sky);border-radius:999px;background:var(--surface);color:var(--blue);font-weight:700;font-size:15px}
  #fc .flipcard .fchint::before{content:"\21BB" / "";font-size:17px;line-height:1}
  #fc .flipcard.open .fchint{display:none}
  #fc .flipcard:hover:not(.open) .fchint{background:var(--sky-tint)}
  #fc .flash.flipcard.open{border-color:var(--teal)}
  /* a wide card: the panel beside the text, the text in the middle of the card's height */
  @container (min-width:600px){
    #fc .flash:has(> .flashico),#fc .flash:has(> .flashflags){flex-direction:row;align-items:stretch}
    #fc .flash > .flashico,#fc .flash > .flashflags{flex:0 0 34%;min-height:220px;display:flex;align-items:center;justify-content:center;border-bottom:0;border-inline-end:1.5px solid var(--line)}
    #fc .flash:has(> .flashico) > .fcbody,#fc .flash:has(> .flashflags) > .fcbody{flex:1 1 auto;justify-content:center;padding:28px 32px}
    /* a photo card: the photo (whole 16:9, never cut) beside the text */
    #fc .flash:has(> img){flex-direction:row;align-items:center}
    #fc .flash > img{flex:0 0 52%;width:52%;max-height:none}
    #fc .flash:has(> img) > .fcbody{flex:1 1 auto;padding:24px 30px}
  }
  /* reveal cards (the grid of tap cards) */
  .rcard{transition:border-color .2s ease,transform .2s ease}
  .rcard:hover:not(.open){border-color:var(--sky);transform:translateY(-1px)}
  .rcard .rfront{gap:10px;font-size:15px;padding:6px 0 2px}
  .rcard::after{content:"+" / "";position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;background:var(--sky-tint);color:var(--navy);font-weight:800;font-size:18px;line-height:26px;text-align:center}
  .rcard.seen::after{content:"\2713" / "";background:var(--teal);color:#fff;font-size:15px}
  .rcard .rback{font-size:16px}
  .rback .rbt{font-family:var(--font-display);font-size:17px}
  @media (prefers-reduced-motion:reduce){#fc .flashico .ico,#fc .fdots i,#fc .fcarrow,.rcard{animation:none;transition:none}}
/* E1 (2026-10-19): a picture on each order step (x_stepMedia); text stays beside it, never inside the picture */
.si.haspic,.placed.haspic,.poolcard.haspic{display:flex;align-items:center;gap:10px}
.opic{width:84px;height:63px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.poolcard.haspic{text-align:start}

/* E1 (2026-10-20): sound buttons on a flashcard (x_audio); hidden with the text until a flip card is opened */
.flash .fcaudio{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.flash.flipcard .fcaudio{display:none} .flash.flipcard.open .fcaudio{display:flex}
/* E1 (2026-10-21): the same sound buttons on a walkthrough step, under the scene */
.moment .fcaudio{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}

/* E1 (2026-10-20): hotspot askEach pages + choices (a picture per page, then 3 answers after the place is found) */
.askpage{font-weight:700;color:var(--navy);margin:4px 0 0}
.askchoices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.askchoices .askchq{margin:0 0 2px}
.opt.askopt.g-bad{border-color:var(--line-2);opacity:.6}
/* E1 (2026-10-21): a target's own picture above its question: 16:9, cover, at most 45vh */
.askchoices .askpicwrap{margin:0}
.askchoices .askpicwrap img.askpic{width:100%;aspect-ratio:16/9;max-height:45vh;object-fit:cover;object-position:center}
.askpagebar{display:flex;flex-direction:column;align-items:stretch;margin-top:12px}
@media (min-width:1024px){.askchoices{max-width:680px}.askpagebar{align-items:flex-end}}
/* queueSim E1 (2026-10-20): the expert layout shown after a moment */
.qs-expert{margin:12px 0 4px}.qs-expert>b{display:block;margin-bottom:6px}.qs-expert .imgwrap img{width:100%;height:auto;border-radius:10px}
.m-askeach .hz2.g-ok{pointer-events:none}   /* a found place never blocks a tap on a later question at the same place */

/* allocate (E1, 2026-10-21): people cards + role slots; every state has words and a symbol, never colour alone */
.al{margin:6px 0 12px}.al-h{font-size:15px;margin:10px 0 6px;color:var(--navy)}
.al-cards{display:flex;flex-wrap:wrap;gap:8px}
.al-p{display:flex;gap:10px;align-items:center;text-align:start;border:2px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);min-height:48px;max-width:100%;flex:1 1 150px;touch-action:manipulation;user-select:none}
.al-p .ico{width:34px;height:34px;flex:none;display:inline-flex}.al-p .ico img{width:100%;height:100%;object-fit:contain}
.al-pt{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}.al-note{font-size:13px;color:var(--muted)}
.al-tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 8px;margin-top:2px}
.al-tag.spare{border-color:var(--line-2);color:var(--muted);font-weight:600}
.al-p.on{border-color:var(--blue);background:var(--sky-tint);box-shadow:0 0 0 3px rgba(var(--blue-rgb),.25)}
.al-p:disabled{opacity:.8;cursor:default}
.al-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.al-slot{border:2px dashed var(--line-2);border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column}
.al-slot.filled{border-style:solid;border-color:var(--blue);background:var(--surface)}
.al-slot.target{border-color:var(--blue)}.al-slot.over{background:var(--sky-tint);border-style:solid}
.al-slot.ok{border-style:solid;border-color:var(--teal);background:var(--teal-tint)}
.al-slot.no{border-style:solid;border-color:var(--red);background:var(--red-tint)}
.al-s{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;width:100%;border:0;background:none;font:inherit;color:var(--ink);padding:10px 12px;cursor:pointer;min-height:56px;position:relative;touch-action:manipulation;overflow-wrap:anywhere}
.al-s[aria-disabled=true]{cursor:default}
.al-sl{font-size:13px;color:var(--muted);font-weight:700}.al-who{font-weight:700}.al-who i{font-weight:400;color:var(--muted)}
.al-rm{font-size:12.5px;text-decoration:underline;color:var(--blue)}
.al-mk{font-weight:800}.al-slot.ok .al-s .al-mk{position:absolute;top:8px;inset-inline-end:10px;color:var(--teal)}
.al-fbl{margin:0;padding:0 12px 10px;font-size:13.5px;line-height:1.4}.al-fbl.ok .al-mk{color:var(--teal)}.al-fbl.no .al-mk{color:var(--red)}
.al-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-120%);background:var(--blue);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;box-shadow:var(--shadow)}
.al-p:focus-visible,.al-s:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[dir=rtl] .al-s,[dir=rtl] .al-p{text-align:right}

/* ============ LAYOUT "corporate" — media-first: a solid dark bar, a white page, square-cornered controls, hairline rules.
   Colours come only from the theme variables (the client's palette): --navy = the bar, --orange = the action colour,
   --sky = rules and progress (non-text), --muted = secondary text. Solid colours; no gradients in the interface. ============ */
body{background:var(--surface-2)}
.app{background:var(--surface)}
/* square corners and hairlines everywhere */
.btn,.opt,.card,.tile,.mcard,.callout,.lead,.q,.fb,.rcard,.scn-card .scn-face,.hpanel,.iitem,.chip,.sortcard,.bucket,.tfcard{border-radius:4px!important}
.btn{box-shadow:none!important}
.btn.primary,.btn.blue{background:var(--orange)!important;color:var(--on-orange)!important;border:2px solid var(--orange)!important}
.btn.primary:hover,.btn.blue:hover{background:var(--orange-d)!important;border-color:var(--orange-d)!important}
.btn.primary:disabled,.btn.blue:disabled{background:var(--line)!important;border-color:var(--line)!important;color:var(--muted)!important}
.btn.cl-back,.btn.ghost{background:var(--surface)!important;color:var(--navy)!important;border:2px solid var(--orange)!important}
.screen{display:flex;flex-direction:column}
.screen>*{flex:none}
.screen>.actions{order:99;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:10px;margin-top:auto;padding-top:14px}
.actions .btn{flex:1}
.actions .btn.cl-back{flex:0 0 34%}
.lead,.q{border-radius:0 4px 4px 0}
.kicker{color:var(--orange)}

/* ---- the bar ---- */
.bar.cl-bar-top{position:sticky;top:0;z-index:30;background:var(--navy)!important;border-bottom:0;padding:10px var(--pad);backdrop-filter:none}
.cl-barrow{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr}   /* same in both languages: logo on the right (brand rule, both design sheets) */
.cl-help span{unicode-bidi:isolate}
.cl-tools{display:flex;align-items:center;gap:8px}
.cl-logo{height:30px;width:auto;display:block}
.cl-lang{display:inline-flex;border:2px solid #fff;border-radius:4px;overflow:hidden}
.cl-lang button{font:inherit;font-weight:700;font-size:13px;min-width:40px;min-height:34px;padding:0 8px;border:0;background:transparent;color:#fff;cursor:pointer}
.cl-lang button.on{background:#fff;color:var(--navy)}
.cl-help{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:13px;min-height:38px;padding:0 12px 0 6px;border:2px solid #fff;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
.cl-help .cl-q{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}
.cl-lang button:focus-visible,.cl-help:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---- lesson meta line ---- */
.cl-lmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cl-crumb{font:inherit;font-weight:700;color:var(--orange);background:none;border:0;padding:6px 0;min-height:32px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cl-crumb::before{content:"‹";font-size:20px;line-height:1}
[dir=rtl] .cl-crumb::before{content:"›"}
.cl-crumb:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---- pages ---- */
.screen.cl-page{padding-top:0}
.cl-hero{position:relative;margin:0 calc(var(--pad)*-1) 0;aspect-ratio:16/9;overflow:hidden;background:var(--sky-tint)}
.cl-hero img,.cl-hero video,.cl-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){.cl-heroclip{display:none}}   /* the still stays */
.cl-ph{position:absolute;inset:0;background:var(--sky-tint);overflow:hidden}
.cl-ph::after{content:"";position:absolute;left:50%;top:50%;width:34%;max-width:120px;aspect-ratio:1/1.15;transform:translate(-50%,-50%);background:var(--sky);opacity:.28;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cl-code{position:absolute;inset-inline-start:var(--pad);bottom:14px;background:var(--navy);color:#fff;font-family:var(--font-display);font-size:15px;padding:4px 12px}
.cl-body{padding-top:14px}
.cl-meta{color:var(--muted);font-size:14px;margin:0 0 4px}
.cl-title{font-size:26px;line-height:1.15;color:var(--navy);margin:0 0 14px}
.cl-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font:inherit;font-weight:700;font-size:15px;color:var(--navy);
  background:none;border:0;border-top:2px solid var(--sky);padding:14px 2px;min-height:52px;cursor:pointer;text-align:start}
.cl-row:focus-visible,.cl-next:focus-visible,.cl-lesson:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.cl-chev{width:10px;height:10px;border-inline-end:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(-45deg);flex:none}
[dir=rtl] .cl-chev{transform:rotate(45deg)}
.cl-row.open .cl-chev{transform:rotate(45deg)}
.cl-outcomes{margin:0 0 10px;padding-inline-start:20px;color:var(--ink);font-size:14.5px;line-height:1.5}
.cl-progress{border-top:2px solid var(--sky);padding:12px 2px 14px}
.cl-progress p{margin:0 0 8px;color:var(--muted);font-size:14px}
.cl-bar{height:8px;background:var(--line);overflow:hidden}
.cl-bar i{display:block;height:100%;background:var(--navy)}
.cl-next{width:100%;display:flex;align-items:center;gap:12px;font:inherit;text-align:start;background:var(--surface);border:2px solid var(--sky);border-radius:4px;padding:10px;margin:0 0 4px;cursor:pointer;position:relative;color:var(--ink)}
.cl-thumb{position:relative;flex:none;width:96px;aspect-ratio:16/10;overflow:hidden;border-radius:2px;display:block}
.cl-thumb.big{width:118px}
.cl-play{position:absolute;inset-inline-start:52px;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.cl-play::after{content:"";position:absolute;left:13px;top:10px;border:7px solid transparent;border-left:11px solid var(--navy);border-right:0}
.cl-nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-nt small{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cl-nt b{font-family:var(--font-display);font-size:17px;color:var(--navy);line-height:1.15}
.cl-nt span{font-size:13px;color:var(--muted)}
.cl-group{margin-top:10px}
.cl-group h3{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-top:2px solid var(--sky);padding-top:8px;margin:0 0 4px}
.cl-group ol{list-style:none;margin:0;padding:0}
.cl-lesson{width:100%;display:flex;align-items:center;gap:12px;font:inherit;text-align:start;background:none;border:0;border-radius:4px;padding:8px 6px;min-height:64px;cursor:pointer;color:var(--ink)}
.cl-lesson.next{background:var(--orange);color:var(--on-orange)}
.cl-lt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cl-lt b{font-size:15.5px;line-height:1.2}
.cl-lt span{font-size:13px;color:var(--muted)}
.cl-lesson.next .cl-lt span{color:var(--on-orange);opacity:.9}
.cl-min{position:absolute;inset-inline-end:0;bottom:0;background:var(--navy);color:#fff;font-size:11px;padding:1px 6px}
.cl-st{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--navy)}
.cl-lesson.done .cl-st{background:var(--orange);border-color:var(--orange);position:relative}
.cl-lesson.done .cl-st::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.cl-lesson.next .cl-st{background:#fff;border-color:#fff;position:relative}
.cl-lesson.next .cl-st::after{content:"";position:absolute;left:8px;top:6px;border:6px solid transparent;border-left:9px solid var(--navy);border-right:0}
[dir=rtl] .cl-lesson.next .cl-st::after{left:auto;right:8px;border-left:0;border-right:9px solid var(--navy)}
@media (prefers-reduced-motion:reduce){.cl-row .cl-chev{transition:none}}

/* ===================== PHASE 2 — lesson screens in the corporate style ===================== */
/* square corners on every card-like component; dots, numbers, avatars and the phone mock-up stay round */
.app .callout,.app .hero,.app .card,.app .opt,.app .tile,.app .si,.app .bucket,.app .scene-wrap,.app .fb,.app .consq,.app .ipt,.app .toks,
.app .frame,.app .soundcard,.app .pnl,.app .exl,.app .rkcard,.app .mapblock,.app .btn,.app .btn.sm,.app .guide,.app .vidwrap,.app .flash,
.app .htile,.app .scene,.app .hot,.app .qframe2,.app .post,.app .chip2,.app .rdecide,.app .moodwrap,.app .scorecard,.app .badge,.app .lstage,
.app .quote,.app .iitem,.app .tfcard,.app .citem,.app .rcard,.app .jaid,.app .jitem,.app .sscore,.app .srrow,.app .streak,.app .mbtn,.app .mnode,.app .mchip,
.app .hitem,.app .cchoice,.app .rslot,.app .rpreview,.app .mediaph,.app .simg,.app .moment img,.app .stp,.app .belt,.app .beltcard,.app .bin,
.app .dcard,.app .deckcard,.app .fallback,.app .hcard,.app .mcard,.app .pdesc,.app .phrase,.app .pitem,.app .poolcard,.app .reveal,.app .stamprow,
.app .transcript,.app .uimock,.app .m-done,.app .m-thumbs-paper,.app .m-stamp-paper,.app .m-stack li,.app .m-path li,.app .m-pool>*,.app .tfb,
.app .m-thumbs-row .tfb,.app .skin-speech .opt,.app .skin-feed .opt,.app .gbubble,.app .cbub,.app .timerchip,.app .xp,.app .scn,.app .scn-face{border-radius:4px!important}
.app .card,.app .opt,.app .tile,.app .callout,.app .vidwrap,.app .scene-wrap,.app .scene,.app .rcard,.app .iitem,.app .flash,.app .htile,.app .exl,
.app .rkcard,.app .rdecide,.app .scorecard,.app .tfcard,.app .lead,.app .q,.app .hcard,.app .qframe2,.app .opt[aria-pressed="true"],.app .opt.g-pick{box-shadow:none!important}
.app .lead{background:var(--surface);border-inline-start-width:4px}
.app .q{background:var(--sky-tint);border-inline-start:4px solid var(--orange)}
/* answer rows: full width, a ring that fills when chosen, a thick border on the chosen row (no colour alone) */
.app .opt{background:var(--surface);border:2px solid var(--sky);min-height:56px}
.app .opt .dot{border-color:var(--navy)}
.app .opt.g-pick,.app .opt[aria-pressed="true"]{border:3px solid var(--navy);background:var(--sky-tint)}
.app .opt.g-pick .dot::after,.app .opt[aria-pressed="true"] .dot::after{background:var(--navy)}
/* feedback panel: a solid band with the verdict first */
.app .fb{border:0;border-inline-start:6px solid currentColor;padding:14px 16px}
.app .fb.good{background:var(--teal-tint);color:var(--teal)} .app .fb.good .body,.app .fb.good p{color:var(--ink)}
.app .fb.bad{background:var(--red-tint);color:var(--red)} .app .fb.bad .body,.app .fb.bad p{color:var(--ink)}
/* video: edge to edge on a phone, captions in a solid box */
.app .vidwrap,.app .screen>.mediaph{margin-left:calc(var(--pad)*-1);margin-right:calc(var(--pad)*-1);border-radius:0!important}
.app video::cue{background:var(--navy);color:#fff;font-family:var(--font)}
.app .vc{background:var(--navy);border-radius:2px}
/* tabs on video lessons */
.cl-tabs{display:flex;border-bottom:2px solid var(--sky);margin:6px 0 0}
.cl-tabs button{flex:1;font:inherit;font-size:14.5px;font-weight:700;color:var(--muted);background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 4px;min-height:44px;cursor:pointer}
.cl-tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.cl-tabs button:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.cl-panel{padding:12px 0}
.cl-panel h4{font-family:var(--font);font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.cl-tx{margin:0;padding:0;list-style:none}
.cl-tx li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.cl-vtitle{font-size:21px;line-height:1.2;margin:4px 0 0}

/* ===================== PHASE 3 — tablet and desktop ===================== */
.cl-side,.cl-aside{display:none}
@media (min-width:600px){
  .app{max-width:1000px}
  .screen.cl-page.cl-home{display:grid!important;grid-template-columns:1.1fr 1fr;column-gap:28px;align-items:start}
  .cl-home .cl-hero{grid-column:1;margin:0;aspect-ratio:16/10}
  .cl-home .cl-body{grid-column:1}
  .cl-home .cl-side{display:block;grid-column:2;grid-row:1 / span 4;padding-top:6px}
  .cl-home>.actions{grid-column:1}
  .cl-home .cl-allrow{display:none}
}
@media (min-width:1024px){
  .app{max-width:1180px}
  .stage.cl-withaside{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
  /* the lesson menu stays put: pinned just under the bar (whatever the bar's height on this page) and scrolls inside itself when it is taller than the window */
  .stage.cl-withaside .cl-aside{display:block;position:sticky;top:calc(var(--cl-barh,72px) + 8px);max-height:calc(100vh - var(--cl-barh,72px) - 36px);overflow-y:auto;overscroll-behavior:contain;border-inline-end:1px solid var(--line);padding-inline-end:16px}
  .cl-aside h3{font-family:var(--font);font-size:12px;font-weight:700;color:var(--muted);margin:6px 0}
  .cl-aside .cl-lesson{min-height:44px;padding:6px}
  .cl-aside .cl-thumb{display:none}
}
/* landscape phone on a video lesson: the chrome steps back, the picture fills the screen */
@media (orientation:landscape) and (max-height:520px){
  body.cl-onvideo .bar,body.cl-onvideo .cl-lmeta,body.cl-onvideo .cl-tabs,body.cl-onvideo .cl-panel,body.cl-onvideo .screen>.actions{display:none!important}
  body.cl-onvideo .vidwrap{position:fixed;inset:0;z-index:60;margin:0;background:#000}
  body.cl-onvideo .vidwrap video{width:100%;height:100%;object-fit:contain}
  body.cl-onvideo .cl-vskip{display:inline-flex}
}
/* language screen with a start picture: half the window on a computer, picture left, the choices right (not a background) */
@media (min-width:1024px){
  .screen.has-langpic{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto auto;column-gap:48px;align-items:center;min-height:calc(100dvh - var(--cl-barh,72px) - 48px);max-width:none}
  .screen.has-langpic .langpic{grid-column:1;grid-row:1 / span 3;height:calc(100dvh - var(--cl-barh,72px) - 48px);max-height:none;min-height:420px;object-fit:cover;object-position:50% 0;border-radius:4px;margin:0;position:sticky;top:calc(var(--cl-barh,72px) + 12px)}
  .screen.has-langpic .langpick{grid-column:2;grid-row:1;align-self:end;margin:0 0 8px}
  .screen.has-langpic .actions{grid-column:2;grid-row:2;justify-content:center;position:static;background:none;margin:12px 0}
  .screen.has-langpic .langnote{grid-column:2;grid-row:3;align-self:start}
}
/* on a video lesson the buttons stay right under the clip (the frame's order:99 would send them below the tabs) */
.screen.cl-video>.actions{order:0;position:static}
/* Skip: shown only while the clip fills a landscape phone screen; returns to the lesson so Next is reachable */
.cl-vskip{display:none;position:absolute;left:12px;top:12px;z-index:61;align-items:center;min-height:38px;padding:0 14px;border:2px solid #fff;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
[dir=rtl] .cl-vskip{left:auto;right:12px}

/* a video lesson whose clip is not made yet: its text version sits on the video stage (16:9, edge to edge) */
.app .fallback.cl-vstage{margin:0 calc(var(--pad)*-1) 12px;border:0;border-radius:0!important;background:var(--navy);color:#fff;aspect-ratio:16/9;
  display:flex;align-items:center;justify-content:center;padding:18px 22px;position:relative;overflow:visible}  /* 16:9 at least; a long text version makes it taller — text is never clipped */
.app .fallback.cl-vstage p{color:#fff;font-size:15px;line-height:1.45;text-align:center;margin:0;background:rgba(0,0,0,.35);padding:8px 12px}
.app .fallback.cl-vstage::before{content:"";position:absolute;inset:0;background:var(--blue);opacity:.35;clip-path:polygon(70% 0,100% 0,100% 100%,40% 100%)}
.app .fallback.cl-vstage .fbp{position:relative}
/* desktop: undo the default frame's side-rail bar — this layout keeps the bar on top and centres the page */
@media (min-width:1024px){
  body{padding:0;background:var(--surface-2)}
  .app{display:block!important;max-width:1180px!important;margin:0 auto;min-height:100dvh;border:0;border-radius:0!important;box-shadow:none;background:var(--surface);overflow:visible!important}
  .stage{overflow:visible!important}   /* the window scrolls, not the frame: the bar and the lesson menu stick to the window (overflow on these boxes broke position:sticky) */
  .bar.cl-bar-top{position:sticky!important;top:0;height:auto!important;overflow:visible!important;display:block!important;padding:12px 28px!important;flex-direction:row}
  .stage{padding:0 28px 28px}
  .btn{min-width:0}
  .actions{align-items:center}
  .screen>.actions .btn{max-width:260px}
}

/* ===================== course features kept in the bar: menu · XP · progress · job aids · timer ===================== */
.cl-end{display:flex;align-items:center;gap:10px}
.cl-menu,.cl-icon{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:13px;min-height:38px;min-width:38px;justify-content:center;
  padding:0 8px;border:2px solid #fff;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
.cl-burger{display:inline-grid;gap:3px}.cl-burger i{display:block;width:16px;height:2px;background:#fff}
.cl-menu:focus-visible,.cl-icon:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.cl-xp{background:#fff!important;color:var(--navy)!important;font-weight:800;font-size:12.5px;padding:4px 8px;border-radius:2px!important;white-space:nowrap}
.bar.cl-bar-top .cl-sub{margin:10px calc(var(--pad)*-1) -10px;padding:8px var(--pad) 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar.cl-bar-top.cl-onpage .cl-sub{display:none}
.cl-sub .barmeta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cl-sub .mtitle{font-size:14px;color:var(--navy);margin:0;line-height:1.2}
.cl-sub .ready{font-size:12px;color:var(--muted);text-align:end;white-space:nowrap}

/* horizontal swipe (touch, pen or mouse drag) → fn('next'|'prev'); mirrored in RTL. Vertical scrolling is left alone. */
function onSwipe(elm,fn){
  var x0=null,y0=null,id=null;
  elm.style.touchAction='pan-y';
  /* swipe is a touch/pen extra; a mouse drag (e.g. selecting text) never answers — mouse users have the buttons */
  elm.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'||(e.button&&e.button!==0))return;x0=e.clientX;y0=e.clientY;id=e.pointerId;});
  function end(e){
    if(x0===null||e.pointerId!==id)return;
    var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;   /* a clear sideways swipe only */
    var fwd=dx<0;if(RTL[LANG])fwd=!fwd;
    fn(fwd?'next':'prev');
  }
  elm.addEventListener('pointerup',end);elm.addEventListener('pointercancel',function(){x0=null;});
}

/* SCORM: report final score + per-question results. items:[{id,response,correct,weight}] */
function reportScore(pct,passed,items){
  /* a pass is never taken back: a later lower attempt keeps the best score and the "passed" status */
  if(window.SCORM&&SCORM.present){
    if(SCORM.get('cmi.core.lesson_status')==='passed')passed=true;
    var prevRaw=parseFloat(SCORM.get('cmi.core.score.raw'));if(!isNaN(prevRaw)&&prevRaw>pct)pct=prevRaw;
  }
  st.finalPct=pct;st.finalPass=passed;
  if(!(window.SCORM&&SCORM.present))return;
  SCORM.set('cmi.core.score.min','0');
  SCORM.set('cmi.core.score.max','100');
  SCORM.set('cmi.core.score.raw',String(pct));
  SCORM.set('cmi.core.lesson_status',passed?'passed':'failed');
  /* interactions are a journal: each attempt adds new records after the existing ones (cmi.interactions._count) */
  var base=parseInt(SCORM.get('cmi.interactions._count'),10);if(isNaN(base))base=0;
  (items||[]).forEach(function(it,j){var i=base+j;
    SCORM.set('cmi.interactions.'+i+'.id',it.id);
    SCORM.set('cmi.interactions.'+i+'.type','choice');
    SCORM.set('cmi.interactions.'+i+'.student_response',String(it.response));
    SCORM.set('cmi.interactions.'+i+'.result',it.correct?'correct':'wrong');
    SCORM.set('cmi.interactions.'+i+'.weighting',String(it.weight||1));
  });
  SCORM.commit();
}

tion sentence 1", "xp": {"complete": 5}, "media": ["smp42-v03-moments"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp42-S084", "en": "Football moments", "ar": "لحظات كرة القدم"}, "afterText": {"sid": "smp42-S085", "en": "Watch what each moment does to the crowd.", "ar": "شاهدوا أثر كل لحظة في الجمهور."}, "x_takeaway": {"sid": "smp42-S086", "en": "Some football moments change a crowd fast.", "ar": "بعض لحظات كرة القدم تغيّر أجواء الجمهور بسرعة."}, "placeholder": {"id": "VID-CP21", "owner": "ID", "note": {"sid": "smp42-S087", "en": "Video coming soon.", "ar": "الفيديو قريبًا."}}, "x_transcript": {"sid": "smp42-S088", "en": "What you see: A goal: fans surge forward and rush down the stepped gangway. A few climb onto seats; at the front a red flare glows, smoke rising; nobody near it. Home fans in green and white and visiting fans in a plain other colour walk towards each other, scarves held up, chanting. The two groups meet near the stairs; an anonymous marshal stands back, calm, watching. The final whistle: people stand at once; some head down the stairs, others push back up. Mixed directions on the stairs and at a vomitory. A packed stadium on a big night: every seat full, plain single-colour green and white flags waving, the whole crowd loud and on its feet. Narrator: Some football moments change a crowd fast. A goal: people surge forward, rush down stairs, climb, sometimes light flares - report it, never handle it. Rivalry: scarves, chants, and rival groups meeting on concourses or on the way out - stay neutral and report groups gathering. Late goals and the final whistle cause sudden movement - stay in position and watch the stairs. And big matches bring bigger emotions.", "ar": "ما ترونه: بعد تسجيل هدف، يندفع المشجعون إلى الأمام وينزلون بسرعة عبر الممرات المدرّجة. ويتسلق بعضهم المقاعد. في المقدمة، يشتعل شعاع أحمر وتتصاعد منه سحابة دخان، ولا يوجد أحد بالقرب منه. يتجه مشجعو الفريق المضيف، بملابسهم الخضراء والبيضاء، ومشجعو الفريق الضيف، بلونهم المختلف، نحو بعضهم وهم يرفعون الأوشحة ويرددون الهتافات. تلتقي المجموعتان قرب السلالم، فيما يقف أحد المنظِّمين بعيدًا بهدوء ويراقب. عند صافرة النهاية، يقف الناس دفعة واحدة؛ يتجه بعضهم نزولًا على السلالم، بينما يدفع آخرون صعودًا. تتحرك الحشود في اتجاهات متعاكسة عند السلالم وممر المدرج. في مباراة كبيرة، يمتلئ الملعب عن آخره، وترفرف أعلام خضراء وبيضاء بلون واحد، ويقف الجمهور كله ويهتف بصوت عالٍ. المعلّق الصوتي: بعض لحظات كرة القدم تغيّر أجواء الجمهور بسرعة. بعد تسجيل هدف، يندفع الناس إلى الأمام وينزلون بسرعة على السلالم أو يتسلقون، وقد يشعل بعضهم الشماريخ أحيانًا. أبلغوا عنها، ولا تلمسوها أبدًا. أما التنافس، فتظهر علاماته في الأوشحة والهتافات والتقاء مجموعات المشجعين المتنافسة في الممرات أو أثناء المغادرة. التزموا الحياد، وأبلغوا عن تجمّع المجموعات. وتؤدي الأهداف المتأخرة وصافرة النهاية إلى تحرك مفاجئ؛ لذا ابقوا في مواقعكم وراقبوا السلالم. كما تثير المباريات الكبيرة مشاعر أقوى."}, "x_illustration": true, "x_objective": {"sid": "smp42-S089", "en": "Describe how crowds react to goals, celebrations, rivalries, pressure, frustration and misinformation - and the marshal's response to each.", "ar": "صِفوا ردود فعل الجمهور تجاه الأهداف والاحتفالات والتنافس والضغط والإحباط والمعلومات المضللة، ووضّحوا استجابة المنظِّمين لكل منها."}, "x_previewNames": ["smp42-s2.1-main-c1-moments-goals-and-celebrations", "smp42-s2.1-main-c2-moments-rivalry", "smp42-s2.1-main-c3-moments-late-goals-and", "smp42-s2.1-main-c4-moments-big-matches"], "x_mediaMissing": false}, {"id": "2.2", "section": "2", "lo": [2], "type": "flashcards", "src": "CLIENT AFC27 - SMP Lesson 4.2 - Crowd Psychology at Football - 20min E-learning Script v1 MW - FAN (1).docx CP-2.1 the 4 moment cards verbatim, one at a time (over 90 characters, C2); '[report - never handle]' → '- report, never handle' (brackets out, R3; LOC point 5); task ours (C1)", "xp": {"complete": 5}, "bloom": "understand", "safetyCritical": false, "a11y": {"alternative": "One card at a time: the card is a button that shows its text; previous / next buttons ت التنافس، ومباريات خروج المغلوب تثير مشاعر أقوى وتبدأ أجواؤها بالتوتر مبكرًا."}}], "x_flag": {"text": "surge forward and down the stairs, climbing, standing on seats, flares - report, never handle → watch gangways and the front, report", "note": "LOC point 5: AFC27 ground rules on flares (taught in 9.2 / 15.2) - default 'Flares: report, never handle'."}}, {"id": "2.3", "section": "2", "lo": [2], "type": "video", "src": "CLIENT AFC27 - SMP Lesson 4.2 - Crowd Psychology at Football - 20min E-learning Script v1 MW - FAN (1).docx CP-2.2 presenter piece (V5) as a narrated animation (decision 145; SA-1); the whole narration as voice-over; watch-for ours (R2); learning point = narration sentence 5", "xp": {"complete": 5}, "media": ["smp42-v11-rumours"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp42-S100", "en": "Pressure, frustration and rumours", "ar": "الضغط والإحباط والشائعات"}, "afterText": {"sid": "smp42-S101", "en": "Watch how a rumour spreads.", "ar": "شاهدوا كيف تنتشر الشائعة."}, "x_takeaway": {"sid": "smp42-S102", "en": "Never guess, and never repeat a rumour.", "ar": "لا تخمّنوا أبدًا، ولا تكرّروا الشائعات."}, "placeholder": {"id": "VID-CP22-V5", "owner": "ID", "note": {"sid": "smp42-S103", "en": "Video coming soon.", "ar": "الفيديو قريبًا."}}, "x_transcript": {"sid": "smp42-S104", "en": "What you see: A queue stands still in the heat; people fan themselves and sigh. One person looks at a phone; then the next; phone screens light up one after another down the queue (nothing readable). An anonymous marshal, back to the camera, gives the front of the queue information with a calm open hand. People put their phones away, nod and the queue starts to move. Narrator: Pressure, heat and long waits make people short-tempered. When people don't know what's happening, they fill the gap with rumours - and phones spread them in minutes. The answer is information. Tell people what is happening, using facts from your supervisor. Never guess, and never repeat a rumour.", "ar": "ما ترونه: يقف طابور في الحر من دون أن يتحرك؛ يلوّح الناس بأيديهم طلبًا للهواء ويتنهدون. ينظر أحدهم إلى هاتفه، ثم ينظر الشخص الذي يليه إلى هاتفه، وتضيء الشاشات واحدة تلو الأخرى على امتداد الطابور، من دون ظهور أي نص مقروء. يشرح أحد المنظِّمين، من دون أن يظهر وجهه، للأشخاص في مقدمة الطابور ما يحدث، مستخدمًا إشارة هادئة بيده المفتوحة. يضع الناس هواتفهم جانبًا، ويومئون، ثم يبدأ الطابور بالتحرك. المعلّق الصوتي: يجعل الضغط والحرّ والانتظار الطويل الناس سريعي الانفعال. وعندما لا يعرف الناس ما يحدث، يملؤون الفراغ بالشائعات، وتساعد الهواتف على نشرها خلال دقائق. الحل هو تزويدهم بالمعلومات. أخبروهم بما يحدث، مستندين إلى معلومات مؤكدة من مشرفكم. لا تخمّنوا أبدًا، ولا تكرّروا الشائعات."}, "x_illustration": true, "x_previewNames": ["smp42-s2.2-main-c1-rumours-heat-and-waiting", "smp42-s2.2-main-c2-rumours-information-calms"], "x_mediaMissing": false}, {"id": "2.4", "section": "2", "lo": [2], "type": "iconStrip", "src": "CLIENT AFC27 - SMP Lesson 4.2 - Crowd Psychology at Football - 20min E-learning Script v1 MW - FAN (1).docx CP-2.2 the 3 icon lines and the action bar verbatim; narration sentences 3-4 as the lead (SA-3); task ours (C1)", "xp": {"complete": 5}, "bloom": "understand", "safetyCritical": false, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "heading": {"sid": "smp42-S105", "en": "Pressure, frustration and rumours", "ar": "الضغط والإحباط والشائعات"}, "situation": {"sid": "smp42-S106", "en": "The answer is information. Tell people what is happening, using facts from your supervisor.", "ar": "الحل هو تزويد الناس بالمعلومات. أخبروهم بما يحدث، استنادًا إلى معلومات مؤكدة من مشرفكم."}, "task": {"sid": "smp42-S107", "en": "Tap each one. Open all three to continue.", "ar": "اضغطوا على كل بطاقة. افتحوا البطاقات الثلاث كلها للمتابعة."}, "items": [{"icon": "thermometer", "label": {"sid": "smp42-S108", "en": "Pressure", "ar": "الضغط"}, function seededShuffle(arr,seed){var a=arr.slice(),s=seed>>>0;for(var i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;var j=s%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Draw the quiz for one attempt (indexes into pool):
   every objective at least once (perObjective → that many from every objective), then fill up to count from the rest;
   variantGroup → at most one item of a group per attempt; randomise false → keep the pool's order. */
function quizDraw(pool,count,attempt,s,seen){
  var seed=attempt*7919+pool.length*31,used={},picked=[];
  var idx=s.randomise===false?pool.map(function(_,i){return i;}):seededShuffle(pool.map(function(_,i){return i;}),seed);
  /* E2 (2026-10-25): x_formFirst → attempt 1 is the items marked x_form (the client's own form); a later attempt takes items not shown before first */
  if(s.x_formFirst&&attempt===1){var fa=idx.filter(function(i){return pool[i].x_form;});if(fa.length)return s.randomise===false?fa.sort(function(a,b){return a-b;}):fa;}
  if(seen&&seen.length)idx=idx.filter(function(i){return seen.indexOf(i)<0;}).concat(idx.filter(function(i){return seen.indexOf(i)>=0;}));
  function take(i){var g=pool[i].variantGroup;if(picked.indexOf(i)>=0||(g&&used[g]))return false;picked.push(i);if(g)used[g]=1;return true;}
  function lo(q){var l=q.lo;l=Array.isArray(l)?l:[l];for(var k=0;k<l.length;k++)if(typeof l[k]==='number')return l[k];return null;}
  /* HARD RULE (user, 2026-10-14): every objective in the pool is drawn at least once whenever count allows; perObjective raises the minimum */
  var objs=[];idx.forEach(function(i){var n=lo(pool[i]);if(n!==null&&objs.indexOf(n)<0)objs.push(n);});
  objs.sort(function(a,b){return a-b;});
  var per=Math.max(s.perObjective||0,count>=objs.length?1:0);
  for(var r=1;r<=per;r++)objs.forEach(function(n){var got=0;idx.forEach(function(i){if(lo(pool[i])===n&&picked.indexOf(i)>=0)got++;});idx.forEach(function(i){if(got<r&&picked.length<count&&lo(pool[i])===n&&take(i))got++;});});
  idx.forEach(function(i){if(picked.length<count)take(i);});
  if(s.minSafety){   /* at least n safety-critical items: swap out only a non-safety item whose objective stays covered — never the last of an objective */
    var sc=function(i){return !!pool[i].safetyCritical;};
    while(picked.filter(sc).length<s.minSafety){var done=false;
      idx.forEach(function(add){if(done||!sc(add)||picked.indexOf(add)>=0)return;var g=pool[add].variantGroup;
        picked.forEach(function(i,k){if(done||sc(i))return;var n=lo(pool[i]);
          if(n!==null&&lo(pool[add])!==n&&picked.filter(function(x){return lo(pool[x])===n;}).length<2)return;
          if(g&&picked.some(function(x,kk){return kk!==k&&pool[x].variantGroup===g;}))return;
          picked[k]=add;done=true;});});
      if(!done)break;}
  }
  return s.randomise===false?picked.sort(function(a,b){return a-b;}):seededShuffle(picked,seed+1);
}

/* ============ SCHEMA 2.0 ADAPTER ============
   The script skill (elearning-module-designer) writes script.json "schema 2.0":
     strings {sid, en, ar?}, section as string, one answer model (score 0/1/2), media = asset ids,
     consequence {outcome, why, next}, multiselect options[], imageTiles tiles[]{media, score, feedback},
     branch goto, order feedbackCorrect/feedbackWrong, placeholder {id, owner, note}, module.quiz, module.passMark {percent, display}.
   This file normalises such a script in place so the runtime (built for the earlier shape) renders it unchanged.
   Runs before buildFromScript(). Idempotent. */

function sc2_rating(o){if(o.rating)return o.rating;if('score' in o)return o.score===2?'best':o.score===1?'ok':'wrong';return o.correct===true?'best':'wrong';}
function sc2_assetFile(id,kind){
  if(!id||/\.(mp4|jpg|jpeg|png|webp|gif|svg)$/i.test(id))return id;
  var a=(COURSE.assets||{})[id];
  if(a&&a.file)return a.file;
  return id+(((a&&a.kind)==='video'||kind==='video')?'.mp4':'.jpg');
}
function adaptSchema2(S){
  if(!S||S.__adapted)return S;S.__adapted=true;
  var M=S.module||{};
  if(M.passMark&&typeof M.passMark==='object'){COURSE.passDisplay=M.passMark.display;}
  (M.sections||[]).forEach(function(sec){if(typeof sec.n==='string'&&/^\d+$/.test(sec.n))sec.n=+sec.n;});
  var Q=M.quiz||null;
  function fixMedia(s){
    if(!s.media)return;
    var arr=Array.isArray(s.media)?s.media:[s.media];
    s.media=arr.map(function(m){return sc2_assetFile(m,s.type==='video'?'video':null);});
  }
  function fixScreen(s){
    if(typeof s.section==='string'&&/^\d+$/.test(s.section))s.section=+s.section;
    fixMedia(s);
    if(s.placeholder&&typeof s.placeholder==='object'){s.x_placeholder=true;if(!s.x_placeholderNote)s.x_placeholderNote=s.placeholder.note||s.placeholder.id;}
    (s.options||[]).forEach(function(o){if(!o.rating)o.rating=sc2_rating(o);if(o.goto&&!o.goTo)o.goTo=o.goto;});
    switch(s.type){
      case 'multiselect':
        if(!s.items&&s.options){s.items=s.options.map(function(o){return {text:o.text,correct:sc2_rating(o)!=='wrong',icon:o.icon,why:o.feedback};});}
        if(s.feedbackCorrect&&!s.x_feedbackCorrect)s.x_feedbackCorrect=s.feedbackCorrect;
        break;
      case 'imageTiles':
        (s.tiles||[]).forEach(function(t){if(t.correct===undefined&&'score' in t)t.correct=t.score===2;if(!t.why&&t.feedback)t.why=t.feedback;if(t.media)t.media=sc2_assetFile(t.media,null);});
        break;
      case 'consequence':
        if(!s.headline&&s.outcome)s.headline=s.outcome;
        if(!s.lines&&s.why)s.lines=[s.why];
        if(!s.tone)s.tone='mixed';
        if(s.next&&!s.x_next)s.x_next=s.next;
        break;
      case 'branch':
        if(!s.situation&&s.scene)s.situation=s.scene;
        break;
      case 'order':
        if(!s.okText&&s.feedbackCorrect)s.okText=s.feedbackCorrect;
        if(!s.noText&&s.feedbackWrong)s.noText=s.feedbackWrong;
        break;
      case 'moduleQuiz':
        if(Q){if(s.count===undefined)s.count=Q.itemsShown;if(s.passMark===undefined)s.passMark=Q.passPercent;if(s.retries===undefined)s.retries=Q.retries;if(s.feedbackAfterEach===undefined)s.feedbackAfterEach=Q.feedbackAfterEach!==false;
          if(s.perObjective===undefined)s.perObjective=Q.perObjective;if(s.shuffleOptions===undefined)s.shuffleOptions=Q.shuffleOptions;if(s.randomise===undefined)s.randomise=Q.randomise;if(s.minSafety===undefined)s.minSafety=Q.minSafety;if(s.safetyMustPass===undefined)s.safetyMustPass=Q.safetyMustPass;}
        if(!s.lines&&s.intro)s.lines=[s.intro];
        break;
      case 'flashcards':
        (s.cards||[]).forEach(function(c){if(c.media)c.media=sc2_assetFile(c.media,null);});
        break;
      case 'finalQuestion':
        if(typeof s.learnIn==='string'&&!s.learnInText)s.x_learnInCode=s.learnIn;
        break;
    }
  }
  (S.screens||[]).forEach(fixScreen);
  (S.quizPool||[]).forEach(function(q){fixScreen(q);if(!q.stem&&q.task)q.stem=q.task;});
  return S;

/* ---- 5. baseline decisions (E1, 2026-10-25): confidence after the first pick, baseline points, LMS record ----
   branch.x_confidence  {id:"B1", prompt:{…}, labels:[{…}×n]} → on the FIRST pick the choices stay, the question and n buttons show,

/* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============
   The same content (script.json) can be played with different mechanics, so a module never feels like
   "the same sort again". A screen picks one with `x_mechanic`; when it does not, the engine rotates through
   the mechanics that fit the content, seeded by the module id (different modules → different order).
   Every mechanic: buttons first (tap + keyboard; swipe/drag only as extras), mirrored in RTL, never timed,
   feedback says why, first-time-correct XP only when no mistake was made.

     sort        buckets (tap card → column) · deck (one card at a time, two big choices, swipe optional)
                 · belt (cards queue on a conveyor, send each to a bin) · stamps (a sheet: stamp every line, then check)
     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe; the default, no rotation) · stamp (stamp on a paper) · thumbs (👍 / 👎 mark) — all with the same ✓ True / ✕ False buttons
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)
     match       pairs (tap an item, then its partner) · memory (face-down cards, turn two at a time)  [new type]
     hotspot     findAll (several correct spots on a picture: "Found 2 of 4") · askEach (the spots asked one at a time) — explicit only                       */

var MECH={
  sort:['buckets','deck','belt','stamps'],
  mcq:['list','tiles','doors','chat'],
  order:['list','stack','path'],
  trueFalse:['card','stamp','thumbs'],
  match:['pairs','memory']
};
var _mechSeed=(function(){var h=0,id=String(COURSE.id||'');for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h;})();
var _mechCount={};
function mechFits(type,m,s){
  if(type==='mcq'){
    var o=s.options||[];
    if(m==='doors')return o.length>=2&&o.length<=3;
    if(m==='chat')return o.length&&o.every(function(x){return /^\s*['"‘“]/.test(T(x.text));});
    if(m==='tiles')return o.length>=3&&o.length<=4&&o.every(function(x){return T(x.text).length<=70;});
  }
  if(type==='sort'&&m==='stamps')return (s.cards||[]).length<=10;
  if(type==='match'&&m==='memory')return (s.pairs||[]).length<=6;
  return true;
}
/* the mechanic for this screen: explicit x_mechanic, else the module's rotation over the mechanics that fit */
function mechanicFor(type,s){
  var list=MECH[type]||[],want=s.x_mechanic||s.mechanic;
  if(want&&list.indexOf(want)>=0&&mechFits(type,want,s))return want;
  if(!s._mech){
    var k=_mechCount[type]=(_mechCount[type]||0)+1,fits=list.filter(function(m){return mechFits(type,m,s);});
    s._mech=fits.length?fits[(_mechSeed+k)%fits.length]:list[0];
  }
  return s._mech;
}
/* the rotation must not depend on the order screens are visited: number every screen once, in course order */
(function(){var _bfs=buildFromScript;buildFromScript=function(){
  (SCRIPT.screens||[]).forEach(function(s){if(MECH[s.type])mechanicFor(s.type,s);});
  _bfs();};})();

function seededOrder(n,seedStr){var a=[],s=0,i;for(i=0;i<n;i++)a.push(i);for(i=0;i<seedStr.length;i++)s=(s*31+seedStr.charCodeAt(i))>>>0;
  for(i=n-1;i>0;i--){s=(s*1664525+1013904223)>>>0;var j=s%(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mechDone(s,h,first){awardXp(s.id,s.xp&&s.xp.complete);if(first)awardXp(s.id+':ftc',s.xp&&s.xp.firstTimeCorrect);}
function mechTag(h,m){h.setAttribute('data-mechanic',m);}

/* ---------------------------------------------------------------- SORT ---------------------------------- */

/* ---------------------------------------------------------------- HOTSPOT: ask each (E1, 2026-10-19) ------ */
/* One picture, the right targets asked one at a time ('Where is the vomitory?' = target.x_ask, else its name).
   A wrong tap shows the target's x_hint; a second wrong tap marks the place and asks the learner to tap it.
   A found target gets its name as a label on the picture and shows its `action` line. XP: s.xp.perTarget for each
   target right first time; mechDone at the end (firstTimeCorrect only for a run with no wrong tap).
   Buttons under the picture (the target names) are the keyboard / screen-reader alternative. */
/* E1 (2026-10-20) pages + choices:
   s.x_pages = [{media, alt, title, targets[], x_end, x_next}] — several pictures in turn (e.g. tickets), each with its own targets;
   after a page's last target its x_end line shows and 'Next' (x_next) opens the next page. Without x_pages: one page = s.media + s.targets.
   target.x_choices = [{text, best:true|false, feedback}] — once the place is found, the question x_choiceAsk (target, else screen)
   and the options; a wrong pick shows its feedback and stays open; the best ends the step (XP s.xp.perChoice if picked first time).
   A target with x_choices and no x (x_noSpot) is a choices-only step: nothing to tap on the picture.
   E1 (2026-10-21): a target may carry `media` (an image asset id): shown above its question (16:9, cover, at most 45vh; alt text
   from the asset; a missing file hides the picture). */
function hotspotAskEach(s,h){

    :[{img:media(s)[0],alt:T(s.heading)||'',title:'',tg:(s.targets||[]).filter(keep),end:'',nxt:''}];
  var total=pages.reduce(function(n,p){return n+p.tg.length;},0);

  var pi=0,k=0,step=0,miss=0,cmiss=0,allFirst=true,done_=false,inChoice=false,btns=[],li=[];
  var ptitle=el('<p class="askpage"></p>'),ask=el('<div class="askq" role="status" aria-live="polite"></div>'),cnt=el('<div class="findcount"></div>'),
      wrap=el('<div class="scene-wrap m-findall m-askeach"></div>'),list=el('<div class="findlist"></div>'),
      chHost=el('<div class="askchoices"></div>'),fbHost=el('<div class="mfb" role="status"></div>'),pgBar=el('<div class="askpagebar"></div>');
  h.appendChild(cnt);h.appendChild(ptitle);h.appendChild(ask);h.appendChild(wrap);h.appendChild(list);h.appendChild(chHost);h.appendChild(fbHost);h.appendChild(pgBar);
  var spot=function(t){return t.x!==undefined&&!t.x_noSpot;};
  function page(){
    var P=pages[pi];k=0;miss=0;wrap.innerHTML='';list.innerHTML='';pgBar.innerHTML='';
    ptitle.textContent=P.title||'';ptitle.style.display=P.title?'':'none';
    wrap.appendChild(imgOrPh(P.img,P.alt));
    btns=P.tg.map(function(t,i){if(!spot(t))return null;
      var b=el('<button type="button" class="hz2" style="left:'+t.x+'%;top:'+t.y+'%;width:'+t.w+'%;height:'+t.h+'%" aria-label="'+T(t.name)+'"></button>');
      b.addEventListener('click',function(e){e.stopPropagation();tap(i);});wrap.appendChild(b);return b;});
    li=P.tg.map(function(t,i){if(!spot(t))return null;var b=el('<button type="button" class="chip2">'+T(t.name)+'</button>');
      b.addEventListener('click',function(){tap(i);});list.appendChild(b);return b;});
    show();
  }
  function show(){
    var t=pages[pi].tg[k];if(!t)return;

    var o=i>=0?P.tg[i]:null;
    if(o&&i!==k&&spot(o)&&spot(t)&&o.x===t.x&&o.y===t.y&&o.w===t.w&&o.h===t.h)i=k;   /* two questions on the same place (e.g. one grid square): a tap there answers the one asked */
    if(i===k){
      var b=btns[k];if(b){b.classList.remove('hz-show');b.classList.add('g-ok');b.disabled=true;b.appendChild(el('<span class="hzlabel">'+T(t.name)+'</span>'));}

      if(li[k])li[k].disabled=true;

      return;
    }

    if(miss===1){var w=fb('bad',U('notQuite'),T(t.x_hint)||T(s.feedbackWrong)||U('pickAgain'));fbHost.appendChild(w);svin(w);}
    else if(btns[k]){btns[k].classList.add('hz-show');var w2=fb('bad',U('notQuite'),U('hereItIs'));fbHost.appendChild(w2);svin(w2);}
  }

    if(t.media){var cf=sc2_assetFile(t.media),cw=imgOrPh(cf,assetAlt(cf)||T(t.name)||'','simg askpic');cw.classList.add('askpicwrap');   /* E1 (2026-10-21): the target's own picture above its question */
      var ci=cw.querySelector('img');if(ci)ci.addEventListener('error',function(){cw.remove();});chHost.appendChild(cw);}
    var q=T(t.x_choiceAsk)||T(s.x_choiceAsk);if(q)chHost.appendChild(el('<p class="askchq"><b>'+q+'</b></p>'));
    (t.x_choices||[]).forEach(function(c){
      var b=el('<button type="button" class="opt askopt">'+T(c.text)+'</button>');
      b.addEventListener('click',function(){if(b.disabled)return;fbHost.innerHTML='';
        if(c.best){chHost.querySelectorAll('button').forEach(function(x){x.disabled=true;});b.classList.add('g-ok');
          if(cmiss===0)awardXp(s.id+':c'+step,s.xp&&s.xp.perChoice);
          var g=fb('good',U('spotOn'),T(c.feedback)||'');fbHost.appendChild(g);svin(g);
          var a=el('<button type="button" class="btn primary askgo">'+U('next')+'</button>');a.addEventListener('click',function(){a.remove();advance();});
          pgBar.innerHTML='';pgBar.appendChild(a);}
        else{cmiss++;allFirst=false;b.disabled=true;b.classList.add('g-bad');

  var head=(sc&&txt(sc.heading))||(h?h.textContent:'')||'';
  return {id:d.id||'',sec:d.sec==null?'':String(d.sec),type:(sc&&sc.type)||'',head:String(head).replace(/\s+/g,' ').trim().slice(0,120),n:cur+1,of:S.length};
}
function all(){var seen={},out=[];remote.concat(mine).forEach(function(c){if(!seen[c.id]){seen[c.id]=1;out.push(c);}});return out;}
function sent(c){return !SHARED||remote.some(function(r){return r.id===c.id;});}
var KINDS=['Wording','Translation','Picture or video','Activity','Not working','Other'];
var tab=el('<button type="button" class="rv-tab" id="rvTab" aria-haspopup="dialog" aria-controls="rvPanel"><span class="rv-ic" aria-hidden="true">💬</span><span id="rvLbl">Comment</span> <b class="rv-n" id="rvN"></b></button>');
var tip=el('<div class="rv-tip" id="rvTip" role="note" hidden>Reviewers: tap here to leave a comment on this screen.</div>');
var pn=el('<div class="rv-panel" id="rvPanel" role="dialog" aria-modal="false" aria-labelledby="rvTitle" hidden>'+
  '<div class="rv-head"><h2 id="rvTitle">Review comments</h2><button type="button" class="rv-x" id="rvClose" aria-label="Close">✕</button></div>'+
  '<p class="rv-where" id="rvWhere"></p>'+
  '<ul class="rv-list" id="rvList"></ul>'+
  '<label class="rv-l" for="rvBy">Your name</label><input class="rv-in" id="rvBy" type="text" autocomplete="name">'+
  '<label class="rv-l" for="rvKind">What is it about?</label><select class="rv-in" id="rvKind">'+KINDS.map(function(k){return '<option>'+k+'</option>';}).join('')+'</select>'+
  '<label class="rv-l" for="rvText">Your comment on this screen</label><textarea class="rv-in" id="rvText" rows="4"></textarea>'+
  '<div class="rv-row"><button type="button" class="rv-b rv-save" id="rvSave">Save comment</button><span class="rv-msg" id="rvMsg" role="status"></span></div>'+
  '<div class="rv-foot"><p id="rvAll"></p><p class="rv-hint" id="rvHint"></p>'+
  '<div class="rv-row"><button type="button" class="rv-b" id="rvDown">Download all comments</button>'+(SHARED?'':'<button type="button" class="rv-b rv-quiet" id="rvClear">Delete all</button>')+'</div></div>'+
  '</div>');
document.body.appendChild(tab);document.body.appendChild(tip);document.body.appendChild(pn);
/* keep the button clear of the course: above the sticky button bar on a phone; the tip sits just above the button */
function pinned(e){   /* inside a bar that stays put on screen (sticky / fixed), not content that scrolls past */
  for(var n=e;n&&n.id!=='stage';n=n.parentElement){var p=getComputedStyle(n).position;if(p==='sticky'||p==='fixed')return true;}return false;}
function place(){   /* keep clear of the course: rise above the fixed bars (sticky Next bar, side lesson list) and, by a little, above
                       buttons near the bottom; use the bottom corner that is freest (the reading-start corner on a tie) */
  var w=tab.offsetWidth,h=tab.offsetHeight,start=getComputedStyle(document.documentElement).direction==='rtl'?'right':'left';
  var els=[].slice.call(document.querySelectorAll('#stage button,#stage a,#stage input,#stage select,#stage [role=button]'))
    .map(function(e){var r=e.getBoundingClientRect();return {r:r,pin:pinned(e)};}).filter(function(x){return x.r.width&&x.r.height;});
  function fit(side){var left=side==='left'?16:innerWidth-16-w,bottom=16,hit=0;
    for(var pass=0;pass<8;pass++){var top=innerHeight-bottom-h,moved=false;
      els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top&&r.top<top+h){var nb=innerHeight-r.top+10;
        if(x.pin||nb<=160){bottom=Math.max(bottom,nb);moved=true;}}});
      if(!moved)break;}
    bottom=Math.min(bottom,innerHeight*0.5);var top2=innerHeight-bottom-h;   /* what still lies under it: a fixed bar counts more (it cannot be scrolled away) */
    els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top2&&r.top<top2+h)hit+=x.pin?10:1;});
    return {side:side,bottom:bottom,hit:hit};}
  var a=fit(start),b=fit(start==='left'?'right':'left');
  var best=(b.hit<a.hit||(b.hit===a.hit&&b.bottom<a.bottom))?b:a;
  tab.style.left=tip.style.left=best.side==='left'?'16px':'auto';tab.style.right=tip.style.right=best.side==='right'?'16px':'auto';
  tab.style.bottom=best.bottom+'px';tip.style.bottom=(best.bottom+h+10)+'px';}
window.addEventListener('resize',place);window.addEventListener('scroll',place,{passive:true});
var TIPKEY='ck-review-tip-seen';try{if(!localStorage.getItem(TIPKEY)){tip.hidden=false;setTimeout(function(){tip.hidden=true;},9000);}}catch(e){}
function tipDone(){tip.hidden=true;try{localStorage.setItem(TIPKEY,'1');}catch(e){}}
tip.addEventListener('click',function(){tipDone();open_();});
var by=g('rvBy');try{by.value=localStorage.getItem(NAME)||'';}catch(e){}
function onScreen(id){return all().filter(function(c){return c.screen===id;}).sort(function(a,b){return a.saved_at<b.saved_at?-1:1;});}
function refresh(){
  var w=here(),m=onScreen(w.id);
  g('rvN').textContent=m.length?String(m.length):'';place();
  tab.setAttribute('aria-label','Review comments'+(m.length?' ('+m.length+' on this screen)':''));
  if(pn.hidden)return;
  g('rvWhere').innerHTML='Screen <b>'+esc(w.id||'start')+'</b>'+(w.head?' · '+esc(w.head):'')+' <span>('+w.n+' of '+w.of+')</span>';
  g('rvList').innerHTML=m.map(function(c){var ok=sent(c);return '<li'+(ok?'':' class="rv-wait"')+'><span class="rv-k">'+esc(c.kind)+'</span> '+esc(c.comment)+
    '<small>'+esc(c.reviewer||'Reviewer')+' · '+esc(String(c.saved_at||'').slice(0,10))+(c.language?' · '+esc(c.language):'')+(ok?'':' · <b>Not sent yet</b>')+'</small>'+
    (ok&&SHARED?'':'<button type="button" class="rv-del" data-id="'+esc(c.id)+'">Delete</button>')+'</li>';}).join('');
  var n=all().length;
  g('rvAll').textContent=SHARED?(n===1?'1 open comment on this course.':n+' open comments on this course.'):(n===1?'1 comment saved in this course.':n+' comments saved in this course.');
  g('rvHint').textContent=SHARED?(net==='down'?'Cannot reach the comment sheet. Your comments are kept here and sent when the connection is back.':
      'Everyone reviewing this course sees these comments. The course team removes a comment when it is fixed.'):
    (mem?'This browser cannot keep comments. Download them before you close the page.':
      'Comments stay in this browser. When you finish, tap "Download all comments" and send the file back.');
  g('rvDown').disabled=!n;if(g('rvClear'))g('rvClear').disabled=!n;
}
/* ---- the shared sheet: read open comments, send waiting ones (plain-text POST: no login, no preflight) ---- */
function load(force){
  if(!SHARED||(!force&&Date.now()-lastLoad<15000))return;lastLoad=Date.now();
  fetch(URL_+(URL_.indexOf('?')<0?'?':'&')+'course='+encodeURIComponent(COURSE.id)+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();}).then(function(d){if(!d||!d.ok)throw 0;remote=d.comments||[];net='up';
      mine=mine.filter(function(c){return !remote.some(function(r){return r.id===c.id;});});store();refresh();})
    .catch(function(){net='down';refresh();});
}
function send(){
  if(!SHARED||sending||!mine.length)return;sending=true;
  var c=mine[0];
  fetch(URL_,{method:'POST',body:JSON.stringify({action:'add',comment:c})}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)throw 0;net='up';remote.push(c);mine=mine.filter(function(x){return x.id!==c.id;});store();sending=false;refresh();send();
  }).catch(function(){sending=false;net='down';refresh();});
}
function open_(){pn.hidden=false;tab.setAttribute('aria-expanded','true');g('rvMsg').textContent='';refresh();load();send();g('rvText').focus();}
function close_(){pn.hidden=true;tab.setAttribute('aria-expanded','false');tab.focus();}
tab.addEventListener('click',function(){tipDone();if(pn.hidden)open_();else close_();});
g('rvClose').addEventListener('click',close_);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pn.hidden)close_();});
g('rvSave').addEventListener('click',function(){
  var t=g('rvText').value.trim();if(!t){g('rvMsg').textContent='Type a comment first.';g('rvText').focus();return;}
  var w=here(),name=by.value.trim();try{localStorage.setItem(NAME,name);}catch(e){}
  mine.push({id:uid(),course:COURSE.id,screen:w.id,screen_no:w.n,lesson:w.sec,screen_type:w.type,heading:w.head,
    language:(typeof LANG!=='undefined'?LANG:''),kind:g('rvKind').value,comment:t,reviewer:name,saved_at:new Date().toISOString()});
  store();g('rvText').value='';g('rvMsg').textContent='Saved.';refresh();send();
});
g('rvList').addEventListener('click',function(e){var b=e.target.closest('.rv-del');if(!b)return;   /* only this browser's own, not-yet-sent comments */
  mine=mine.filter(function(c){return c.id!==b.getAttribute('data-id');});store();refresh();});
function csv(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
g('rvDown').addEventListener('click',function(){
  var cols=['course','screen','screen_no','lesson','screen_type','heading','language','kind','comment','reviewer','saved_at','id'];
  var rows=all().sort(function(a,b){return (a.screen_no-b.screen_no)||(a.saved_at<b.saved_at?-1:1);}).map(function(c){
    return cols.map(function(k){return csv(k==='course'?COURSE.id:c[k]);}).join(',');});
  var blob=new Blob([BOM+cols.join(',')+'\r\n'+rows.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
  var who=(by.value.trim()||'reviewer').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'reviewer';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.id+'-review-'+who+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
});
if(g('rvClear'))g('rvClear').addEventListener('click',function(){
  if(!mine.length||!window.confirm('Delete all '+mine.length+' comments in this course? Download them first if you have not sent them.'))return;
  mine=[];store();refresh();
});
var _render=render;
render=function(i){_render(i);refresh();setTimeout(place,250);};
if(SHARED){load(true);send();setInterval(function(){if(!document.hidden){load();send();}},60000);window.addEventListener('online',function(){load(true);send();});}
window.addEventListener('beforeunload',function(e){if((mem||SHARED)&&mine.length&&(mem||net==='down')){e.preventDefault();e.returnValue='';}});
})();

boot();
})();
</script>
</body>
</html>
