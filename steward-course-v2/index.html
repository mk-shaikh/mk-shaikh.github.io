<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Steward Code of Conduct — JAM</title>
<style>
  :root{
    --navy:#181E30;--ink:#1c2231;--muted:#5c667a;--faint:#8a93a6;
    --bg:#eef1f6;--surface:#ffffff;--surface-2:#f5f8fc;--line:#e4e9f1;--line-2:#d5dce7;
    --blue:#1f5fb8;--sky:#4D97CA;--sky-tint:#eaf3fb;
    --orange:#FF6D01;--orange-d:#e35f00;
    --teal:#0f9d8a;--teal-tint:#e7f7f4;--red:#d83a1f;--red-tint:#fdece8;--amber:#b9770a;--amber-tint:#fdf3e0;
    --shadow-sm:0 1px 2px rgba(24,30,48,.06),0 2px 8px rgba(24,30,48,.05);
    --shadow:0 2px 6px rgba(24,30,48,.07),0 10px 30px rgba(24,30,48,.08);
    --font-display:"Arial Narrow","Arial Nova Cond",Arial,sans-serif;
    --font:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
    --pad:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 50px rgba(24,30,48,.12)}
  .app.fatigued .screen{filter:saturate(.55) contrast(.96)}
  h1,h2,h3,h4{margin:0;color:var(--navy);font-weight:700;letter-spacing:.005em;font-family:var(--font-display)}
  h1{font-size:29px;line-height:1.1} h2{font-size:19px;line-height:1.22;margin-bottom:6px;color:#3d4657;font-weight:700}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .hex{width:26px;height:29px;flex:none;background:var(--navy);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center}
  .brand .hex::after{content:"J";color:#fff;font-weight:800;font-size:14px;font-family:Arial}
  .brand .wm{display:flex;flex-direction:column;line-height:1}
  .brand .wm b{font-family:Arial;font-weight:800;font-size:18px;color:var(--navy)}
  .brand .wm span{font-family:Arial;font-size:7.5px;letter-spacing:.26em;color:var(--sky);font-weight:700;margin-top:2px}
  .bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px var(--pad)}
  .bar[hidden]{display:none}
  .bar .barrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .backbtn{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;padding:8px 14px;min-height:38px;cursor:pointer;flex:none}
  .backbtn:disabled{opacity:.35;cursor:default}
  .backbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tpick{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 6px}
  .tp{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tp button{width:64px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:22px;font-weight:800;color:var(--blue);cursor:pointer;box-shadow:var(--shadow-sm)}
  .tp button:active{background:var(--sky-tint)}
  .tp button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tp .tv{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--navy);min-width:72px;text-align:center;background:var(--surface-2);border-radius:10px;padding:2px 6px}
  .tp .tl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tcolon{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--navy);padding-top:14px}
  .scorecard{width:100%;border-radius:16px;padding:20px 18px;margin:0 0 14px;text-align:center;box-shadow:var(--shadow-sm)}
  .scorecard.pass{background:linear-gradient(180deg,#eafaf5,#e2f6ef);border:1px solid var(--teal)}
  .scorecard.fail{background:linear-gradient(180deg,#fdf0ec,#fbe6df);border:1px solid var(--red)}
  .scorecard .sn{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1;color:var(--navy)}
  .scorecard .sn span{font-size:24px;color:var(--muted)}
  .scorecard .sl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .scorecard .verdict{display:inline-block;margin-top:12px;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 22px;border-radius:22px;color:#fff}
  .scorecard.pass .verdict{background:var(--teal)}
  .scorecard.fail .verdict{background:var(--red)}
  .scorecard .sm{font-size:14px;color:var(--ink);margin-top:12px;line-height:1.45}
  .sbar{height:10px;border-radius:8px;background:rgba(24,30,48,.09);overflow:hidden;margin:14px 0 4px;position:relative}
  .sbar i{display:block;height:100%;border-radius:8px}
  .scorecard.pass .sbar i{background:var(--teal)}
  .scorecard.fail .sbar i{background:var(--red)}
  .sbar .mark{position:absolute;top:-4px;bottom:-4px;left:70%;width:2px;background:var(--navy);opacity:.55}
  .spass{font-size:11px;color:var(--muted);text-align:right}
  .bar .ready{text-align:right;font-size:11px;color:var(--muted);font-weight:600}
  .bar .ready b{color:var(--navy);font-size:13px}
  .stepper{display:flex;align-items:center;margin-top:11px}
  .stepper .seg{flex:1;display:flex;align-items:center}
  .stepper .node{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);color:var(--faint);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:var(--font)}
  .stepper .node:disabled{cursor:default}
  .stepper .node.current{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 3px rgba(255,109,1,.14)}
  .stepper .node.done{background:var(--teal);border-color:var(--teal);color:#fff}
  .stepper .link{flex:1;height:2px;background:var(--line-2);margin:0 4px;border-radius:2px}
  .stepper .link.filled{background:var(--teal)}
  .stepper .node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .clockline{display:none;margin-top:10px;font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--navy)}
  .clockline b{color:var(--orange-d);font-size:16px;margin-left:8px}
  .bar.shift .stepper{display:none} .bar.shift .clockline{display:block}
  .stage{flex:1;display:flex;flex-direction:column}
  .screen{display:flex;flex:1;flex-direction:column;padding:22px var(--pad) 30px;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin-bottom:6px;font-family:var(--font-display)}
  .scene{font-size:14.5px;color:var(--muted);margin:8px 0 14px;padding-left:13px;border-left:3px solid var(--sky)}
  .lead{font-size:16px;color:var(--ink);margin:6px 0 16px;padding:11px 14px;background:var(--surface-2);border-left:3.5px solid var(--navy);border-radius:0 10px 10px 0;line-height:1.5}
  .bq{margin:10px 0 16px;padding:2px 0 2px 15px;border-left:3px solid var(--orange);font-size:16px;color:var(--ink)}
  .bq p{margin:0 0 6px} .bq p:last-child{margin:0}
  .callout{background:var(--sky-tint);border-radius:12px;padding:13px 15px;font-size:14.5px;color:var(--ink);margin:0 0 16px}
  .callout b{color:var(--navy)}
  .hero{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;position:relative}
  .hero img{display:block;width:100%;height:auto}
  .hero .tagband{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(180deg,rgba(24,30,48,0),rgba(24,30,48,.82));color:#fff}
  .hero .tagband .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:#ffd0a8;font-family:var(--font-display)}
  .hero .tagband h1{color:#fff;font-size:26px;margin-top:3px}
  .card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:16px;border:1px solid var(--line)}
  .plabel{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
  .plabel .pn{width:24px;height:24px;flex:none;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .plabel .pt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);font-family:var(--font-display)}
  /* THE TASK — highest salience on any screen (CLT signalling) */
  .q{font-size:19px;font-weight:700;color:var(--navy);margin:0 0 12px;line-height:1.38;font-family:var(--font);
     background:#fff6ee;border-left:4px solid var(--orange);border-radius:0 12px 12px 0;padding:14px 16px}
  .q b{color:#000}
  /* operating hint — quiet, sits next to the controls it governs */
  .howto{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:6px}
  .howto::before{content:"›";color:var(--orange);font-weight:800;flex:none}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;min-height:56px;background:#fff;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
  .opt .dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-2);position:relative}
  .opt .body{font-size:14.5px;font-weight:500;line-height:1.35}
  .opt .body .l{font-weight:800;color:var(--sky);margin-right:6px}
  .opt.g-ok{border-color:var(--teal);background:var(--teal-tint)}
  .opt.g-ok .dot{border-color:var(--teal)} .opt.g-ok .dot::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:800;font-size:13px}
  .opt.g-no{border-color:var(--red);background:var(--red-tint)}
  .opt.g-no .dot{border-color:var(--red)} .opt.g-no .dot::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:800;font-size:13px}
  .opt.g-warn{border-color:var(--amber);background:var(--amber-tint)}
  .opt.g-warn .dot{border-color:var(--amber)} .opt.g-warn .dot::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:13px}
  .opt.g-pick{border-color:var(--blue);background:var(--sky-tint)}
  .opt.g-pick .dot{border-color:var(--blue)} .opt.g-pick .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{position:relative;min-height:92px;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:10px 6px;color:var(--ink)}
  .tile .ico{width:38px;height:38px;display:inline-flex;filter:drop-shadow(0 2px 3px rgba(24,30,48,.12))}
  .tile .ico svg{width:100%;height:100%}
  .tile .nm{font-size:11.5px;font-weight:600;color:var(--navy);text-align:center;line-height:1.2}
  .tile .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:transparent}
  .tile[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,109,1,.14)}
  .tile[aria-pressed="true"] .ck{border-color:var(--orange);background:var(--orange);color:#fff}
  .tile[aria-pressed="true"] .ck::after{content:"✓"}
  .tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:9px}
  .si{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:var(--shadow-sm)}
  .si .pos{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .si .txt{flex:1;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
  .si .mvs{display:flex;gap:5px}
  .mv{width:44px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--navy);font-size:13px;cursor:pointer}
  .mv:disabled{opacity:.35;cursor:default}
  .mv:focus-visible{outline:2px solid var(--blue)}
  .si .vd{font-size:13px;font-weight:800;min-width:16px;text-align:center;display:none}
  .si.g-ok{border-color:var(--teal)} .si.g-ok .pos{background:var(--teal);color:#fff} .si.g-ok .vd{display:block;color:var(--teal)}
  .si.g-no{border-color:var(--red)} .si.g-no .pos{background:var(--red);color:#fff} .si.g-no .vd{display:block;color:var(--red)}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:22px}
  .dcard{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow-sm)}
  .dcard .b{width:12px;height:14px;background:var(--sky);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);flex:none}
  .dcard.picked{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,109,1,.18)}
  .dcard.g-ok{border-color:var(--teal)} .dcard.g-ok .b{background:var(--teal)}
  .dcard.g-no{border-color:var(--red)} .dcard.g-no .b{background:var(--red)}
  .dcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:8px}
  .bucket{min-height:120px;border:2px dashed var(--line-2);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
  .bucket.over{border-color:var(--orange);background:#fff4ec}
  .bucket .bh{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--navy);font-family:var(--font-display)}
  .bucket.b-now .bh{color:var(--orange-d)} .bucket.b-watch .bh{color:var(--blue)}
  .bucket .bdrop{flex:1;display:flex;flex-direction:column;gap:8px}
  .pickhint{font-size:12.5px;color:var(--muted);margin:0 0 10px;min-height:16px}
  .scene-wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;line-height:0}
  .hazsvg{display:block;width:100%;height:auto}
  .hz{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .hz:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .hz.found{background:rgba(15,157,138,.25);border-color:var(--teal)}
  .hz.wrong{background:rgba(216,58,31,.22);border-color:var(--red)}
  .hz.wrong::after{content:"✕";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .hz.found::after{content:"✓";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .reveal{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--orange);padding:12px 13px;margin-bottom:12px;position:relative;display:none}
  .reveal.show{display:block;animation:rise .2s ease}
  .reveal .rt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
  .reveal .rx{font-size:13.5px;color:var(--muted)}
  .fb{border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none;font-size:14.5px}
  .fb.show{display:block;animation:rise .25s ease}
  .fb .head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:3px;font-size:15px}
  .fb .ic{min-width:22px;height:22px;border-radius:11px;padding:0 5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
  .fb.good{background:var(--teal-tint)} .fb.good .head{color:var(--teal)} .fb.good .ic{background:var(--teal)}
  .fb.bad{background:var(--red-tint)} .fb.bad .head{color:var(--red)} .fb.bad .ic{background:var(--red)}
  .fb.tip{background:var(--amber-tint)} .fb.tip .head{color:var(--amber)} .fb.tip .ic{background:var(--amber)}
  .fb.info{background:var(--sky-tint)} .fb.info .head{color:var(--blue)} .fb.info .ic{background:var(--blue)}
  .fb b{color:var(--navy)}
  .consq{background:var(--surface-2);border-radius:12px;padding:14px 15px;margin:0 0 12px;border-left:4px solid var(--red)}
  .consq.good{border-left-color:var(--teal)}
  .consq .ch{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy);margin-bottom:5px}
  .consq p{margin:0 0 6px;font-size:14.5px;color:var(--ink)} .consq p:last-child{margin:0}
  .consq .say{font-style:italic;color:var(--muted)}
  .timerchip{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:20px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;margin-bottom:12px}
  .timerchip.low{background:var(--red)}
  .timerchip .ext{font-family:var(--font);font-size:11px;font-weight:600;color:#ffd0a8;background:none;border:0;cursor:pointer;text-decoration:underline;padding:2px}
  .ipt{width:100%;font:inherit;font-size:15px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:12px;color:var(--ink);background:#fff;margin-bottom:10px}
  .ipt:focus{outline:3px solid var(--sky-tint);border-color:var(--blue)}
  textarea.ipt{min-height:74px;resize:vertical}
  .toks{background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px;line-height:2;margin-bottom:12px;color:var(--ink)}
  .tok{display:inline;background:#fff;border:1.5px solid var(--line-2);border-radius:8px;padding:3px 7px;margin:0 2px;cursor:pointer;font:inherit;font-size:14px;color:var(--navy)}
  .tok[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint);text-decoration:line-through}
  .tok.g-ok{border-color:var(--teal);background:var(--teal-tint);text-decoration:line-through}
  .tok.g-no{border-color:var(--red);background:var(--red-tint);text-decoration:none}
  .tok.g-miss{border-color:var(--amber);background:var(--amber-tint)}
  .tok:focus-visible{outline:2px solid var(--blue)}
  .frames{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .frame{border:2px solid var(--line-2);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;background:#fff;position:relative;line-height:0}
  .frame .fl{position:absolute;top:6px;left:8px;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--navy);background:rgba(255,255,255,.9);border-radius:6px;padding:2px 7px;line-height:1.4}
  .frame.g-pick{border-color:var(--orange)}
  .frame:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .soundcard{background:var(--navy);border-radius:14px;padding:16px;margin-bottom:14px;color:#fff}
  .soundcard .sl{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;color:#7fd0ff;margin-bottom:10px}
  .soundcard .sline{display:flex;align-items:center;gap:10px;font-size:14.5px;margin-bottom:8px;color:#dfe6f5}
  .soundcard .sline .w{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
  .soundcard .sline .w i{width:3px;background:#4D97CA;border-radius:2px;display:inline-block}
  .panels{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
  .panels .pnl{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);line-height:0;box-shadow:var(--shadow-sm)}
  .pnl .ptime{position:absolute;left:10px;top:10px;z-index:2;background:rgba(24,30,48,.88);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.06em;padding:5px 12px;border-radius:15px;line-height:1.3}
  .pnl .pstep{position:absolute;right:10px;top:10px;z-index:2;background:rgba(255,255,255,.92);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:15px;line-height:1.3}
  .pnl .pdesc{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.94);color:var(--navy);font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;line-height:1.35}
  .pcap{font-size:12.5px;color:var(--muted);font-style:italic;margin:0 0 14px;text-align:center}
  @media (min-width:700px){.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
  .exl{border-radius:12px;background:#fff;border:1px solid var(--line-2);box-shadow:var(--shadow-sm);padding:12px 13px;margin-bottom:9px}
  .exl .ext2{font-size:14px;color:var(--ink);margin-bottom:5px}
  .exl .exv{font-size:12.5px;font-weight:700}
  .exl.v-ok .exv{color:var(--teal)} .exl.v-warn .exv{color:var(--amber)} .exl.v-no .exv{color:var(--red)}
  /* ranking cards (3.7) */
  .rkcard{position:relative;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:13px 13px 13px 52px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
  .rkcard .who3{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .rkcard .ln{font-size:13.5px;line-height:1.4;margin-bottom:3px}
  .rkcard .ln b{color:var(--navy);font-weight:700}
  .rkcard .ln.sp{color:var(--muted);font-style:italic}
  .rkcard .rkn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:transparent}
  .rkcard.ranked{border-color:var(--blue)}
  .rkcard.ranked .rkn{border-style:solid;border-color:var(--blue);background:var(--blue);color:#fff}
  .rkcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .rkcard.graded{cursor:default}
  .rkcard .vch{display:none;margin-top:8px;font-size:12.5px;font-weight:700}
  .rkcard.graded .vch{display:block}
  .rkcard.iv-1 .vch{color:var(--teal)} .rkcard.iv-2 .vch{color:var(--blue)}
  .rkcard.iv-3 .vch{color:var(--amber)} .rkcard.iv-4 .vch{color:var(--red)}
  .mapblock{background:var(--surface-2);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-align:left}
  .mapblock .mh{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
  .mapblock.mb-strong .mh{color:var(--teal)} .mapblock.mb-hes .mh{color:var(--amber)}
  .mapblock.mb-cost .mh{color:var(--red)} .mapblock.mb-one .mh{color:var(--blue)}
  .mapblock p{margin:0 0 7px;font-size:14px;color:var(--ink)} .mapblock p:last-child{margin:0}
  .rules{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}
  .iconrow{display:flex;justify-content:space-between;gap:6px;margin:4px 0 18px}
  .iconrow .ir{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .iconrow .ir .ico{width:40px;height:40px;display:inline-flex}
  .iconrow .ir .ico svg{width:100%;height:100%}
  .iconrow .ir span{font-size:10px;color:var(--muted);font-weight:600;text-align:center}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .btn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;min-height:52px;padding:14px 20px;border-radius:26px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--orange);color:#2a1500;box-shadow:0 6px 16px rgba(255,109,1,.28)}
  .btn.primary:hover{background:var(--orange-d)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.ghost{background:#fff;color:var(--blue);border-color:var(--line-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  .btn.sm{min-height:40px;font-size:13.5px;padding:8px 16px;border-radius:20px}
  .guide{display:inline-block;background-repeat:no-repeat;background-color:#fff;border-radius:12px;flex:none;box-shadow:var(--shadow-sm)}
  .gfloat{float:right;margin:0 0 8px 12px}
  .closewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .closewrap .big{font-size:44px;margin-bottom:8px}
  .progressdots{display:flex;gap:7px;justify-content:center;margin:14px 0 6px}
  .progressdots i{width:34px;height:8px;border-radius:6px;background:var(--line-2)}
  .progressdots i.on{background:var(--teal)}
  .badgewrap{text-align:center}
  /* video layer (progressive enhancement) */
  .vidwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:0 0 14px;background:#000;line-height:0}
  .vidwrap[hidden]{display:none}
  .vidwrap video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .vidctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;line-height:1.4}
  .vc{font:inherit;font-size:11px;font-weight:700;background:rgba(24,30,48,.75);color:#fff;border:0;border-radius:15px;padding:6px 11px;cursor:pointer;min-height:30px}
  .vc[aria-pressed="true"]{background:var(--orange);color:#2a1500}
  .vc:focus-visible{outline:2px solid #fff}
  video::cue{background:rgba(10,14,25,.85);color:#fff;font-size:14px}
  @media print{ body *{visibility:hidden} .printonly,.printonly *{visibility:visible} .printonly{position:absolute;left:0;top:0;width:100%} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:640px){:root{--pad:32px}.app{max-width:760px}h1{font-size:36px}h2{font-size:27px}.screen{padding:28px var(--pad) 36px}.tiles{grid-template-columns:repeat(4,1fr)}.hero .tagband h1{font-size:32px}}
  @media (min-width:1024px){:root{--pad:48px}body{padding:28px 0}.app{max-width:920px;min-height:calc(100dvh - 56px);border-radius:18px;overflow:hidden;border:1px solid var(--line)}.btn{width:fit-content;min-width:280px}.actions{align-items:flex-end}.opts,.steps,.frames,.toks,.buckets,.tray,.scene-wrap,.panels{max-width:680px}}

  /* ============================================================
     EMPHASIS SYSTEM — deliberate hierarchy, not uniform glow.
     L1 the task + primary action · L2 feedback & consequences
     L3 teaching callouts · L4 body copy
     ============================================================ */

  /* L1 — THE TASK: lifts off the page and arrives with a beat */
  .q{box-shadow:0 6px 18px rgba(255,109,1,.18);animation:qPop .42s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes qPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

  /* highlighter pen on the words that matter, inside key blocks only */
  .q b,.bq b,.callout b,.learn .ft b{
    background:linear-gradient(transparent 58%,#ffd9b3 58%);
    padding:0 2px;border-radius:2px;color:var(--navy)}
  .fb b{background:linear-gradient(transparent 58%,rgba(255,255,255,.85) 58%);padding:0 2px}

  /* L1 — PRIMARY ACTION: physical, and it breathes when it's the way forward */
  .btn.primary{box-shadow:0 6px 18px rgba(255,109,1,.34);transition:transform .12s ease,box-shadow .12s ease,background .12s}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,109,1,.42)}
  .btn.primary:active{transform:translateY(0)}
  .btn.blue{box-shadow:0 5px 14px rgba(31,95,184,.28);transition:transform .12s ease,box-shadow .12s ease}
  .btn.blue:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(31,95,184,.36)}
  .btn.blue:active{transform:translateY(0)}
  /* guides the eye on arrival, then settles — never nags */
  .actions .btn.primary:only-child{animation:ctaBreathe 2.2s ease-in-out .9s 3 both}
  @keyframes ctaBreathe{
    0%,100%{box-shadow:0 6px 18px rgba(255,109,1,.34)}
    50%{box-shadow:0 6px 26px rgba(255,109,1,.55)}}

  /* L2 — FEEDBACK: lands with weight, icon reads at a glance */
  .fb{box-shadow:0 4px 16px rgba(24,30,48,.10);border-left:5px solid transparent;
      animation:fbPop .34s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes fbPop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .fb.good{border-left-color:var(--teal)}
  .fb.bad{border-left-color:var(--red)}
  .fb.tip{border-left-color:var(--amber)}
  .fb.info{border-left-color:var(--blue)}
  .fb .head{font-size:16.5px}
  .fb .ic{width:26px;height:26px;font-size:15px;box-shadow:0 2px 8px rgba(24,30,48,.18)}

  /* L2 — CONSEQUENCES: the emotional payload of the course */
  .consq{box-shadow:0 5px 18px rgba(24,30,48,.10);border-left-width:5px;
         animation:fbPop .38s cubic-bezier(.2,.9,.3,1.15) both}
  .consq .ch{font-size:16.5px}

  /* L3 — TEACHING BLOCKS: clearly "this is the standard" */
  .callout{border-left:5px solid var(--sky);box-shadow:0 3px 12px rgba(31,95,184,.10);
           background:linear-gradient(180deg,#f2f8fe,#eaf3fb);font-size:15px}
  .bq{background:var(--surface-2);border-radius:0 12px 12px 0;padding:14px 16px;
      box-shadow:0 2px 10px rgba(24,30,48,.06)}
  .learn{box-shadow:0 4px 16px rgba(31,95,184,.10)}
  .learn .ll{background:var(--blue);color:#fff;padding:5px 12px;border-radius:14px;
             display:inline-flex;box-shadow:0 3px 10px rgba(31,95,184,.28)}
  .learn .ll .d{background:#fff}
  .fs{transition:transform .12s ease,box-shadow .12s ease}
  .fs:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(24,30,48,.10)}

  /* SELECTION FEEDBACK: choices feel physical */
  .opt{transition:transform .1s ease,box-shadow .12s ease,border-color .12s,background .12s}
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(24,30,48,.10);border-color:var(--sky)}
  .opt[aria-pressed="true"],.opt.g-pick{box-shadow:0 4px 16px rgba(255,109,1,.20)}
  .opt.g-ok{box-shadow:0 4px 16px rgba(15,157,138,.22)}
  .opt.g-no{box-shadow:0 4px 16px rgba(216,58,31,.18)}
  .tile{transition:transform .12s ease,box-shadow .14s ease,border-color .12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,30,48,.12)}
  .tile[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 8px 22px rgba(255,109,1,.26)}
  .tile.g-ok{box-shadow:0 6px 18px rgba(15,157,138,.24)}
  .tile.g-no{box-shadow:0 6px 18px rgba(216,58,31,.20)}
  .dcard{transition:transform .12s ease,box-shadow .14s ease}
  .dcard.picked{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px rgba(255,109,1,.28)}
  .bucket.over{box-shadow:inset 0 0 0 2px var(--orange),0 6px 20px rgba(255,109,1,.18)}

  /* HAZARD HOTSPOTS: findable without giving the answer away */
  .hz{transition:background .15s,box-shadow .15s,transform .12s}
  .hz:hover{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
  .hz.found{box-shadow:0 0 0 3px rgba(15,157,138,.35),0 4px 14px rgba(0,0,0,.3);animation:hzFound .3s ease both}
  .hz.wrong{box-shadow:0 0 0 3px rgba(216,58,31,.32)}
  @keyframes hzFound{from{transform:scale(.7);opacity:.4}to{transform:scale(1);opacity:1}}

  /* PROGRESS: the current step is unmistakable */
  .stepper .node.current{transform:scale(1.14);box-shadow:0 0 0 4px rgba(255,109,1,.18),0 3px 10px rgba(255,109,1,.28)}
  .stepper .node{transition:transform .18s ease,box-shadow .18s ease,background .18s}
  .stepper .node.done{box-shadow:0 2px 8px rgba(15,157,138,.32)}

  /* MILESTONES: earn the moment */
  .closewrap .big{font-size:56px;animation:tick .5s cubic-bezier(.2,.9,.3,1.4) both;
    display:inline-flex;width:96px;height:96px;align-items:center;justify-content:center;
    border-radius:50%;background:var(--teal-tint);color:var(--teal);
    box-shadow:0 8px 26px rgba(15,157,138,.28)}
  @keyframes tick{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .progressdots i{transition:background .3s ease,transform .3s ease}
  .progressdots i.on{transform:scaleY(1.25);box-shadow:0 2px 8px rgba(15,157,138,.35)}
  .scorecard{animation:tick .55s cubic-bezier(.2,.9,.3,1.3) both}
  .scorecard .verdict{box-shadow:0 5px 16px rgba(24,30,48,.22)}

  /* media + pledge */
  .vidwrap,.scene-wrap,.hero{box-shadow:0 8px 26px rgba(24,30,48,.16)}
  .pledge{box-shadow:0 6px 22px rgba(31,95,184,.16);border-left:5px solid var(--blue);
          animation:fbPop .4s cubic-bezier(.2,.9,.3,1.15) both}
  .pnl{transition:transform .14s ease,box-shadow .16s ease}
  .pnl:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(24,30,48,.16)}

  /* nothing moves for anyone who has asked it not to */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .stepper .node.current{transform:none}
    .closewrap .big{transform:none}
  }


  /* 4.3 — three moves */
  .sss{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .sss .mv3{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .sss .mv3 .n3{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;letter-spacing:.04em}
  .sss .mv3:nth-child(1) .n3{background:var(--blue)}
  .sss .mv3:nth-child(2) .n3{background:var(--orange)}
  .sss .mv3:nth-child(3) .n3{background:var(--teal)}
  .sss .mv3 b{display:block;font-family:var(--font-display);font-size:17px;color:var(--navy);letter-spacing:.04em}
  .sss .mv3 span{font-size:13.5px;color:var(--muted)}
  /* 4.3 — tap-to-learn hazard cards */
  .hcard{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:0;margin-bottom:10px;cursor:pointer;overflow:hidden}
  .hcard .hrow{display:flex;align-items:center;gap:12px;padding:14px 14px}
  .hcard .hn{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .hcard .ht{flex:1;font-size:15.5px;font-weight:700;color:var(--navy)}
  .hcard .hchev{color:var(--faint);font-size:13px;transition:transform .2s}
  .hcard .hbody{display:none;padding:0 14px 14px 56px;font-size:14px;color:var(--ink);line-height:1.45}
  .hcard .hbody b{color:var(--orange-d)}
  .hcard.open{border-color:var(--sky)}
  .hcard.open .hbody{display:block;animation:rise .22s ease}
  .hcard.open .hchev{transform:rotate(90deg)}
  .hcard.seen .hn{background:var(--teal);color:#fff}
  .hcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* video: last-resort tap-to-play overlay */
  .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,30,48,.35);border:0;cursor:pointer}
  .vplay span{width:74px;height:74px;border-radius:50%;background:var(--orange);color:#2a1500;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .vsound{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:inherit;font-size:14px;font-weight:700;background:var(--orange);color:#2a1500;border:0;border-radius:22px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:rise .3s ease}

  /* ---- Section 2: radio options — same calm cards as everywhere else,
          one small SEND cue; colour only ever means correct/wrong ---- */
  .skin-radio .opt{background:#fff;border-color:var(--line-2)}
  .skin-radio .opt .body{font-size:14.5px;color:var(--navy)}
  .skin-radio .opt .body .l{color:var(--muted)}
  .skin-radio .opt::after{content:"SEND";position:absolute;top:50%;transform:translateY(-50%);right:12px;font-family:var(--font-display);font-size:10px;letter-spacing:.12em;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:2px 7px}
  .skin-radio .opt .body{padding-right:52px}
  .skin-radio .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-radio .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-radio .opt.g-ok::after{content:"SENT";color:#0a5a4e;border-color:var(--teal)}
  .skin-radio .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-radio .opt.g-no::after{content:"✕";color:var(--red);border-color:var(--red)}
  .skin-radio .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  /* ---- Sections 3/6: options as speech bubbles ---- */
  .skin-speech{gap:12px}
  .skin-speech .opt{border-radius:16px 16px 4px 16px;background:#fff;border-color:var(--line-2);position:relative}
  .skin-speech .opt::before{content:"";position:absolute;right:-1px;bottom:-9px;border:10px solid transparent;border-top-color:var(--line-2);border-right-color:var(--line-2)}
  .skin-speech .opt .body{font-size:14.5px}
  .skin-speech .opt .body::before{content:"YOU";display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
  .skin-speech .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-speech .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-speech .opt.g-ok::before{border-top-color:var(--teal);border-right-color:var(--teal)}
  .skin-speech .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-speech .opt.g-no::before{border-top-color:var(--red);border-right-color:var(--red)}
  .skin-speech .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  .skin-speech .opt.g-pick{border-color:var(--navy)}
  /* compact in-scene video + finished-cue */
  .vidwrap.vcompact{max-width:430px;margin:0 auto 10px}
  .vidwrap.vended{box-shadow:0 0 0 2px var(--teal)}
  /* ===== Section 4 — image hazards ===== */
  .flash{background:#fff;border:1.5px solid var(--line-2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:10px;animation:rise .22s ease}
  .flash img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
  .flash .fcbody{padding:14px 16px}
  .flash .fcn{font-family:var(--font-display);font-size:12px;letter-spacing:.12em;color:var(--orange-d);margin-bottom:5px}
  .flash .fcbody b{font-size:18px;color:var(--navy);display:block;margin-bottom:6px}
  .flash .fcbody p{font-size:14.5px;color:var(--ink);line-height:1.5;margin:0}
  .progressdots.fdots{margin:0 0 4px}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
  .htile{position:relative;font:inherit;background:#fff;border:2px solid var(--line-2);border-radius:13px;padding:6px 6px 8px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .htile img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;display:block}
  .htile .cap{display:block;font-size:12.5px;color:var(--navy);font-weight:600;margin-top:6px;text-align:center}
  .htile[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,109,1,.22)}
  .htile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#2a1500;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
  .htile:disabled{opacity:.85}
  .htile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .scene{position:relative;max-width:600px;margin:0 auto 12px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .scene .sceneimg{width:100%;display:block}
  .hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;padding:0}
  .hot:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
  .hot.hint{box-shadow:0 0 0 3px var(--orange);animation:hpulse 1.1s ease-in-out infinite}

  .hlist{display:flex;flex-direction:column;gap:7px;margin:0 0 12px}

  /* ---- 5.2: the report as a paper form ---- */
  .reportsheet{background:#fffdf6;border:1px solid #e3ddc8;border-radius:6px;box-shadow:var(--shadow-sm);padding:14px 14px 14px 30px;position:relative}

  .reportsheet .opt[aria-pressed="true"] .dot{background:var(--teal);border-color:var(--teal)}
  .reportsheet .opt[aria-pressed="true"] .dot::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  /* ---- 6.7: social feed cards ---- */
  .post{border-radius:16px}

  .skin-feed .opt .body{display:block;padding:0}

  .skin-feed .opt .pav{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .skin-feed .opt .pwho b{display:block;font-size:13.5px;color:var(--navy)}

  /* ---- 4.7: tap-your-post chips ---- */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
  .chip2{font:inherit;font-size:14px;font-weight:600;color:var(--navy);background:#fff;border:1.5px solid var(--line-2);border-radius:22px;padding:11px 16px;min-height:46px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .chip2[aria-pressed="true"]{background:var(--teal-tint);border-color:var(--teal);color:#0a5a4e}
  .chip2[aria-pressed="true"]::before{content:"✓ ";font-weight:800}
  .chip2:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* ---- 5.2 one-line-at-a-time report builder ---- */
  .rdecide{background:#fff;border:1.5px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin:0 0 14px;animation:rise .22s ease}
  .rdecide .rdn{font-family:var(--font-display);font-size:11px;letter-spacing:.13em;color:var(--orange-d);margin-bottom:6px}

  .rsline{border-bottom:1px dashed #d8d2bd;padding:8px 6px;font-size:13.5px;color:var(--ink);animation:rise .25s ease}

  /* ---- section-close shift-log stamp ---- */
  .stamp{display:block;width:-webkit-fit-content;width:fit-content;max-width:min(92%,300px);box-sizing:border-box;text-align:center;line-height:1.45;margin:18px auto 0;padding:9px 16px;border:2.5px dashed var(--teal);border-radius:8px;color:var(--teal);font-family:var(--font-display);font-size:13.5px;letter-spacing:.1em;transform:rotate(-2.5deg);background:rgba(15,157,138,.05);animation:stampIn .4s cubic-bezier(.2,.9,.3,1.4) both .25s}
  body,#app{overflow-x:hidden} /* nothing may ever scroll the page sideways */
  @keyframes stampIn{from{transform:rotate(-2.5deg) scale(1.6);opacity:0}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
  /* ===== Section 3 — live conversation + mood meter ===== */
  .moodwrap{position:sticky;top:6px;z-index:5;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm);padding:7px 12px;margin:0 0 9px;display:flex;align-items:center;gap:11px}
  .moodwrap .mface{font-size:26px;line-height:1;flex:none}

  .moodwrap .mtrack{height:12px;border-radius:8px;background:#e9edf4;overflow:hidden}
  .moodwrap .mfill{height:100%;width:72%;border-radius:8px;background:var(--red);transition:width .5s cubic-bezier(.3,.8,.3,1),background .5s}
  .moodwrap .mlabel{font-size:10.5px;font-family:var(--font-display);letter-spacing:.12em;color:var(--muted);margin-top:5px}
  .chat{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px;max-height:22vh;overflow-y:auto;padding:2px 4px 2px 2px;scroll-behavior:smooth}
  .cbub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14.5px;line-height:1.4;animation:rise .25s ease}
  .cbub.sp{align-self:flex-start;background:#eef1f6;color:var(--ink);border-bottom-left-radius:4px}
  .cbub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .cchoices{display:flex;flex-direction:column;gap:9px}
  .cchoice{display:flex;align-items:center;gap:11px;font:inherit;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;padding:13px 15px;font-size:14.5px;color:var(--navy);cursor:pointer;box-shadow:var(--shadow-sm)}
  .cchoice::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);background:#fff}
  .cchoice:hover:not(:disabled){border-color:var(--muted);background:var(--surface);transform:translateY(-1px)}
  .cchoice:hover:not(:disabled)::before{border-color:var(--navy)}
  .cchoice:disabled{opacity:.5;cursor:default}
  .cchoice:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* ===== Section 2 — radio-call builder ===== */
  .rbuild{display:flex;flex-direction:column;gap:8px;margin:4px 0 9px}
  .rslot{background:#fff;border:1.5px solid var(--line-2);border-radius:12px;padding:8px 11px;box-shadow:var(--shadow-sm)}
  .rslot .rslab{font-family:var(--font-display);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
  .rfrags{display:flex;flex-wrap:wrap;gap:7px}
  .rfrag{font:inherit;font-size:13.5px;color:var(--navy);background:var(--surface);border:1.5px solid var(--line-2);border-radius:9px;padding:9px 12px;min-height:40px;cursor:pointer}
  .rfrag[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-tint);color:#0a5a4e;font-weight:700}
  .rfrag:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .rpreview{background:#fff;border-radius:12px;padding:9px 13px;color:var(--navy);font-size:13.5px;min-height:38px;border:1.5px solid var(--line-2);line-height:1.45;box-shadow:var(--shadow-sm)}
  .rpreview .rgarble{color:var(--red);text-decoration:underline wavy var(--red)}
  .claritywrap{margin:8px 0 3px}
  .claritywrap .clab{font-size:10.5px;font-family:var(--font-display);letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
  .claritytrack{height:10px;border-radius:6px;background:#e9edf4;overflow:hidden}
  .clarityfill{height:100%;width:0;border-radius:6px;background:var(--red);transition:width .4s,background .4s}
  /* ===== Section 6 — phone frame ===== */
  .phone{max-width:330px;margin:2px auto 12px;background:#0d1526;border-radius:30px;padding:10px;box-shadow:0 14px 42px rgba(0,0,0,.3)}
  .phone .phnotch{height:20px;display:flex;align-items:center;justify-content:center}
  .phone .phnotch::before{content:"";width:96px;height:6px;border-radius:4px;background:#2a3550}
  .phscreen{background:var(--surface);border-radius:22px;overflow:hidden}
  .phbar{display:flex;justify-content:space-between;align-items:center;padding:7px 15px;font-size:12px;color:var(--muted);background:#fff;border-bottom:1px solid var(--line)}
  .phhdr{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--navy);color:#fff}
  .phhdr .pht b{font-size:13.5px;line-height:1.1}.phhdr .pht span{display:block;font-size:11px;opacity:.72}
  .phbody{padding:12px;display:flex;flex-direction:column;gap:8px;background:#eef1f6;min-height:120px}
  .phreplies{padding:10px 12px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

  /* ---- 5.6 incident mini-sim ---- */
  .steptrack{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 13px}
  .steptrack .stp{display:flex;align-items:center;gap:5px;font-family:var(--font-display);font-size:11px;letter-spacing:.06em;color:var(--faint);background:#fff;border:1.5px solid var(--line-2);border-radius:16px;padding:4px 10px 4px 4px}
  .steptrack .stp i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .steptrack .stp.lit{color:#0a5a4e;border-color:var(--teal);background:var(--teal-tint)}
  .steptrack .stp.lit i{background:var(--teal);color:#fff}
  .moment{animation:rise .25s ease}
  .moment img{width:100%;border-radius:14px;border:1px solid var(--line-2);box-shadow:var(--shadow-sm);margin-bottom:10px}
  .moment .mscene{font-size:15px;color:var(--ink);line-height:1.5;margin:0 0 10px}
  .moment .mopts{display:flex;flex-direction:column;gap:9px}
  .moment .mfb{margin-top:10px}

  .simg{width:100%;border-radius:14px;border:1px solid var(--line-2);box-shadow:var(--shadow-sm);display:block;margin:0 0 12px}
  /* 5.4 write-this table: icon rows */
  .wtd{padding:9px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;color:var(--ink)}
  .ntd{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted)}
  .wic{flex:none;width:22px;height:22px;color:var(--teal)}
  .wic svg{width:100%;height:100%}
  /* hotspots: invisible 12px halo so every zone clears the 44px touch minimum */
  .hot{overflow:visible}
  .hot::after{content:"";position:absolute;inset:-12px}

  #rcards .hbody{padding-left:47px}
</style>

<body>
<div class="app" id="app">
  <div class="bar" id="bar" hidden>
    <div class="barrow">
      <button class="backbtn" id="backBtn" type="button" aria-label="Go back one screen">‹ Back</button>
      <div class="brand"><span class="hex"></span><span class="wm"><b>JAM</b><span>EVENT SERVICES</span></span></div>
      <div class="ready" id="readyBox">Sections<br><b id="readyPct">0 / 6</b></div>
    </div>
    <div class="stepper" id="stepper"></div>
    <div class="clockline">THE SHIFT <b id="clock">14:20</b></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script src="scorm.js"></script>
<script>
(function(){
"use strict";
/* ============ ENGINE ============ */
function g(id){return document.getElementById(id);}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
var S=[],cur=0,timers=[],done={},st={tookPhone:false,missed:[],s3partial:false,sim:{},simQ:{},flags:{}};
function scr(id,sec,f){S.push({id:id,sec:sec,build:f});}
function idxOf(id){for(var i=0;i<S.length;i++)if(S[i].id===id)return i;return 0;}
function goTo(id){render(idxOf(id));}
var _navT=0;
function next(){var n=Date.now();if(n-_navT<350)return;_navT=n;render(cur+1);} // double-tap guard
function render(i){
  timers.forEach(function(t){clearInterval(t);});timers=[];
  cur=i;var d=S[i];
  if(d.sec!==7&&d.sec!==8)g('app').classList.remove('fatigued');
  var stage=g('stage');
  /* stop any playing media BEFORE detaching — detached videos keep playing audio */
  stage.querySelectorAll('video').forEach(function(v){try{v.pause();v.removeAttribute('src');v.load();}catch(e){}});
  stage.innerHTML='';
  var host=el('<section class="screen" tabindex="-1"></section>');
  stage.appendChild(host);d.build(host);
  updateBar(d.sec);host.focus();window.scrollTo(0,0);
  scormSave(d.id);
}
/* ---- SCORM 1.2: bookmark + suspend state on every screen ---- */
function scormSave(id){
  if(!(window.SCORM&&SCORM.present))return;
  SCORM.set('cmi.core.lesson_location',id);
  try{
    SCORM.set('cmi.suspend_data',JSON.stringify({
      d:Object.keys(done), sim:st.sim, simQ:st.simQ,
      fp:st.finalPct, fpass:st.finalPass
    }));
  }catch(e){}
  SCORM.commit();
}
var SECSTART={1:'1.1',2:'2.1',3:'3.1',4:'4.1',5:'5.1',6:'6.1'};
function updateBar(sec){
  var bar=g('bar');
  bar.hidden=(sec===0||sec===8);
  bar.classList.toggle('shift',sec===7);
  var bk=g('backBtn');if(bk)bk.disabled=(cur<=0);
  if(sec>=1&&sec<=6){
    var nodes=g('stepper').querySelectorAll('.node');
    nodes.forEach(function(nd){var n=+nd.dataset.n,c=(n===sec),dn=!!done[n];
      nd.classList.toggle('current',c);nd.classList.toggle('done',dn&&!c);
      nd.disabled=false;nd.textContent=(dn&&!c)?'✓':n;}); // free navigation — any section, any time
    g('stepper').querySelectorAll('.link').forEach(function(lk,ix){lk.classList.toggle('filled',!!done[ix+1]);});
    g('readyPct').textContent=Object.keys(done).length+' / 6';
  }
}
function buildStepper(){
  var sp=g('stepper');
  for(var i=1;i<=6;i++){
    var seg=el('<div class="seg"></div>');
    var b=el('<button class="node" data-n="'+i+'" aria-label="Section '+i+'">'+i+'</button>');
    b.addEventListener('click',function(){goTo(SECSTART[+this.dataset.n]);});
    seg.appendChild(b);if(i<6)seg.appendChild(el('<div class="link"></div>'));
    sp.appendChild(seg);
  }
}
function setClock(t){g('clock').textContent=t;}
function fb(type,head,body){var ic=type==='good'?'✓':type==='bad'?'✕':type==='tip'?'!':'i';
  head=(head||'').replace(/^[✓✕⚠›~!\s]+/,'');
  return el('<div class="fb show '+type+'"><div class="head"><span class="ic">'+ic+'</span>'+head+'</div>'+body+'</div>');}
function contBtn(label,fn,style){var b=el('<button class="btn '+(style||'primary')+'" type="button">'+label+'</button>');if(typeof fn==='function')b.addEventListener('click',fn);return b;}
function actions(host){var a=el('<div class="actions"></div>');host.appendChild(a);return a;}
/* one-attempt MCQ; opts:[{t,k:'best'|'ok'|'warn'|'bad',f,go}] */
var TIER={best:['good','Best answer'],ok:['good','Right'],warn:['tip','Nearly'],bad:['bad','Not this']};
function svin(elm){requestAnimationFrame(function(){try{elm.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(_){}});}
function mcq(host,cfg){
  var wrap=el('<div class="opts'+(cfg.skin?' skin-'+cfg.skin:'')+'"></div>'),locked=false,fbBox=null;
  function showBox(type,head,body){
    if(fbBox)fbBox.remove();
    fbBox=fb(type,head,body);
    wrap.parentNode.insertBefore(fbBox,wrap.nextSibling);
    svin(fbBox);
    return fbBox;
  }
  cfg.opts.forEach(function(o){
    var b=el('<button class="opt" type="button"><span class="dot"></span><span class="body">'+(o.l?'<span class="l">'+o.l+'</span>':'')+o.t+'</span></button>');
    b.addEventListener('click',function(){
      if(locked||b.disabled)return;
      if(cfg.nav){locked=true;wrap.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
        b.classList.add('g-pick');setTimeout(function(){ (o.go?goTo(o.go):next()); },250);return;}
      if(o.k==='bad'||o.k==='warn'){
        // not good enough: explain, rule this option out, keep the learner going
        var wrong=(o.k==='bad');
        b.classList.add(wrong?'g-no':'g-warn');b.disabled=true;
        showBox(wrong?'bad':'tip',
          wrong?'Not this one — try again':'Nearly — but you can do better',
          (o.f||'')+'<br><br><i>There\'s a stronger answer here. Pick again.</i>');
        return;
      }
      locked=true;
      wrap.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
      b.classList.add('g-ok');
      var t=TIER[o.k];
      var box=showBox(t[0],cfg.heads&&cfg.heads[o.k]?cfg.heads[o.k]:t[1],o.f||'');
      if(cfg.after)cfg.after(o,box);
      var a=host.querySelector('.actions')||actions(host);
      a.appendChild(contBtn(cfg.cont||'Continue',function(){cfg.onDone?cfg.onDone(o):next();}));
    });
    wrap.appendChild(b);
  });
  host.appendChild(wrap);return wrap;
}
/* countdown chip with accessible extend */
function timerChip(host,secs,onExpire){
  var left=secs,chip=el('<div class="timerchip" role="timer"><span aria-hidden="true">⏱</span><span class="tt">'+left+'s</span><button class="ext" type="button">need more time? +15s</button></div>');
  host.appendChild(chip);var stopped=false;
  var iv=setInterval(function(){
    left--;chip.querySelector('.tt').textContent=left+'s';
    if(left<=5)chip.classList.add('low');
    if(left<=0){clearInterval(iv);if(!stopped){stopped=true;onExpire();}}
  },1000);
  timers.push(iv);
  chip.querySelector('.ext').addEventListener('click',function(){left+=15;chip.classList.remove('low');chip.querySelector('.tt').textContent=left+'s';});
  return {stop:function(){stopped=true;clearInterval(iv);chip.remove();}};
}
/* reorder list; retry until correct */
function orderList(host,cfg){
  var seq=cfg.items.slice(),ol=el('<ol class="steps"></ol>');host.appendChild(ol);
  var fbHost=el('<div></div>');host.appendChild(fbHost);
  var btn=contBtn(cfg.btn||'Check the order',check,'blue');host.appendChild(btn);
  function rs(){ol.innerHTML='';seq.forEach(function(l,idx){
    var li=el('<li class="si"><span class="pos">'+(idx+1)+'</span><span class="txt">'+l+'</span><span class="vd"></span><span class="mvs"><button class="mv up" aria-label="Move up">▲</button><button class="mv down" aria-label="Move down">▼</button></span></li>');
    li.querySelector('.up').disabled=idx===0;li.querySelector('.down').disabled=idx===seq.length-1;
    li.querySelector('.up').addEventListener('click',function(){mv(idx,-1);});
    li.querySelector('.down').addEventListener('click',function(){mv(idx,1);});
    ol.appendChild(li);});}
  function mv(i,d){var j=i+d;if(j<0||j>=seq.length)return;var t=seq[i];seq[i]=seq[j];seq[j]=t;rs();ol.querySelectorAll('.si')[j].querySelector(d<0?'.up':'.down').focus();fbHost.innerHTML='';}
  function check(){var ok=true;
    ol.querySelectorAll('.si').forEach(function(li,idx){li.classList.remove('g-ok','g-no');var v=li.querySelector('.vd');
      if(seq[idx]===cfg.correct[idx]){li.classList.add('g-ok');v.textContent='✓';}else{li.classList.add('g-no');v.textContent='✕';ok=false;}});
    fbHost.innerHTML='';
    if(ok){
      fbHost.appendChild(fb('good',cfg.okHead||'✓ That\'s it',cfg.okText||''));
      ol.querySelectorAll('.mv').forEach(function(m){m.disabled=true;});
      btn.style.display='none';
      var a=host.querySelector('.actions')||actions(host);
      a.appendChild(contBtn(cfg.cont||'Next',function(){cfg.onDone?cfg.onDone():next();}));
    }else{
      fbHost.appendChild(fb('bad',cfg.noHead||'✕ Not yet',cfg.noText||''));
    }
    svin(fbHost);}
  rs();
}
/* tap-or-drag two-column sort */
function sortBuckets(host,cfg){
  var picked=null,placed=0;
  host.appendChild(el('<div class="pickhint" id="ph-'+cfg.key+'">Tap a card, then tap the column it belongs in.</div>'));
  var tray=el('<div class="tray"></div>');host.appendChild(tray);
  var bwrap=el('<div class="buckets"><div class="bucket '+(cfg.cls1||'b-watch')+'" data-k="'+cfg.k1+'"><div class="bh">'+cfg.h1+'</div><div class="bdrop"></div></div><div class="bucket '+(cfg.cls2||'b-now')+'" data-k="'+cfg.k2+'"><div class="bh">'+cfg.h2+'</div><div class="bdrop"></div></div></div>');
  host.appendChild(bwrap);
  var fbHost=el('<div></div>');host.appendChild(fbHost);
  var btn=contBtn(cfg.btn||'Check','','blue');btn.disabled=true;host.appendChild(btn);
  var hint=host.querySelector('#ph-'+cfg.key);
  cfg.items.forEach(function(it,i){
    var c=el('<div class="dcard" tabindex="0" role="button" data-i="'+i+'"><span class="b"></span>'+it.t+'</div>');
    c.addEventListener('click',function(){if(c.classList.contains('g-ok'))return;if(c._drag){c._drag=false;return;}pick(c);});
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!c.classList.contains('g-ok'))pick(c);}});
    tray.appendChild(c);
  });
  bwrap.querySelectorAll('.bucket').forEach(function(bk){bk.addEventListener('click',function(e){if(e.target.closest('.dcard'))return;if(picked)place(picked,bk.dataset.k);});});
  function pick(c){c.classList.remove('g-no');
    if(picked===c){picked=null;c.classList.remove('picked');hint.textContent='Tap a card, then tap the column it belongs in.';return;}
    if(picked)picked.classList.remove('picked');picked=c;c.classList.add('picked');
    hint.textContent='Now tap a column to drop "'+cfg.items[+c.dataset.i].t+'".';}
  function place(c,k){c.classList.remove('picked','g-no');picked=null;
    bwrap.querySelector('.bucket[data-k="'+k+'"] .bdrop').appendChild(c);
    var was=c.dataset.placed;c.dataset.placed=k;if(!was)placed++;hint.textContent='';btn.disabled=placed<cfg.items.length;}
  function za(x,y){var e=document.elementFromPoint(x,y);return e?e.closest('.bucket'):null;}
  function hov(z){bwrap.querySelectorAll('.bucket').forEach(function(b){b.classList.remove('over');});if(z)z.classList.add('over');}
  btn.addEventListener('click',function(){var ok=true,wrongs=[];
    cfg.items.forEach(function(it,i){var c=host.querySelector('.dcard[data-i="'+i+'"]');c.classList.remove('g-ok','g-no');
      if(c.dataset.placed===it.k)c.classList.add('g-ok');else{c.classList.add('g-no');ok=false;wrongs.push(it);}});
    fbHost.innerHTML='';
    if(ok){
      fbHost.appendChild(fb('good',cfg.okHead,cfg.okText));
      btn.style.display='none';
      var a=host.querySelector('.actions')||actions(host);
      a.appendChild(contBtn(cfg.cont||'Next',function(){cfg.onDone?cfg.onDone():next();}));
    }else{
      var detail=wrongs.slice(0,3).map(function(it){return '<b>'+it.t+'</b>'+(it.why?' — '+it.why:'');}).join('<br>');
      if(wrongs.length>3)detail+='<br><i>…and '+(wrongs.length-3)+' more marked in red.</i>';
      detail+='<br><br><i>Move the red cards and check again.</i>';
      fbHost.appendChild(fb('bad',wrongs.length+(wrongs.length===1?' card is':' cards are')+' in the wrong column',detail));
    }
    svin(fbHost);});
}

function vidSlot(host,name,opts){
  opts=opts||{};
  var w=el('<div class="vidwrap" hidden><div class="vidctl"><button type="button" class="vc mute" aria-pressed="false"></button><button type="button" class="vc cc" aria-pressed="true">CC</button></div></div>');
  var v=document.createElement('video');
  v.setAttribute('playsinline','');v.muted=false;v.preload='metadata';
  if(opts.loop)v.loop=true;
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)v.controls=true;
  var tr=document.createElement('track');
  tr.kind='captions';tr.label='English';tr.srclang='en';tr.src='captions/'+name+'.vtt';tr.default=true;
  v.appendChild(tr);
  v.src='video/'+name+'.mp4';
  w.insertBefore(v,w.firstChild);
  var anchor=opts.before?host.querySelector(opts.before):host.firstChild;
  host.insertBefore(w,anchor);
  if(opts.compact)w.classList.add('vcompact');
  /* hide the still-image fallback NOW — it only returns if the video fails */
  var fallbackEl=opts.hide?host.querySelector(opts.hide):null;
  if(fallbackEl)fallbackEl.style.display='none';
  var mb=w.querySelector('.mute');
  function syncMuteBtn(){mb.setAttribute('aria-pressed',String(!v.muted));mb.textContent=v.muted?'🔇 Sound':'🔊 Sound';}
  syncMuteBtn();
  v.autoplay=!reduced; if(!reduced)v.setAttribute('autoplay','');
  v.addEventListener('loadeddata',function(){
    if(!v.isConnected)return; // user already navigated away
    w.hidden=false;
    try{if(v.textTracks[0])v.textTracks[0].mode='showing';}catch(_){}
    if(reduced)return;
    /* sound-first: try unmuted autoplay; if the browser/LMS blocks it,
       play muted but show an unmissable "tap for sound" pill */
    v.muted=false;syncMuteBtn();
    v.play().catch(function(){
      v.muted=true;syncMuteBtn();
      var pill=el('<button type="button" class="vsound">🔊 Tap for sound</button>');
      pill.addEventListener('click',function(){v.muted=false;syncMuteBtn();pill.remove();if(v.paused)v.play().catch(function(){});});
      w.appendChild(pill);
      v.play().catch(function(){
        // even muted autoplay blocked (strict LMS iframe policy) — one-tap start WITH sound
        pill.remove();
        var ov=el('<button type="button" class="vplay" aria-label="Play video"><span>▶</span></button>');
        ov.addEventListener('click',function(){v.muted=false;syncMuteBtn();v.play().catch(function(){v.muted=true;syncMuteBtn();v.play().catch(function(){});});ov.remove();});
        w.appendChild(ov);
      });
    });
  });
  /* any first tap on the page also resumes a stalled video */
  document.addEventListener('pointerdown',function once(){
    document.removeEventListener('pointerdown',once,true);
    if(!reduced&&v.isConnected&&v.paused&&!v.ended){v.play().catch(function(){});}
  },true);
  v.addEventListener('error',function(){if(fallbackEl)fallbackEl.style.display='';w.remove();});
  /* when a (non-looping) clip finishes, bring the buttons/choices into view */
  v.addEventListener('ended',function(){
    if(v.loop)return;
    w.classList.add('vended');
    var scr=host.closest?host.closest('.screen'):null; scr=scr||host;
    var t=scr.querySelector('.actions .btn')||scr.querySelector('.cchoices')||scr.querySelector('.opts')||scr.querySelector('.rbuild');
    if(t)setTimeout(function(){t.scrollIntoView({behavior:'smooth',block:'center'});},250);
  });
  mb.addEventListener('click',function(){v.muted=!v.muted;syncMuteBtn();});
  var cb=w.querySelector('.cc');
  cb.addEventListener('click',function(){var t=v.textTracks[0];if(!t)return;var on=(t.mode==='showing');t.mode=on?'hidden':'showing';cb.setAttribute('aria-pressed',String(!on));});
  return w;
}
function boot(){

  var resumed=false;

    try{
      var sd=SCORM.get('cmi.suspend_data');
      if(sd){
        var d=JSON.parse(sd);
        (d.d||[]).forEach(function(k){done[k]=true;});
        if(d.sim)st.sim=d.sim;
        if(d.simQ)st.simQ=d.simQ;
        if(d.fp!==undefined&&d.fp!==null){st.finalPct=d.fp;st.finalPass=d.fpass;}
      }
      var loc=SCORM.get('cmi.core.lesson_location');
      if(loc&&idxOf(loc)>0){render(idxOf(loc));resumed=true;}
    }catch(e){/* corrupt suspend data — start fresh */}
    /* hand the session back cleanly however the window closes */
    var bye=function(){SCORM.finish(true);};
    window.addEventListener('pagehide',bye);
    window.addEventListener('beforeunload',bye);
  }
  if(!resumed)render(0);
}

/* ============ SECTION 1 — SHOW UP READY ============ */
var KIT12=[
 {id:'pass',ic:'pass',n:'Accreditation pass'},{id:'radio',ic:'radio',n:'Radio'},{id:'water',ic:'water',n:'Water bottle'},
 {id:'vest',ic:'vest',n:'Hi-vis vest'},{id:'boots',ic:'boots',n:'Boots'},{id:'phone',ic:'phone',n:'Phone'},
 {id:'sun',ic:'sun',n:'Sunglasses'},{id:'keys',ic:'keys',n:'Keys'},{id:'note',ic:'note',n:'Notebook'},
 {id:'gloves',ic:'gloves',n:'Gloves'},{id:'torch',ic:'torch',n:'Torch'},{id:'snack',ic:'snack',n:'Snack'}];
function kitGrid(h,order){
  var grid=el('<div class="tiles"></div>'),sel={};
  order.forEach(function(id){
    var it=KIT12.filter(function(x){return x.id===id;})[0];
    var b=el('<button class="tile" type="button" aria-pressed="false" data-id="'+it.id+'"><span class="ck"></span>'+ico(it.ic)+'<span class="nm">'+it.n+'</span></button>');
    b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',on?'false':'true');
      if(on)delete sel[it.id];else sel[it.id]=1;if(grid._onSel)grid._onSel(Object.keys(sel));});
    grid.appendChild(b);
  });
  h.appendChild(grid);
  return {sel:function(){return Object.keys(sel);},reset:function(){sel={};grid.querySelectorAll('.tile').forEach(function(t){t.setAttribute('aria-pressed','false');});},grid:grid};
}
scr('1.1',1,function(h){
  h.innerHTML='<div class="kicker">Section 1 · Show up ready</div><h2>The kit room</h2><p class="q">Gates open in 60 seconds. Tap everything you\'d take with you to your post.</p>';
  var api=kitGrid(h,['pass','radio','water','vest','boots','phone','sun','keys','note','gloves','torch','snack']);
  var a=actions(h);
  var goBtn=contBtn('Go to my post',function(){
    var s=api.sel();
    st.missed=['vest','pass','radio','water'].filter(function(k){return s.indexOf(k)<0;});
    st.tookPhone=s.indexOf('phone')>=0;
    next();
  });
  goBtn.disabled=true;
  api.grid._onSel=function(sel){goBtn.disabled=sel.length===0;};
  a.appendChild(goBtn);
});
scr('1.2',1,function(h){
  h.innerHTML='<div class="kicker">What happens next</div>';
  if(st.missed.length){
    var NM={vest:'hi-vis vest',pass:'accreditation pass',radio:'radio',water:'water'};
    h.appendChild(el('<p class="lead" style="margin-bottom:12px">Missing from your kit: <b>'+st.missed.map(function(k){return NM[k];}).join(', ')+'</b>.</p>'));
  }
  var branches={
    vest:['✕ No vest.','<p>To the crowd, you\'re just another spectator.</p><p>Someone needs help — they look straight past you.</p><p>Your supervisor sends you back before you reach your post.</p>'],
    pass:['✕ Red light.','<p>The scanner rejects you. Your supervisor is behind you.</p><p class="say">"You can\'t come through without that. Go and get it."</p><p>You\'re 15 minutes late. Kelly is covering two posts.</p>'],
    radio:['Two hours in.','<p>A crowd starts pushing at your gate. You reach for your shoulder.</p><p>There\'s nothing there.</p><p>You have to leave your post to find help.</p>'],
    water:['Hour four. 38 degrees.','<p>You\'re not ill. You\'re just not thinking as clearly.</p><p>This is exactly when the crowd arrives.</p>']
  };
  var shown=0;
  ['vest','pass','radio','water'].forEach(function(k){
    if(st.missed.indexOf(k)>=0&&shown<2){shown++;
      var b=branches[k];h.appendChild(el('<div class="consq"><div class="ch">'+b[0]+'</div>'+b[1]+'</div>'));}
  });
  if(!st.missed.length){
    h.appendChild(el('<div class="consq good"><div class="ch">✓ Green light.</div><p>Your supervisor nods at you once.</p><p>That\'s the whole reward. On a real shift, that\'s what it looks like.</p></div>'));
  }
  var last=h.querySelector('.consq:last-of-type');
  if(st.tookPhone)last.appendChild(el('<p style="margin-top:8px"><b>You also took your phone. We\'ll come back to that.</b></p>'));
  actions(h).appendChild(contBtn('Why this matters',next));
});

scr('1.4',1,function(h){
  h.innerHTML='<h2>Again. 15 seconds.</h2><p class="q">Tap the four things you can\'t start a shift without. Go.</p>';
  var fbHost=el('<div></div>');
  var tw=el('<div></div>');h.appendChild(tw);
  var tc;
  function armTimer(){
    tw.innerHTML='';
    tc=timerChip(tw,15,function(){
      fbHost.innerHTML='';fbHost.appendChild(fb('bad','✕ Time\'s up','Once more — vest, pass, radio, water.'));
      api.reset();armTimer();
    });
  }
  armTimer();
  var api=kitGrid(h,['snack','boots','keys','water','torch','pass','gloves','sun','radio','note','phone','vest']);
  h.appendChild(fbHost);
  var NEED=['vest','pass','radio','water'];
  api.grid._onSel=function(sel){
    if(sel.length<4)return;
    fbHost.innerHTML='';
    var missing=NEED.filter(function(k){return sel.indexOf(k)<0;});
    if(!missing.length&&sel.length===4){
      tc.stop();
      fbHost.appendChild(fb('good','✓ Four out of four.',''));
      api.grid.querySelectorAll('.tile').forEach(function(t){t.disabled=true;});
      var a=h.querySelector('.actions')||actions(h);
      a.appendChild(contBtn('Next',next));
    }else{
      var nm=function(id){return KIT12.filter(function(x){return x.id===id;})[0].n.toLowerCase();};
      var extras=sel.filter(function(k){return NEED.indexOf(k)<0;});
      var msg='';
      if(missing.length)msg+='Still missing: <b>'+missing.map(nm).join(', ')+'</b>.';
      if(extras.length)msg+=(msg?'<br>':'')+'Leave behind: <b>'+extras.map(nm).join(', ')+'</b> — locker items.';
      fbHost.appendChild(fb('bad','✕ Not the right four',msg+'<br>Try once more.'));
      svin(fbHost);
      api.reset();
    }
  };
});

scr('1.7',1,function(h){
  h.innerHTML='<h2>This one\'s about tomorrow</h2><p class="lead">Tomorrow\'s shift starts at <b>15:00</b>. Briefing is at <b>14:45</b>. You need to be in early enough to collect your kit, read the notices and find your gate — about <b>20 minutes</b> before briefing.</p>'+
  '<p class="q">What time will you walk through the staff entrance?</p>'+
  '<div class="howto">Tap + and − to set the time.</div>'+
  '<div class="tpick" role="group" aria-label="Set your leaving time">'+
    '<div class="tp"><button type="button" id="hUp" aria-label="Hour up">+</button><div class="tv" id="hV" aria-live="polite">13</div><button type="button" id="hDn" aria-label="Hour down">−</button><span class="tl">Hour</span></div>'+
    '<span class="tcolon">:</span>'+
    '<div class="tp"><button type="button" id="mUp" aria-label="Minutes up">+</button><div class="tv" id="mV" aria-live="polite">00</div><button type="button" id="mDn" aria-label="Minutes down">−</button><span class="tl">Min</span></div>'+
  '</div>'+
  '<p style="font-size:12px;color:var(--faint);text-align:center;margin:0 0 12px">Not scored. Not stored. Not shown to anyone.</p>';
  var hr=14,mn=30,touched=false;
  function paint(){g('hV').textContent=(hr<10?'0':'')+hr;g('mV').textContent=(mn<10?'0':'')+mn;}
  function bind(id,fn){g(id).addEventListener('click',function(){fn();touched=true;doneBtn.disabled=false;fbHost.innerHTML='';paint();});}
  bind('hUp',function(){hr=Math.min(15,hr+1);});
  bind('hDn',function(){hr=Math.max(5,hr-1);});
  bind('mUp',function(){mn=(mn+5)%60;});
  bind('mDn',function(){mn=(mn+55)%60;});
  var fbHost=el('<div></div>');h.appendChild(fbHost);
  var a=actions(h);
  var shown=false;
  var doneBtn=contBtn('Section complete',function(){
    if(!shown){
      shown=true;
      var mins=(14*60+45)-(hr*60+mn); // minutes on site before briefing
      var at=g('hV').textContent+':'+g('mV').textContent;
      if(mins<=0){fbHost.appendChild(fb('bad','That\'s too late','Briefing starts at <b>14:45</b>. Arriving at '+at+' means walking in after it has already started. Wind the clock back.'));shown=false;return;}

scr('3.1',3,function(h){
  h.innerHTML='<div class="kicker">Section 3 · Represent us to the public</div>'+
  '<h2>The angry dad — bring him back down</h2>';
  vidSlot(h,'spectator',{compact:true});

  var fill=mw.querySelector('.mfill'),face=mw.querySelector('.mface'),lab=mw.querySelector('.mlabel');
  function paint(){
    var m=Math.max(0,Math.min(100,mood));
    fill.style.width=m+'%';
    fill.style.background=m>66?'var(--red)':m>40?'#e6a417':'var(--teal)';
    face.textContent=m>75?'😡':m>55?'😠':m>35?'😐':m>18?'🙂':'😌';
    lab.textContent=(m>66?'FURIOUS':m>40?'TENSE':m>20?'CALMING':'CALM')+' · '+Math.round(m);
  }
  paint();
  function bub(side,txt){var b=el('<div class="cbub '+side+'">'+txt+'</div>');chat.appendChild(b);b.scrollIntoView({block:'nearest'});}
  bub('sp','"Twice! We\'ve been sent to the wrong entrance <b>twice</b>!"');
  var TURNS=[
    [ {t:'"That\'s not my problem, mate."',d:22,r:'"Not your— are you serious?! Whose is it then?!"'},
      {t:'"Please calm down."',d:14,r:'"Don\'t tell me to calm down!"'},
      {t:'"Can I see your ticket?"',d:-6,r:'"I\'ve shown three people my ticket already!"'},
      {t:'"I\'m sorry about that — twice isn\'t good enough."',d:-26,r:'"...Yeah. It\'s been a nightmare, honestly."'} ],
    [ {t:'"It\'s not my fault where they sent you."',d:22,r:'"I don\'t care whose fault it is!"'},
      {t:'"There\'s a queue, I\'ll get to you."',d:12,r:'"We\'ve BEEN queuing!"'},
      {t:'"Let me check that ticket right now."',d:-12,r:'"...Fine. Here."'},
      {t:'"Let\'s get it sorted — pass me the ticket."',d:-20,r:'"Thank you. Here you go."'} ],
    [ {t:'"It\'s just down that way."',d:10,r:'"Which way?! Ugh."'},
      {t:'"Ask someone at the next gate."',d:16,r:'"You\'re passing me on AGAIN?"'},
      {t:'"Gate 4 — I\'ll walk you there myself."',d:-20,r:'"...Cheers. Genuinely, thank you."'} ]
  ];
  var ti=0;
  function step(){
    ch.innerHTML='';
    if(ti>=TURNS.length){return resolve();}
    TURNS[ti].forEach(function(o){
      var b=el('<button type="button" class="cchoice">'+o.t+'</button>');
      b.addEventListener('click',function(){
        ch.innerHTML='';
        bub('me',o.t);
        mood+=o.d;paint();
        setTimeout(function(){bub('sp',o.r);ti++;setTimeout(step,650);},450);
      });
      ch.appendChild(b);
    });
    svin(ch);
  }
  function resolve(){
    var m=Math.max(0,Math.min(100,mood)),box,partial=false;
    if(m<=28){box=el('<div class="consq good"><div class="ch">✓ He\'s calm.</div><p>His shoulders drop. He takes his daughter\'s hand and thanks you on the way to Gate 4.</p><p><b>You acknowledged first, then acted. That\'s the whole skill.</b></p></div>');}

    actions(h).appendChild(contBtn('Why that worked',function(){goTo('3.3');}));
  }
  step();
});

  h.appendChild(list);
