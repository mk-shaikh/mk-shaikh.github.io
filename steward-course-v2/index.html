scr('5.1',5,function(h){
  h.innerHTML='<div class="kicker">Section 5 · Do it by the book</div><h2>Watch what happens</h2><p class="lead">Read this carefully. You\'ll be writing it up.</p>'+
  '';
  var pnls=el('<div class="panels"></div>');
  [['19:40','1 of 4','A man walks toward Kiosk 4, drink in hand.'],
   ['19:40','2 of 4','He slips on a wet patch on the floor.'],
   ['19:41','3 of 4','He sits up. He says he\'s fine.'],
   ['19:41','4 of 4','He waves away help and walks off.']]
  .forEach(function(s,i){
    pnls.appendChild(el('<div class="pnl"><span class="ptime">'+s[0]+'</span><span class="pstep">'+s[1]+'</span>'+slipPanel(i+1)+'<span class="pdesc">'+s[2]+'</span></div>'));
  });
  h.appendChild(pnls);
  h.appendChild(el('<p class="pcap">Kiosk 4, concourse level. Scroll through all four before you write it up.</p>'));
  vidSlot(h,'kiosk-slip',{before:'.panels',hide:'.panels'});
  actions(h).appendChild(contBtn('File the report',next));
});
var STMTS=[
 {t:'Spectator slipped at approximately 19:40 near Kiosk 4.',ok:true},
 {t:'Spectator appeared to have been drinking.',ok:false,key:'drink'},
 {t:'There was water on the floor from the kiosk.',ok:false,key:'cause'},
 {t:'Spectator declined assistance and continued walking.',ok:true},
 {t:'No injury occurred.',ok:false,key:'inj'},
 {t:'Spectator stated they were uninjured.',ok:true},
 {t:'The kiosk staff should be more careful.',ok:false,key:'blame'},
 {t:'Wet patch approximately 1 metre across observed at the same location.',ok:true}
];
scr('5.2',5,function(h){
  h.innerHTML='<h2>Your report</h2>'+
  '<p class="q">Build it one line at a time. For each line: does it go <b>in</b> the report, or <b>out</b>?</p>'+
  '<div id="rline"></div>'+
  '<div class="opts reportsheet" id="rsheet"><div class="rshead">JAM INCIDENT REPORT <span>KIOSK 4 · 19:40</span></div><div class="rsempty" id="rsempty">— empty —</div></div>';
  var i=0,included=[];
  var line=g('rline');
  function render(){
    if(i>=STMTS.length){
      line.innerHTML='';
      st.report=included.slice();
      var a=actions(h);a.innerHTML='';
      a.appendChild(contBtn('Submit report',next));
      svin(h.querySelector('.actions'));
      return;
    }
    var s=STMTS[i];
    line.innerHTML='<div class="rdecide"><div class="rdn">LINE '+(i+1)+' OF '+STMTS.length+'</div><div class="rdt">'+s.t+'</div>'+
      '<div class="rdbtns"><button type="button" class="btn primary" id="rin">Put it in</button><button type="button" class="btn ghost" id="rout">Leave it out</button></div></div>';
    g('rin').addEventListener('click',function(){
      included.push(i);
      g('rsempty').style.display='none';
      h.querySelector('#rsheet').appendChild(el('<div class="rsline">'+s.t+'</div>'));
      i++;render();
    });
    g('rout').addEventListener('click',function(){i++;render();});
  }
  render();
});
scr('5.3',5,function(h){
  h.innerHTML='<div class="kicker">Three weeks later</div>';
  var inc=st.report||[];
  function has(key){return inc.some(function(i){return STMTS[i].key===key;});}
  var dirty=false;
  if(has('drink')){dirty=true;h.appendChild(el('<div class="consq"><div class="ch">A solicitor reads your report.</div><p class="say">"You wrote that the spectator appeared to have been drinking. What did you observe that led you to that?"</p><p>You have to answer. And now every other line in your report is being questioned too.</p><p><b>One guess contaminates the facts around it.</b></p></div>'));}
  if(has('cause')){dirty=true;h.appendChild(el('<div class="consq"><div class="ch">"From the kiosk?"</div><p>You saw water. You did not see where it came from.</p><p><b>You\'ve just made a claim about who was responsible.</b></p></div>'));}
  if(has('inj')){dirty=true;h.appendChild(el('<div class="consq"><div class="ch">A claim was submitted two days later.</div><p>Your report says no injury occurred. You couldn\'t possibly have known that.</p><p><b>"They said they were fine" is defensible. "They were fine" is not.</b></p></div>'));}
  if(has('blame')){dirty=true;h.appendChild(el('<div class="consq"><div class="ch">"Should be more careful."</div><p>An opinion about colleagues, in a legal document, in your handwriting.</p></div>'));}
  var missedFacts=STMTS.filter(function(s,i){return s.ok&&inc.indexOf(i)<0;}).length;
  if(!dirty&&!missedFacts){h.appendChild(el('<div class="consq good"><div class="ch">✓ Read once. Accepted. Never queried.</div><p>That\'s the whole goal. A good report is one nobody has to come back to.</p></div>'));}
  else if(!dirty&&missedFacts){h.appendChild(el('<div class="consq good"><div class="ch">✓ Nothing in it caused trouble.</div><p>But '+missedFacts+' observed fact'+(missedFacts>1?'s':'')+' stayed out. Facts you saw belong in — they\'re what protects everyone later.</p></div>'));}
  actions(h).appendChild(contBtn('The rule',next));
});

  h.innerHTML='<h2>Write what you saw. Not what it meant.</h2>'+
  '<p class="lead">Here\'s the trick: imagine a camera was watching. A camera can film someone <b>wobbling and smelling of alcohol</b> — it can\'t film "drunk", because drunk is your opinion. If a camera could have recorded it, write it. If it\'s your interpretation, leave it out.</p>'+
  '<div class="card" style="padding:0;overflow:hidden"><table style="width:100%;border-collapse:collapse;font-size:14px">'+
  '<tr style="background:var(--surface-2)"><th style="text-align:left;padding:10px 14px;color:var(--teal);font-family:var(--font-display)">WRITE THIS</th><th style="text-align:left;padding:10px 14px;color:var(--red);font-family:var(--font-display)">NOT THIS</th></tr>'+
  '<tr><td class="wtd"><span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l-1 8a3 3 0 0 1-6 0L8 2z"/><path d="M12 13v7"/><path d="M8 22h8"/></svg></span>Smelled of alcohol</td><td class="ntd">Was drunk</td></tr>'+
  '<tr><td class="wtd"><span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg></span>Was shouting</td><td class="ntd">Was aggressive</td></tr>'+
  '<tr><td class="wtd"><span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span>Water on floor</td><td class="ntd">Spillage from kiosk</td></tr>'+
  '<tr><td class="wtd"><span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 1 1-4-6.9"/><path d="M9 12l2 2 4-5"/></svg></span>Said they were fine</td><td class="ntd">Was fine</td></tr></table></div>'+

scr('5.6',5,function(h){
  h.innerHTML='<div class="kicker">Live it</div><h2>One incident, six steps</h2>'+
  '<p class="lead">Every JAM incident runs through the same six steps. Don\'t memorise them — <b>do</b> them. You\'re back at Kiosk 4.</p>'+
  '<div class="steptrack" id="strack"></div><div id="sstage"></div>';
  var STEPS=['Observe','Assess','Report','Escalate','Record','Follow up'];
  var track=g('strack');
  STEPS.forEach(function(nm,i){track.appendChild(el('<span class="stp" data-i="'+i+'"><i>'+(i+1)+'</i>'+nm+'</span>'));});
  var MOM=[
    {img:2,scene:'A man goes down hard in front of you, drink flying.',q:'First move?',
     opts:[['Stop and look — what\'s actually happened?',1],['Grab the radio straight away',0],['Start writing notes',0]],
     why:'Look first. You can\'t report or judge what you haven\'t seen. That\'s <b>Observe</b>.'},
    {img:3,scene:'He\'s sitting up, talking, rubbing his elbow. The floor around him is wet.',q:'Now what?',
     opts:[['Judge it: how serious, who\'s at risk?',1],['Help him up and move on',0],['Shout for a supervisor',0]],
     why:'Weigh it before you act: he\'s conscious, the wet floor could catch someone else. That\'s <b>Assess</b>.'},
    {img:0,scene:'Minor, but real — and the wet patch is still there.',q:'Who needs to know?',
     opts:[['Radio Control: where, what, how bad',1],['Nobody — he says he\'s fine',0],['Post about it in the group chat',0]],
     why:'"Control from Kiosk 4. One spectator slipped, conscious. Wet floor still exposed. Over." That\'s <b>Report</b>.'},
    {img:0,scene:'Control answers: "Received. Do you need anything?"',q:'What do you ask for?',
     opts:[['First aid to check him + a cleaner for the floor',1],['Nothing, it\'ll sort itself out',0]],
     why:'Get the right help moving. That\'s <b>Escalate</b> — you don\'t fix it alone.'},
    {img:4,scene:'He\'s been checked and walks off. The floor\'s being mopped.',q:'And the paperwork?',
     opts:[['Write it down now, this shift',1],['Do it at home tomorrow',0],['Skip it — nothing came of it',0]],
     why:'Time, place, what you saw — while you still remember it. That\'s <b>Record</b>.'},
    {img:0,scene:'End of shift. Your report\'s filed.',q:'Last thing?',
     opts:[['Check it was resolved and hand over',1],['Straight home',0]],
     why:'Close the loop so the next shift isn\'t blind. That\'s <b>Follow up</b> — and that\'s all six.'}
  ];
  var mi=0,stage=g('sstage');
  function show(){
    var m=MOM[mi];
    stage.innerHTML='<div class="moment">'+(m.img?slipPanel(m.img):'')+
      '<p class="mscene">'+m.scene+'</p><p class="q">'+m.q+'</p><div class="mopts"></div><div class="mfb"></div></div>';
    var mo=stage.querySelector('.mopts');
    m.opts.forEach(function(o){
      var b=el('<button type="button" class="cchoice">'+o[0]+'</button>');
      b.addEventListener('click',function(){
        var fbx=stage.querySelector('.mfb');fbx.innerHTML='';
        if(o[1]){
          [].forEach.call(mo.children,function(x){x.disabled=true;});
          track.querySelector('[data-i="'+mi+'"]').classList.add('lit');
          fbx.appendChild(fb('good','Step '+(mi+1)+' — '+STEPS[mi],m.why));
          var nb=contBtn(mi<MOM.length-1?'Keep going':'All six — recap',function(){mi++;if(mi<MOM.length)show();else finishS56();});
          fbx.appendChild(nb);svin(fbx);
        }else{
          fbx.appendChild(fb('bad','Not that','Think about the order: people first, paperwork last. Try again.'));svin(fbx);
        }
      });
      mo.appendChild(b);
    });
    svin(stage);
  }
  function finishS56(){
    stage.innerHTML='<div class="consq good"><div class="ch">✓ You just ran a full incident.</div><p><b>Observe → Assess → Report → Escalate → Record → Follow up.</b></p><p>Look, judge, tell someone, get help — then write it down and see it through.</p></div>';
    actions(h).appendChild(contBtn('Quick check',next));svin(stage);
  }
  show();
});

scr('5.8',5,function(h){
  h.innerHTML='<h2>Fix this report</h2><p class="lead">Another steward wrote this. It has <b>three</b> problems — a guess about a person, a cause nobody saw, and a claim nobody could know.</p><p class="q">Tap the three problem phrases.</p>';
  var TOKS=[
    {t:'At 19:40 a',x:0,plain:1},{t:'drunk',x:1},
    {t:'bloke fell over near the kiosk',x:0,plain:1},{t:'because the floor was wet from the cleaners.',x:1},
    {t:'He was fine.',x:1},{t:'Told him to be more careful.',x:0}
  ];
  var box=el('<div class="toks"></div>'),sel={};
  TOKS.forEach(function(tk,i){
    if(tk.plain){box.appendChild(document.createTextNode(tk.t+' '));return;}
    var b=el('<button class="tok" type="button" aria-pressed="false">'+tk.t+'</button>');
    b.addEventListener('click',function(){if(b.classList.contains('graded'))return;var on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',on?'false':'true');if(on)delete sel[i];else sel[i]=1;});
    b.dataset.i=i;box.appendChild(b);box.appendChild(document.createTextNode(' '));
  });
  h.appendChild(box);
  var fbHost=el('<div></div>');h.appendChild(fbHost);
  var btn=contBtn('Check','','blue');h.appendChild(btn);
  btn.addEventListener('click',function(){
    var ok=true;
    box.querySelectorAll('.tok').forEach(function(b){
      var i=+b.dataset.i,should=!!TOKS[i].x,did=b.getAttribute('aria-pressed')==='true';
      b.classList.add('graded');b.classList.remove('g-ok','g-no','g-miss');
      if(should&&did)b.classList.add('g-ok');
      else if(should&&!did){b.classList.add('g-miss');ok=false;}
      else if(!should&&did){b.classList.add('g-no');ok=false;}
    });
    fbHost.innerHTML='';
    if(ok){fbHost.appendChild(fb('good','✓ All three.','Easier to spot in someone else\'s writing than your own. That\'s why we did it this way round.'));
      btn.style.display='none';
      actions(h).appendChild(contBtn('Section complete',next));
    }else{
      var missed=[],wrong=[];
      box.querySelectorAll('.tok').forEach(function(b){var i=+b.dataset.i;
        if(b.classList.contains('g-miss'))missed.push('"'+TOKS[i].t+'"');
        if(b.classList.contains('g-no'))wrong.push('"'+TOKS[i].t+'"');});
      var m='';
      if(missed.length)m+='<b>Still to find (amber):</b> '+missed.join(', ')+'<br>';
      if(wrong.length)m+='<b>That one\'s fine (red):</b> '+wrong.join(', ')+' — it\'s an observed fact.<br>';
      m+='<br>You\'re looking for: a guess about a person, a cause nobody saw, and a claim nobody could know.';
      fbHost.appendChild(fb('bad','Not all three yet',m));
      setTimeout(function(){box.querySelectorAll('.tok').forEach(function(b){b.classList.remove('graded','g-ok','g-no','g-miss');});},2600);
    }
    svin(fbHost);
  });
});

scr('6.2',6,function(h){
  h.innerHTML='<div class="kicker">What happens</div>';
  var B={
    A:['Six weeks later.','<p>Nothing happens. For six weeks.</p><p>Then your phone comes up in an unrelated check, and the photo is on it. Taken in a restricted area you weren\'t authorised to photograph.</p><p><b>The photo existing is the problem. Posting is just how it\'s usually found.</b></p>',0],
    B:['Same night.','<p>Accreditation withdrawn. You\'re not working the rest of the tournament.</p><p>This is the one everybody already knows about. It isn\'t the one that catches people.</p>',0],
    C:['Your friend posts it.','<p>Not you — your friend.</p><p>By morning it\'s on three fan accounts, tagged with the venue.</p><p>The venue asks who was in that corridor. There were four of you.</p><p><b>You didn\'t post anything, and you\'re still the reason it\'s out.</b></p>',0],
    D:['✓ Nothing happens at all. Ever.','<p>That\'s the whole outcome, and it\'s the right one.</p><p><b>Most of the best decisions in this job are invisible.</b></p>',1]
  };
  var b=B[st.s6first||'D'];
  h.appendChild(el('<div class="consq'+(b[2]?' good':'')+'"><div class="ch">'+b[0]+'</div>'+b[1]+'</div>'));
  actions(h).appendChild(contBtn('The rule',next));
});
scr('6.3',6,function(h){
  h.innerHTML='<h2>If you\'re unsure, you already know</h2>'+
  '<p class="lead">Confidential isn\'t just what you\'ve been told to keep quiet — it\'s everything you can see <b>because of where your pass lets you stand</b>.</p>'+
  '<p class="q">Tap each rule to open it. <span id="rseen">0 of 5</span></p><div id="rcards"></div>'+
  '<div class="callout" style="margin-top:14px"><b>The photo is the breach.</b> Posting is just how it gets discovered.</div>';
  function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;flex:none;color:var(--muted)">'+p+'</svg>';}
  var RULES=[
    [ic('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/><line x1="2" y1="2" x2="22" y2="22"/>'),
     'No photos or filming on site','Front of house or back, while you\'re accredited. Not "just for me" either — <b>the photo existing is the breach</b>.'],

     'Serious things go in a report','Incidents, hazards, mistakes — yours included. The report is the only channel; <b>group chats and DMs don\'t count</b>.'],

/* ============ SECTION 7 — THE SHIFT (no feedback until the end) ============ */
var SIMN={skip:1,brief:2,bag:3,complaint:4,cable:5,stumble:6,photo:7};
function simScreen(id,time,heading,body,opts,key,extra){
  scr(id,7,function(h){
    setClock(time);
    var pre=extra?extra():'';
    h.innerHTML='<div class="kicker">Question '+SIMN[key]+' of 7 · '+time+'</div><h2>'+heading+'</h2>'+pre+'<p class="lead">'+body+'</p><p class="q">What do you do?</p>';
    mcq(h,{nav:true,opts:opts.map(function(o){return {t:o.t};})});
    h.querySelectorAll('.opt').forEach(function(b,i){
      b.addEventListener('click',function(){st.sim[key]=i;st.simQ[key]=opts[i].q;},true);
    });
  });
}
scr('7.0',7,function(h){
  setClock('14:20');
  h.innerHTML='<div class="kicker">Final quiz</div><h2>One shift. Seven questions.</h2>'+
  '<div class="bq"><p>This is the scored final. No hints, no feedback until the end.</p><p>What you decide early changes what happens later — just like a real shift.</p><p>Pass mark: <b>80/100</b>.</p></div>';
  vidSlot(h,'shift-start',{loop:true,before:'.bq'});
  actions(h).appendChild(contBtn('14:20 →',next));
});
scr('7.1',7,function(h){
  setClock('14:20');
  h.innerHTML='<div class="kicker">Question 1 of 7 · 14:20</div><h2>You\'re running late</h2>'+
  '<p class="lead">You slept through your alarm. You have 20 minutes. You can do two of these three things.</p><p class="q">You have time for two. Which two?</p>';
  var CH=[{t:'Charge your radio',k:'charge'},{t:'Fill your water bottle',k:'water'},{t:'Iron your uniform shirt',k:'shirt'}];
  var wrap=el('<div class="opts"></div>'),sel={};
  CH.forEach(function(c){
    var b=el('<button class="opt" type="button"><span class="dot"></span><span class="body">'+c.t+'</span></button>');
    b.addEventListener('click',function(){
      var on=b.classList.toggle('g-pick');
      if(on)sel[c.k]=1;else delete sel[c.k];
      btn.disabled=Object.keys(sel).length!==2;
    });
    wrap.appendChild(b);
  });
  h.appendChild(wrap);
  var btn=contBtn('Leave the house →',function(){
    var picked=Object.keys(sel);
    st.sim.skip=['charge','water','shirt'].filter(function(k){return picked.indexOf(k)<0;})[0];
    st.simQ.skip=st.sim.skip==='shirt'?2:0;
    next();
  });btn.disabled=true;
  actions(h).appendChild(btn);
});
simScreen('7.2','15:05','Briefing',
  'Your supervisor says you\'re on "Gate 7 north side." You\'ve never worked Gate 7. You don\'t know which side is north.',
  [{t:'Ask now, in the briefing',q:2},{t:'Ask a colleague afterwards',q:1},{t:'Work it out when you get there',q:0},{t:'Nod and hope it becomes obvious',q:0}],'brief');
simScreen('7.3','16:40','Gates open',
  'Two things at once. A queue is building. And there\'s a bag on its own by the barrier. Both need reporting.',
  [{t:'Radio both — the bag first',q:2},{t:'Radio the queue, come back to the bag',q:1},{t:'Go over and check the bag yourself',q:0},{t:'Wait — someone will probably collect the bag',q:0}],'bag',
  function(){return st.sim.brief===2?'<div class="consq" style="border-left-color:var(--amber)"><p><b>You start at the wrong post.</b> Two minutes lost finding Gate 7 north side. The queue was building the whole time.</p></div>':'';});
simScreen('7.4','17:15','A complaint, and a queue',
  'A man is complaining about his seat. Behind him, your queue is growing.',
  [{t:'Deal with him fully — the queue waits',q:0},{t:'Acknowledge him, radio the queue, then help him',q:2},{t:'"One moment" — and radio the queue first',q:1},{t:'Send him to the help point',q:1}],'complaint');
simScreen('7.5','18:00','Break due',
  'Your break started five minutes ago. You\'ve just noticed a cable across a walkway.',
  [{t:'Report it, then take your break',q:2},{t:'Move it yourself, then break',q:0},{t:'Tell the steward relieving you',q:1},{t:'Take your break — report it after',q:0}],'cable',
  function(){var s='';
    if(st.sim.skip==='water'){g('app').classList.add('fatigued');s+='<div class="consq" style="border-left-color:var(--amber)"><p><b>You\'re tired.</b> You skipped the water at 14:20. Four hours in, everything takes slightly longer to notice.</p></div>';}
    if(st.sim.skip==='charge'){s+='<div class="consq" style="border-left-color:var(--red)"><p><b>Your radio is dead.</b> It went at 17:50. Whatever you decide, reporting means finding another radio first.</p></div>';}
    return s;});
simScreen('7.6','18:30','Something happened',
  'A spectator stumbled on the steps. Got up. Walked off. No injury visible.',
  [{t:'Report it now, in writing',q:2},{t:'Mention it to your supervisor verbally',q:1},{t:'Don\'t report it — nothing happened',q:0},{t:'Report it at the end of shift',q:1}],'stumble',
  function(){return st.sim.complaint===0?'<div class="consq" style="border-left-color:var(--amber)"><p><b>A supervisor is standing nearby, watching.</b> Word travelled about the queue that built while you were tied up at 17:15.</p></div>':'';});
simScreen('7.8','22:10','End of shift',
  'The trophy lift is happening. Another steward offers to send you a photo they took from the tunnel.',
  [{t:'Say no, and say why',q:2},{t:'Say no thanks',q:1},{t:'Take it — you won\'t post it',q:0},{t:'Take it and post it after the event',q:0}],'photo');
/* ============ SECTION 8 — DEBRIEF ============ */
var DECN={skip:'the kit call at 14:20',brief:'the briefing question',bag:'the bag and the queue',complaint:'the complaint with a queue behind it',cable:'the cable at break time',stumble:'the stumble nobody saw',photo:'the tunnel photo'};
var STRONGLINE={
  skip:'You skipped the shirt and kept the radio and water. Nobody at hour four cares about creases.',
  brief:'You asked in the briefing. Thirty seconds of awkward beat a shift at the wrong post.',
  bag:'You put the bag on the radio first. Life-safety before flow — that\'s the right order.',
  complaint:'You acknowledged the spectator before dealing with the queue. That\'s the hard version, under pressure.',
  cable:'You reported the cable before your break. Ten seconds, then the break was yours.',
  stumble:'You reported the stumble straight away. If a claim ever lands, your report is the fact.',
  photo:'You said no to the photo, and said why. That might have saved them too.'};
var HESLINE={
  skip:'You kept two of the right three. Think about what hour four needs, not what the mirror needs.',
  brief:'You got the post sorted — after the room emptied. Asking in the moment is faster and everyone hears the answer.',
  bag:'Both were right. The bag was more right — life-safety goes first.',
  complaint:'You kept things moving, but he never felt heard. Two seconds of acknowledgement would have done it.',
  cable:'You handed the cable on rather than owning it. Better than silence — but a report in your name was ten seconds away.',
  stumble:'It got mentioned, not recorded. Verbal reports evaporate; written ones protect people.',
  photo:'You said no — right call. Saying why is what stops the photo existing at all.'};
var COSTLINE={
  skip_water:'You skipped water at 14:20. By 18:00 you were slower. That link is real, and it\'s the most common reason experienced stewards miss things.',
  skip_charge:'You skipped the radio charge. It died at 17:50 — right before the two decisions where you needed it most.',
  brief:'You worked it out on your own — from the wrong post, with a queue already building.',
  bag:'You approached the bag yourself. If it had been what bags sometimes are, you\'d have been the closest person to it.',
  complaint:'The queue grew while the complaint had all of your attention. By 18:30 a supervisor was watching your gate.',
  cable:'The cable stayed down over your break. Dark walkway, thirty minutes, live crowd.',
  stumble:'Nothing was recorded. If that spectator\'s knee swells tomorrow, there is no version of events with your name on it.',
  photo:'The photo is on your phone now. Six weeks from now, that\'s all that will matter.'};
scr('8.1',8,function(h){
  g('app').classList.remove('fatigued');
  var q=st.simQ;
  var strong=[],hes=[],cost=[];
  Object.keys(DECN).forEach(function(k){
    if(q[k]===2)strong.push(STRONGLINE[k]);
    else if(q[k]===1)hes.push(HESLINE[k]);
    else if(q[k]===0){
      if(k==='skip')cost.push(st.sim.skip==='water'?COSTLINE.skip_water:COSTLINE.skip_charge);
      else cost.push(COSTLINE[k]);
    }
  });
  var one;
  if(q.skip!==2)one='Pack for hour four, not for the mirror: radio charged, water filled, every shift.';
  else if(q.bag!==2)one='When two things happen at once, ask which one can hurt someone. That one goes on the radio first.';
  else if(q.stumble!==2||q.cable!==2)one='Report in the moment, not later. "Later" is where reports go to disappear.';
  else if(q.complaint!==2)one='Acknowledge first, even mid-crisis. Two seconds buys the whole conversation.';
  else if(q.photo!==2)one='Say no out loud, with the reason. It protects the person offering too.';
  else one='Keep doing exactly this — and watch for the shift where it gets hard to.';
  // ---- score the eight shift decisions (2 = best, 1 = acceptable, 0 = poor) ----
  var MAXPTS=14, PASSPCT=80;
  var pts=0;
  Object.keys(DECN).forEach(function(k){pts += (q[k]===2?2:q[k]===1?1:0);});
  var pct=Math.round(pts/MAXPTS*100);
  var passed=pct>=PASSPCT;
  st.finalPct=pct;st.finalPass=passed;
  /* ---- SCORM 1.2: report score, pass/fail and per-question results to the LMS ---- */
  if(window.SCORM&&SCORM.present){
    SCORM.set('cmi.core.score.min','0');
    SCORM.set('cmi.core.score.max','100');
    SCORM.set('cmi.core.score.raw',String(pct));
    SCORM.set('cmi.core.lesson_status',passed?'passed':'failed');
    Object.keys(DECN).forEach(function(k,i){
      SCORM.set('cmi.interactions.'+i+'.id','Q'+(SIMN[k]||i+1)+'_'+k);
      SCORM.set('cmi.interactions.'+i+'.type','choice');
      SCORM.set('cmi.interactions.'+i+'.student_response',String(st.sim[k]));
      SCORM.set('cmi.interactions.'+i+'.result',q[k]===2?'correct':'wrong');
      SCORM.set('cmi.interactions.'+i+'.weighting','2');
    });
    SCORM.commit();
  }

  h.innerHTML='<div class="kicker">Full time · 22:30</div><h2>How that went</h2>';
  var sc=el('<div class="scorecard '+(passed?'pass':'fail')+'">'+
    '<div class="sn">'+pct+'<span>/100</span></div>'+
    '<div class="sl">Shift decision score</div>'+
    '<div class="sbar"><i style="width:'+pct+'%"></i><span class="mark"></span></div>'+
    '<div class="spass">pass mark 80</div>'+
    '<div class="verdict">'+(passed?'Pass':'Not yet')+'</div>'+
    '<div class="sm">'+(passed
      ? 'You made <b>'+pts+' of '+MAXPTS+'</b> available points across seven questions. That\'s the standard JAM expects on a live gate.'
      : 'You made <b>'+pts+' of '+MAXPTS+'</b> available points across seven questions. You need <b>80</b> to pass. Read the breakdown below, then run the shift again — most people clear it second time.')+
    '</div></div>');
  h.appendChild(sc);
  var wrap=el('<div style="width:100%"></div>');
  if(strong.length){var b1='<div class="mapblock mb-strong"><div class="mh">Where you were strong</div>';strong.slice(0,3).forEach(function(s){b1+='<p>'+s+'</p>';});wrap.appendChild(el(b1+'</div>'));}
  if(hes.length){var b2='<div class="mapblock mb-hes"><div class="mh">Where you hesitated</div>';hes.slice(0,3).forEach(function(s){b2+='<p>'+s+'</p>';});wrap.appendChild(el(b2+'</div>'));}
  if(cost.length){var b3='<div class="mapblock mb-cost"><div class="mh">Where it cost you</div>';cost.slice(0,3).forEach(function(s){b3+='<p>'+s+'</p>';});wrap.appendChild(el(b3+'</div>'));}
  wrap.appendChild(el('<div class="mapblock mb-one"><div class="mh">Your one thing</div><p>'+one+'</p></div>'));
  h.appendChild(wrap);
  var a=actions(h);
  if(!passed){
    a.appendChild(contBtn('↻ Run the shift again',function(){
      st.sim={};st.simQ={};g('app').classList.remove('fatigued');goTo('7.0');
    }));
    a.appendChild(contBtn('Continue anyway',next,'ghost'));
  }else{
    a.appendChild(contBtn('Finish',next));
  }
});

  h.innerHTML='<div class="cert closewrap" style="justify-content:flex-start;padding-top:10px">'+

boot();
