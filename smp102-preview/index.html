", "back": {"sid": "smp102-S129", "en": "Check your exits and routes are clear and ready to open.", "ar": "افحصوا أن مخارجكم وطرقكم خالية وجاهزة للفتح."}}, {"front": {"sid": "smp102-S130", "en": "3 Open exit gates only when told to", "ar": "3 لا تفتحوا البوابات إلا بأمر"}, "icon": "unlocked", "back": {"sid": "smp102-S131", "en": "The evacuation message is an instruction to open. Some venues give it with the stand-by.", "ar": "رسالة الإخلاء هي أمر بالفتح. تعطيها بعض الملاعب مع رسالة الاستعداد."}}, {"front": {"sid": "smp102-S132", "en": "4 Stop people coming in", "ar": "4 أوقفوا دخول الناس"}, "icon": "no entry", "back": {"sid": "smp102-S133", "en": "Stop people coming in, if told to.", "ar": "أوقفوا دخول الناس، إذا طُلب منكم ذلك."}}, {"front": {"sid": "smp102-S134", "en": "5 Stay calm", "ar": "5 اهدؤوا"}, "icon": "relieved face", "back": {"sid": "smp102-S135", "en": "Stay calm - say nothing to fans yet.", "ar": "اهدؤوا - ولا تقولوا شيئًا للمشجعين الآن."}}], "x_flag": {"text": "The evacuation message is an instruction to open. Some venues give it with the stand-by.", "note": "K2 (decision 156): one gate rule. LOC point 3 (when exit gates are opened) changed by Yasir's recap - LOC / SEC / Civil Defense to confirm. File: 'Open exit gates only when instructed - at some venues the instruction comes with the stand-by message'. Card back kept under 90 characters (C2)."}}, {"id": "2.5", "section": "2", "lo": [2], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-2.2 red box verbatim (danger) beside still S4", "xp": {"complete": 5}, "heading": {"sid": "smp102-S136", "en": "One exception", "ar": "استثناء واحد"}, "media": ["smp102-s4-smoke"], "lines": [{"sid": "smp102-S137", "en": "Danger right in front of you? Move people away from it now - then report.", "ar": "خطر أمامكم مباشرة؟ أبعدوا الناس عنه الآن - ثم أبلغوا."}], "x_lineIcons": [{"icon": "warning"}], "x_tone y, say nothing to fans and wait for instructions' shortened."}}, {"id": "2.7", "section": "2", "lo": [2], "type": "sectionClose", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-9.1 narration (section end) + Section 7 job aid column 1 (K2)", "xp": {"complete": 10}, "x_flag": {"text": "Open exit gates when told to - the evacuation message is an instruction", "note": "K2 (decision 156): one gate rule. LOC point 3 (when exit gates are opened) changed by Yasir's recap - LOC / SEC / Civil Defense to confirm. Job aid 'Open exit gates only on instruction' changed."}, "takeaway": {"sid": "smp102-S148", "en": "Stand-by means get ready. Evacuate means go.", "ar": "الاستعداد يعني: استعدوا. الإخلاء يعني: انطلقوا."}, "x_jobAid": {"title": {"sid": "smp102-S149", "en": "Stand-by = get ready", "ar": "الاستعداد = استعدوا"}, "steps": [{"sid": "smp102-S150", "en": "Go to your evacuation post", "ar": "اذهبوا إلى موقع الإخلاء"}, {"sid": "smp102-S151", "en": "Check exits and routes clear and ready", "ar": "افحصوا أن المخارج والطرق خالية وجاهزة"}, {"sid": "smp102-S152", "en": "Open exit gates when told to - the evacuation message is an instruction", "ar": "افتحوا بوابات الخروج عند الأمر - رسالة الإخلاء هي التعليمة"}, {"sid": "smp102-S153", "en": "Stop people coming in if told", "ar": "أوقفوا الدخول إذا طُلب منكم"}, {"sid": "smp102-S154", "en": "Say nothing to fans yet", "ar": "لا تقولوا شيئًا للمشجعين الآن"}, {"sid": "smp102-S155", "en": "Danger right in front of you? Move people away - then report", "ar": "خطر أمامكم مباشرة؟ أبعدوا الناس - ثم أبلغوا"}]}}, {"id": "3.1", "section": "3", "lo": [3], "type": "video", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.1 animation A4 (gate) as a video (decision 162); the narration with Yasir's locked-exit line (K1) as voice-over; heading = the on-screen title; watch-for ours (R2); learning point = the narration's 'words only, never physical'", "xp": {"complete": 5}, "media": ["smp102-v04-gate"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp102-S156", "en": "Opening an exit gate - on instruction", "ar": "فتح بوابة خروج - عند التعليمات"}, "afterText": {"sid": "smp102-S157", "en": "Watch where the marshal stands once the gate is open.", "ar": "شاهدوا أين يقف المنظِّم بعد فتح البوابة."}, "x_takeaway": {"sid": "smp102-S158", "en": "Words only, never physical.", "ar": "بالكلام فقط، وليس جسديًا أبدًا."}, "placeholder": {"id": "VID-EV31-A4", "owner": "ID", "note": {"sid": "smp102-S159", "en": "Video coming soon.", "ar": "الفيديو قريباً."}}, "x_illustration": true, "x_transcript": {"sid": "smp102-S160", "en": "What you see: A small marshal figure in a hi-vis vest looks through the gate at the outside path: it is clear. The gate swings fully open. The figure fixes it open with a hold-open device at the bottom. The marshal figure steps to the side of the opening, clear of the doorway. Fans walk out past him, away from the camera. A late fan outside walks towards the gate; the marshal raises an open hand and the fan stops and steps aside; nobody touches. Further along the wall, another gate stays shut. A marshal figure stands beside it, turned aside as if reporting. Fans walk past the shut gate to the next open one. Narrator: When you're told to open your exit gate: check the other side is clear and safe. Open it fully and secure it open, the way you were shown at your briefing. Stand to the side, where fans can see you - never in the doorway. Keep the gate clear, and politely tell anyone trying to come in that it's exit only - words only, never physical. If an exit is locked, blocked or won't open, report it at once - and send people to the nearest other exit.", "ar": "ما ترونه: تنظر شخصية منظِّم صغيرة بسترة عاكسة من خلال البوابة إلى الممر في الخارج: إنه خالٍ. تنفتح البوابة بالكامل. تثبّت الشخصية البوابة مفتوحة بأداة تثبيت في الأسفل. تتحرك شخصية المنظِّم إلى جانب الفتحة، بعيدًا عن المدخل. يمشي المشجعون إلى الخارج بجانبه، بعيدًا عن الكاميرا. يمشي مشجع متأخر في الخارج نحو البوابة؛ يرفع المنظِّم يدًا مفتوحة فيتوقف المشجع ويتنحى جانبًا؛ لا أحد يلمس أحدًا. وعلى امتداد الجدار، تبقى بوابة أخرى مغلقة. تقف بجانبها شخصية منظِّم، مائلة إلى الجانب كأنها تبلّغ. يمر المشجعون بجانب البوابة المغلقة إلى البوابة المفتوحة التالية. الراوي: عندما يُطلب منكم فتح بوابة الخروج: تأكدوا أن الجانب الآخر خالٍ وآمن. افتحوها بالكامل وثبّتوها مفتوحة، كما أُريتم في الإحاطة. قفوا إلى الجانب، حيث يراكم المشجعون - وليس في المدخل أبدًا. أبقوا البوابة خالية، وقولوا بأدب لكل من يحاول الدخول إنها للخروج فقط - بالكلام فقط، وليس جسديًا أبدًا. وإذا كان المخرج مقفلًا أو مسدودًا أو لا ينفتح، فأبلغوا فورًا - ووجّهوا الناس إلى أقرب مخرج آخر."}, "x_objective": {"sid": "smp102-S161", "en": "Open exit gates on instruction, keep them clear and stop entry; keep people moving and control the pace at stair heads; no lifts, no going back.", "ar": "افتحوا بوابات الخروج عند التعليمات، وأبقوها خالية، وأوقفوا الدخول؛ وأبقوا الناس يتحركون وتحكموا في الوتيرة عند رأس الدرج؛ لا مصاعد ولا عودة إلى الخلف."}, "x_flag": {"text": "If an exit is locked, blocked or won't open, report it at once - and send people to the nearest other exit.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. '... report it at once - and stay with it until it's sorted.' replaced."}, "x_previewNames": ["smp102-s3.1-main-c1-gate-check-open-fully", "smp102-s3.1-main-c2-gate-stand-aside-exit", "smp102-s3.1-main-c3-gate-locked-nearest-other"], "x_mediaMissing": false}, {"id": "3.2", "section": "3", "lo": [3], "type": "flashcards", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.1 the five steps verbatim, one card each (C2); Yasir's additions to steps 1, 3 and 5 (K1); '[venue method - hook, bolt or wedge as briefed]' → 'the venue's hold-open device, as briefed' (K1, R3, LOC 4); narration sentence 1 as the lead; task ours (C1)", "xp": {"complete": 5}, "bloom": "apply", "safetyCritical": false, "a11y": {"alternative": "One card at a time: the card is a button that shows its text; previous / next buttons move between the cards.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "heading": {"sid": "smp102-S162", "en": "Opening an exit gate", "ar": "فتح بوابة الخروج"}, "situation": {"sid": "smp102-S163", "en": "When you're told to open your exit gate:", "ar": "عندما يُطلب منكم فتح بوابة الخروج الخاصة بكم:"}, "task": {"sid": "smp102-S164", "en": "Tap each step to read it. Open all five to continue.", "ar": "اضغطوا على كل خطوة لقراءتها. افتحوا الخطوات الخمس للمتابعة."}, "x_mechanic": "flip", "x_minRead": 5, "cards": [{"icon": "eyes", "title": {"sid": "smp102-S165", "en": "1 Check the other side", "ar": "1 تحققوا من الجانب الآخر"}, "text": {"sid": "smp102-S166", "en": "Is it clear and safe? If not, don't open - report at once and wait for instructions.", "ar": "هل الطريق خالٍ وآمن؟ إن لم يكن، فلا تفتحوا، وأبلغوا فورًا وانتظروا التعليمات."}}, {"icon": "door", "title": {"sid": "smp102-S167", "en": "2 Open it fully", "ar": "2 افتحوها بالكامل"}, "text": {"sid": "smp102-S168", "en": "Open it fully.", "ar": "افتحوها بالكامل."}}, {"icon": "locked with key", "title": {"sid": "smp102-S169", "en": "3 Secure it open", "ar": "3 ثبّتوها مفتوحة"}, "text": {"sid": "smp102-S170", "en": "With the venue's hold-open device, as briefed.", "ar": "بجهاز تثبيت الفتح الخاص بالملعب، كما جاء في الإحاطة."}}, {"icon": "person standing", "title": {"sid": "smp102-S171", "en": "4 Stand to the side", "ar": "4 قفوا إلى الجانب"}, "text": {"sid": "smp102-S172", "en": "Where fans can see you - never in the doorway.", "ar": "حيث يراكم المشجعون، وليس في فتحة الباب أبدًا."}}, {"icon": "no entry", "title": {"sid": "smp102-S173", "en": "5 Keep it clear, stop anyone coming in", "ar": "5 أبقوا المسار خاليًا، وامنعوا أي أحد من الدخول"}, "text": {"sid": "smp102-S174", "en": "With words only; never block or push anyone. If they won't listen, radio your supervisor.", "ar": "بالكلام فقط؛ لا تعترضوا طريق أحد ولا تدفعوه أبدًا. إذا لم يستجيبوا، فأبلغوا مشرفكم عبر اللاسلكي."}}], "x_flag": [{"text": "Is it clear and safe? If not, don't open - report at once and wait for instructions.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. 'Don't open - report at once and wait for instructions' added."}, {"text": "With the venue's hold-open device, as briefed.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. 'wedge' dropped. LOC point 4: gate mechanism, keys and securing method to confirm."}, {"text": "With words only; never block or push anyone. If they won't listen, radio your supervisor.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. 'If they won't listen, radio your supervisor' added."}]}, {"id": "3.3", "section": "3", "lo": [3], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.1 red box in Yasir's version (K1) beside still S5 (danger)", "xp": {"complete": 5}, "heading": {"sid": "smp102-S175", "en": "Exit won't open?", "ar": "المخرج لا يُفتح؟"}, "media": ["smp102-s5-locked"], "lines": [{"sid": "smp102-S176", "en": "Exit locked, blocked or won't open? Report it at once and send people to the nearest other exit.", "ar": "مخرج مقفل أو مسدود أو لا يُفتح؟ أبلغوا فورًا ووجّهوا الناس إلى أقرب مخرج آخر."}], "x_lineIcons": [{"icon": "locked"}], "x_tone": "danger", "x_flag": {"text": "Exit locked, blocked or won't open? Report it at once and send people to the nearest other exit.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. '... - and stay with it.' replaced."}}, {"id": "3.4", "section": "3", "lo": [3], "type": "video", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.2 animation A4 (aerial stand emptying) as a video (decision 162); the narration with the K3 lift line as voice-over; heading = the on-screen title; watch-for ours (R2)", "xp": {"complete": 5}, "media": ["smp102-v05-moving"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp102-S177", "en": "Keep people moving - safely", "ar": "حافظوا على حركة الناس بأمان"}, "afterText": {"sid": "smp102-S178", "en": "Watch the flow at the top of the stairs.", "ar": "راقبوا التدفق عند رأس الدرج."}, "x_takeaway": {"sid": "smp102-S179", "en": "Pushing on stairs causes falls - and falls cause crushes.", "ar": "الدفع على الدرج يسبب السقوط، والسقوط يسبب التدافع."}, "placeholder": {"id": "VID-EV32-A4", "owner": "ID", "note": {"sid": "smp102-S180", "en": "Video coming soon.", "ar": "الفيديو قريباً."}}, "x_illustration": true, "x_transcript": {"sid": "smp102-S181", "en": "What you see: Fans stand and walk along their rows towards the vomitories. At the top of each stairway a small marshal figure with a raised arm lets people on in a steady stream. The stairs stay evenly filled, never packed. A closed lift in the concourse; fans walk past it to the stairs. One small figure turns to walk back up and is turned round by a raised open hand. Grey smoke rises at the left end of the concourse; the flow turns right, away from it. Narrator: Now keep people moving. Use a loud, clear voice and big arm signals. If you're at the top of a stairway, control the pace - pushing on stairs causes falls, and falls cause crushes. Don't send people sideways across the stand unless there's danger ahead. Nobody uses the lifts - unless you are told a lift is in use for evacuation. Nobody goes back - not for a bag, not for a phone. And always send people away from smoke or danger, never through it.", "ar": "ما ترونه: يقف المشجعون ويمشون على طول صفوفهم نحو ممرات المدرج. عند رأس كل درج، تقف شخصية منظِّم صغيرة رافعة ذراعها وتسمح للناس بالمرور بتدفق منتظم. تبقى الدرجات ممتلئة بالتساوي، وليست مزدحمة أبدًا. مصعد مغلق في الردهة؛ يمر المشجعون بجانبه إلى الدرج. شخصية صغيرة تستدير لتعود صعودًا فتردها يد مفتوحة مرفوعة. يتصاعد دخان رمادي عند الطرف الأيسر من الردهة؛ ويتجه التدفق إلى اليمين، بعيدًا عنه. الراوي: والآن أبقوا الناس يتحركون. استخدموا صوتًا عاليًا وواضحًا وإشارات ذراع كبيرة. إذا كنتم عند رأس الدرج، فتحكموا في السرعة؛ فالدفع على الدرج يسبب السقوط، والسقوط يسبب التدافع. لا ترسلوا الناس جانبيًا عبر المدرج إلا إذا كان هناك خطر أمامهم. لا أحد يستخدم المصاعد، إلا إذا قيل لكم إن مصعدًا يُستخدم للإخلاء. لا أحد يعود، لا من أجل حقيبة ولا من أجل هاتف. وأرسلوا الناس دائمًا بعيدًا عن الدخان أو الخطر، وليس عبره أبدًا."}, "x_flag": {"text": "Nobody uses the lifts - unless you are told a lift is in use for evacuation.", "note": "K3 (decision 156): Yasir's stair-head rule, everywhere. 'unless you are told a lift is in use for evacuation' added (matches EV-4.1)."}, "x_previewNames": ["smp102-s3.2-main-c1-moving-a-steady-flow", "smp102-s3.2-main-c2-moving-away-from-danger"], "x_mediaMissing": false}, {"id": "3.5", "section": "3", "lo": [3], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.2 vomitory definition verbatim beside still S6 (SR 12 Oct change)", "xp": {"complete": 5}, "heading": {"sid": "smp102-S182", "en": "Vomitory", "ar": "ممر الدخول إلى المدرّجات (Vomitory)"}, "media": ["smp102-s6-vomitory"], "lines": [{"sid": "smp102-S183", "en": "Vomitory = the stairway or tunnel between the seats and the concourse.", "ar": "ممر المدرج = الدرج أو النفق بين المقاعد والردهة."}], "x_lineIcons": [{"icon": "stadium"}]}, {"id": "3.6", "section": "3", "lo": [3], "type": "iconStrip", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.2 six bullets verbatim as tap boxes; stair-head and lift lines in Yasir's version (K3); box labels ours (R2); task ours (C1)", "xp": {"complete": 5}, "bloom": "apply", "safetyCritical": false, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "heading": {"sid": "smp102-S184", "en": "Keep people moving - safely", "ar": "حافظوا على حركة الناس بأمان"}, "task": {"sid": "smp102-S185", "en": "Tap each box. Open all six to continue.", "ar": "اضغطوا كل مربع. افتحوا المربعات الستة للمتابعة."}, "items": [{"icon": "megaphone", "label": {"sid": "smp102-S186", "en": "Voice", "ar": "الصوت"}, "line": {"sid": "smp102-S187", "en": "Loud, clear voice + big arm signals: 'This way - keep walking - thank you'", "ar": "صوت عالٍ وواضح مع إشارات ذراع كبيرة: «من هنا، واصلوا المشي، شكرًا لكم»"}}, {"icon": "up arrow", "label": {"sid": "smp102-S188", "en": "Stair heads: stand at the top", "ar": "رؤوس الدرج: قفوا في الأعلى"}, "line": {"sid": "smp102-S189", "en": "Slow the people at the top so the stairs don't overfill. Keep a steady flow.", "ar": "أبطئوا الناس في الأعلى حتى لا يمتلئ الدرج أكثر من اللازم. حافظوا على تدفق منتظم."}}, {"icon": "left right arrow", "label": {"sid": "smp102-S190", "en": "Sideways", "ar": "جانبيًا"}, "line": {"sid": "smp102-S191", "en": "Don't send people sideways across the stand unless there's danger ahead", "ar": "لا ترسلوا الناس جانبيًا عبر المدرج إلا إذا كان هناك خطر أمامهم"}}, {"icon": "elevator", "label": {"sid": "smp102-S192", "en": "No lifts", "ar": "لا مصاعد"}, "line": {"sid": "smp102-S193", "en": "They stop when the alarm sounds - unless you are told a lift is in use for evacuation", "ar": "تتوقف عند سماع الإنذار، إلا إذا قيل لكم إن مصعدًا يُستخدم للإخلاء"}}, {"icon": "back arrow", "label": {"sid": "smp102-S194", "en": "Going back", "ar": "العودة"}, "line": {"sid": "smp102-S195", "en": "No going back - not for a bag, not for a phone", "ar": "لا عودة، لا من أجل حقيبة ولا من أجل هاتف"}}, {"icon": "warning", "label": {"sid": "smp102-S196", "en": "Danger", "ar": "الخطر"}, "line": {"sid": "smp102-S197", "en": "Away from smoke or danger - never through it", "ar": "بعيدًا عن الدخان أو الخطر، وليس عبره أبدًا"}}], "x_flag": [{"text": "Slow the people at the top so the stairs don't overfill. Keep a steady flow.", "note": "K3 (decision 156): Yasir's stair-head rule, everywhere. 'Stair heads: stand at the top and control the pace - stop pushing, let the stairs clear' replaced; '; don't stop it' left out to keep the box under 90 characters (C2) - the steady flow says it."}, {"text": "They stop when the alarm sounds - unless you are told a lift is in use for evacuation", "note": "K3 (decision 156): Yasir's stair-head rule, everywhere."}]}, {"id": "3.7", "section": "3", "lo": [3], "type": "sectionClose", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-3.2 narration (section end) + Section 7 job aid column 2 lines 1-4 (K3)", "xp": {"complete": 10}, "x_flag": {"text": "Keep a steady flow at the stair heads", "note": "K3 (decision 156): Yasir's stair-head rule, everywhere. Job aid 'Control the pace at stair heads' changed."}, "takeaway": {"sid": "smp102-S198", "en": "And always send people away from smoke or danger, never through it.", "ar": "وأرسلوا الناس دائمًا بعيدًا عن الدخان أو الخطر، وليس عبره أبدًا."}, "x_jobAid": {"title": {"sid": "smp102-S199", "en": "Evacuate = go (1)", "ar": "الإخلاء = اذهبوا (1)"}, "steps": [{"sid": "smp102-S200", "en": "Gate: open fully - secure - stand aside - no entry", "ar": "البوابة: افتحوها بالكامل - ثبّتوها - قفوا جانبًا - لا دخول"}, {"sid": "smp102-S201", "en": "Loud voice, big arm signals", "ar": "صوت عالٍ، إشارات ذراع كبيرة"}, {"sid": "smp102-S202", "en": "Keep a steady flow at the stair heads", "ar": "حافظوا على تدفق منتظم عند رؤوس الدرج"}, {"sid": "smp102-S203", "en": "No lifts. No going back. Away from danger", "ar": "لا مصاعد. لا عودة. بعيدًا عن الخطر"}]}}, {"id": "4.1", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-4.1 on-screen list verbatim + Yasir's 'injured fans: call for medical help' (K1); presenter piece cut (decision 162)", "xp": {"complete": 5}, "heading": {"sid": "smp102-S204", "en": "Fans who need help", "ar": "من يحتاجون إلى مساعدة"}, "media": ["smp102-s7-help"], "x_objective": {"sid": "smp102-S205", "en": "Assist disabled and vulnerable fans; sweep toilets and prayer rooms if safe; follow the last fan out; report at the assembly point; follow invacuation instructions if given.", "ar": "ساعدوا المشجعين ذوي الإعاقة والمشجعين الأضعف؛ مشّطوا دورات المياه والمصليات إذا كان ذلك آمنًا؛ اتبعوا آخر مشجع إلى الخارج؛ أبلغوا عند نقطة التجمع؛ واتبعوا تعليمات الإيواء الداخلي إذا صدرت."}, "lines": [{"sid": "smp102-S206", "en": "Fans who need help - wheelchair users, people who can't use stairs, blind or deaf fans, older fans, families with small children, anyone injured.", "ar": "المشجعون الذين يحتاجون إلى مساعدة: مستخدمو الكراسي المتحركة، ومن لا يستطيعون استخدام الدرج، والمشجعون المكفوفون أو الصم، وكبار السن، والعائلات مع أطفال صغار، وكل مصاب."}, {"sid": "smp102-S207", "en": "Injured fans: call for medical help.", "ar": "المشجعون المصابون: اطلبوا المساعدة الطبية."}], "x_lineIcons": [{"icon": "person in manual wheelchair"}, {"icon": "hospital"}], "x_flag": {"text": "Injured fans: call for medical help.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. Added (Yasir asked for it in the VO; on screen, SA-3)."}}, {"id": "4.2", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-4.1 bullets 1-3 verbatim", "xp": {"complete": 5}, "heading": {"sid": "smp102-S208", "en": "Ask, stay, radio", "ar": "اسألوا ابقوا أبلغوا"}, "lines": [{"sid": "smp102-S209", "en": "Ask first: 'How can I help you?'", "ar": "اسألوا أولًا: «كيف يمكنني مساعدتك؟»"}, {"sid": "smp102-S210", "en": "Stay with them, or hand over to another marshal", "ar": "ابقوا معهم، أو سلّموهم إلى منظِّم آخر"}, {"sid": "smp102-S211", "en": "Radio their exact location", "ar": "أبلغوا عن موقعهم بالتحديد"}], "x_lineIcons": [{"icon": "speech balloon"}, {"icon": "handshake"}, {"icon": "radio"}]}, {"id": "4.3", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-4.1 bullets 4-5 verbatim + the callout; '[refuge point / assisted evacuation route - venue]' → 'the refuge point or assisted evacuation route' (R3, LOC 5)", "xp": {"complete": 5}, "heading": {"sid": "smp102-S212", "en": "Get them out safely", "ar": "أخرجوهم بأمان"}, "lines": [{"sid": "smp102-S213", "en": "Take them to the refuge point or assisted evacuation route, as briefed", "ar": "خذوهم إلى نقطة الالتجاء أو مسار الإخلاء المساعَد، كما جاء في الإحاطة"}, {"sid": "smp102-S214", "en": "Deaf fans may not hear the PA - show them, point, use gestures", "ar": "قد لا يسمع الصم نظام الإذاعة الداخلية: أروهم وأشيروا واستخدموا الإيماءات"}], "x_lineIcons": [{"icon": "compass"}, {"icon": "ear"}], "callout": {"sid": "smp102-S215", "en": "No lifts - unless Civil Defence say so.", "ar": "لا مصاعد، إلا إذا قال الدفاع المدني ذلك."}, "x_flag": {"text": "Take them to the refuge point or assisted evacuation route, as briefed", "note": "LOC point 5: refuge points, evacuation chairs, evacuation lifts and assisted evacuation to confirm (Venue / Civil Defense / LOC Accessibility)."}}, {"id": "4.4", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA p102-S240", "en": "Follow the last fan out - report at the assembly point", "ar": "اتبعوا آخر مشجع إلى الخارج - أبلغوا عند نقطة التجمع"}]}}, {"id": "5.1", "section": "5", "lo": [2, 3], "type": "video", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-5.1 V1a as a video (decision 162); the standard reply (K1); the radio lines as captions (SA-2, no radio shown); narration as voice-over; question ours (R2)", "xp": {"complete": 5, "firstTimeCorrect": 10}, "media": ["smp102-v06-faisal-gate"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp102-S241", "en": "Scene 1 - Stand-by", "ar": "المشهد 1 - الاستعداد"}, "afterText": {"sid": "smp102-S242", "en": "Watch what Faisal does before and after the instruction.", "ar": "راقبوا ما يفعله فيصل قبل التعليمات وبعدها."}, "x_takeaway": {"sid": "smp102-S243", "en": "He opens it fully, secures it, stands to the side - and politely stops a fan coming in.", "ar": "يفتحها بالكامل، ويثبّتها، ويقف جانبًا، ويمنع بأدب مشجعًا من الدخول."}, "placeholder": {"id": "VID-EV51-V1A", "owner": "ID", "note": {"sid": "smp102-S244", "en": "Video coming soon.", "ar": "الفيديو قريباً."}}, "x_objective": {"sid": "smp102-S245", "en": "Watch the stand-by, the gates, the stairs and the sweep done well.", "ar": "راقبوا الاستعداد والبوابات والدرج والتمشيط وهي تُنفَّذ بشكل جيد."}, "x_question": {"statement": {"sid": "smp102-S246", "en": "Faisal opens his gate as soon as he hears the stand-by.", "ar": "يفتح فيصل بوابته بمجرد أن يسمع الاستعداد."}, "answer": false, "feedbackTrue": {"sid": "smp102-S247", "en": "Not this one. He checks the gate and waits. He opens it when the instruction comes.", "ar": "ليست هذه. يتحقق من البوابة وينتظر. يفتحها عندما تصل التعليمات."}, "feedbackFalse": {"sid": "smp102-S248", "en": "Right. He checks the gate and waits. He opens it when the instruction comes.", "ar": "صحيح. يتحقق من البوابة وينتظر. يفتحها عندما تصل التعليمات."}}, "x_transcript": {"sid": "smp102-S249", "en": "What you see: Faisal at exit gate C3. The stand-by code word comes in (a short tone). He walks to the gate, checks the outside path is clear and checks the gate opens, then stands ready. A fan asks him something; he smiles and answers. Then he opens the gate fully, secures it, stands to the side and stops a late fan coming in, with an open hand and words. Radio: (the stand-by code word) Fan: What's happening? Faisal: Just a routine check. If we need you to move, we'll tell you. Radio: All marshals at C gates, open exit gates now. Faisal: Sorry, this gate is exit only now. Narrator: Scene one: the stand-by message. Faisal goes straight to his gate, checks it, and waits - calm, and saying nothing to fans. Then the instruction comes to open exit gates. He opens it fully, secures it, stands to the side - and politely stops a fan coming in.", "ar": "ما ترونه: فيصل عند بوابة الخروج C3. تصل الكلمة الرمزية للاستعداد (نغمة قصيرة). يمشي إلى البوابة، ويتحقق من أن المسار الخارجي خالٍ وأن البوابة تُفتح، ثم يقف مستعدًا. يسأله مشجع شيئًا؛ فيبتسم ويجيب. ثم يفتح البوابة بالكامل، ويثبّتها، ويقف جانبًا، ويمنع مشجعًا متأخرًا من الدخول بيد مفتوحة وبالكلام. اللاسلكي: (الكلمة الرمزية للاستعداد) مشجع: ماذا يحدث؟ فيصل: مجرد فحص روتيني. إذا احتجنا إلى تحرككم، فسنخبركم. اللاسلكي: إلى جميع المنظمين عند بوابات C، افتحوا بوابات الخروج الآن. فيصل: عذرًا، هذه البوابة للخروج فقط الآن. الراوي: المشهد الأول: رسالة الاستعداد. يذهب فيصل مباشرة إلى بوابته، ويتحقق منها، وينتظر، هادئًا ولا يقول شيئًا للمشجعين. ثم تصل التعليمات بفتح بوابات الخروج. يفتحها بالكامل، ويثبّتها، ويقف جانبًا، ويمنع بأدب مشجعًا من الدخول."}, "x_flag": [{"text": "Just a routine check. If we need you to move, we'll tell you.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. One standard reply to fans (EV-5.1, Section 5.1 #6, Q5, DP2)."}, {"text": "Radio: All marshals at C gates, open exit gates now.", "note": "Placeholder for the venue procedur : {"sid": "smp102-S258", "en": "Not yet. Watch the fan near Majed.", "ar": "ليس بعد. راقبوا المشجع القريب من ماجد."}, "x_takeaway": {"sid": "smp102-S259", "en": "Majed lets a fan go back for his phone.", "ar": "يسمح ماجد لمشجع بالعودة لأخذ هاتفه."}, "x_transcript": {"sid": "smp102-S260", "en": "What you see: the PA and the big screens come on. Noura stands at the top of vomitory C2, one arm raised, and slows the people at the top until the pushing stops, then keeps a steady flow. Lower down, a young fan turns and walks back up against the flow; Majed lets him go. PA: Evacuation announcement for the Block C sector. Noura: This way - walk - keep going - thank you. Narrator: Scene two: the evacuation message for Block C. Noura controls the stairs - a few seconds' pause stops pushing. Majed lets a fan go back for his phone.", "ar": "ما ترونه: تعمل الإذاعة الداخلية والشاشات الكبيرة. تقف نورة في أعلى ممر المدرج C2، وذراع واحدة مرفوعة، وتبطئ الناس في الأعلى حتى يتوقف الدفع، ثم تحافظ على تدفق منتظم. في الأسفل، يستدير مشجع شاب ويمشي صعودًا عكس التدفق؛ ويتركه ماجد يذهب. الإذاعة الداخلية: إعلان إخلاء لقطاع المدرج C. نورة: من هنا، امشوا، واصلوا، شكرًا لكم. الراوي: المشهد الثاني: رسالة الإخلاء لـ المدرج C. تتحكم نورة في الدرج؛ فتوقف قصير لثوانٍ يوقف الدفع. يسمح ماجد لمشجع بالعودة لأخذ هاتفه."}, "x_flag": {"text": "Noura: This way - walk - keep going - thank you.", "note": "K1 (decision 156): Yasir Almukhlifi's amendment (19 Oct), built everywhere. On screen 'holds back the next group for a few seconds while the stairs clear' → 'until the pushing stops, then keeps a steady flow' (K3). LOC point 2: the sector announcement wording."}}, {"id": "5.3", "section": "5", "lo": [3], "type": "mcq", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-5.2 pause question (K1, Yasir: 'makes this Do segment active'); options ours from the file's lines (G5)", "xp": {"complete": 5, "firstTimeCorrect": x_mediaMissing": false}, {"id": "5.5", "section": "5", "lo": [4], "type": "video", "src": "CLIENT AFC27 - SMP Lesson 10.2 - Evacuation Emergency Signals  Opening Exit Gates - 2026-10-12_v2 SR - SME YA - Ready for production.docx EV-5.3 V1c as a video (decision 162); Faisal's words and his call as captions (no radio shown); narration as voice-over; question ours (R2)", "xp": {"complete": 5, "firstTimeCorrect": 10}, "media": ["smp102-v09-assistance"], "a11y": {"transcriptFrom": "captions"}, "heading": {"sid": "smp102-S279", "en": "Scene 3 - Assistance", "ar": "المشهد 3 - المساعدة"}, "afterText": {"sid": "smp102-S280", "en": "Watch what Faisal asks first.", "ar": "راقبوا ما يسأله فيصل أولًا."}, "x_takeaway": {"sid": "smp102-S281", "en": "Ask, stay, radio.", "ar": "اسألوا، ابقوا، أبلغوا."}, "placeholder": {"id": "VID-EV53-V1C", "owner": "ID", "note": {"sid": "smp102-S282", "en": "Video coming soon.", "ar": "الفيديو قريباً."}}, "x_question": {"statement": {"sid": "smp102-S283", "en": "Faisal tells the fan to wait by the lift.", "ar": "يطلب فيصل من المشجع الانتظار عند المصعد."}, "answer": false, "feedbackTrue": {"sid": "smp102-S284", "en": "Not this one. He asks first, explains the lifts aren't used, and stays with him.", "ar": "ليست هذه. يسأل أولًا، ويشرح أن المصاعد لا تُستخدم، ويبقى معه."}, "feedbackFalse": {"sid": "smp102-S285", "en": "Right. He asks first, explains the lifts aren't used, and stays with him.", "ar": "صحيح. يسأل أولًا، ويشرح أن المصاعد لا تُستخدم، ويبقى معه."}}, "x_transcript": {"sid": "smp102-S286", "en": "What you see: an older fan in a wheelchair and his daughter wait by a lift on the upper concourse. Faisal kneels to eye level and speaks to the fan, then turns aside to report to his supervisor. Faisal: How can I help you? The lifts aren't used now - I'll stay with you. Faisal: Sierra 2, Marshal 22. Fan in a wheelchair with one companion, Block C upper concourse by lift 3. Taking them to the refuge point. Over. Narrator: Scene three. A fan in a wheel function seededShuffle(arr,seed){var a=arr.slice(),s=seed>>>0;for(var i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;var j=s%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Draw the quiz for one attempt (indexes into pool):
   every objective at least once (perObjective → that many from every objective), then fill up to count from the rest;
   variantGroup → at most one item of a group per attempt; randomise false → keep the pool's order. */
function quizDraw(pool,count,attempt,s,seen){
  var seed=attempt*7919+pool.length*31,used={},picked=[];
  var idx=s.randomise===false?pool.map(function(_,i){return i;}):seededShuffle(pool.map(function(_,i){return i;}),seed);
  /* E2 (2026-10-25): x_formFirst → attempt 1 is the items marked x_form (the client's own form); a later attempt takes items not shown before first */
  if(s.x_formFirst&&attempt===1){var fa=idx.filter(function(i){return pool[i].x_form;});if(fa.length)return s.randomise===false?fa.sort(function(a,b){return a-b;}):fa;}
  if(seen&&seen.length)idx=idx.filter(function(i){return seen.indexOf(i)<0;}).concat(idx.filter(function(i){return seen.indexOf(i)>=0;}));
  function take(i){var g=pool[i].variantGroup;if(picked.indexOf(i)>=0||(g&&used[g]))return false;picked.push(i);if(g)used[g]=1;return true;}
  function lo(q){var l=q.lo;l=Array.isArray(l)?l:[l];for(var k=0;k<l.length;k++)if(typeof l[k]==='number')return l[k];return null;}
  /* HARD RULE (user, 2026-10-14): every objective in the pool is drawn at least once whenever count allows; perObjective raises the minimum */
  var objs=[];idx.forEach(function(i){var n=lo(pool[i]);if(n!==null&&objs.indexOf(n)<0)objs.push(n);});
  objs.sort(function(a,b){return a-b;});
  var per=Math.max(s.perObjective||0,count>=objs.length?1:0);
  for(var r=1;r<=per;r++)objs.forEach(function(n){var got=0;idx.forEach(function(i){if(lo(pool[i])===n&&picked.indexOf(i)>=0)got++;});idx.forEach(function(i){if(got<r&&picked.length<count&&lo(pool[i])===n&&take(i))got++;});});
  idx.forEach(function(i){if(picked.length<count)take(i);});
  if(s.minSafety){   /* at least n safety-critical items: swap out only a non-safety item whose objective stays covered — never the last of an objective */
    var sc=function(i){return !!pool[i].safetyCritical;};
    while(picked.filter(sc).length<s.minSafety){var done=false;
      idx.forEach(function(add){if(done||!sc(add)||picked.indexOf(add)>=0)return;var g=pool[add].variantGroup;
        picked.forEach(function(i,k){if(done||sc(i))return;var n=lo(pool[i]);
          if(n!==null&&lo(pool[add])!==n&&picked.filter(function(x){return lo(pool[x])===n;}).length<2)return;
          if(g&&picked.some(function(x,kk){return kk!==k&&pool[x].variantGroup===g;}))return;
          picked[k]=add;done=true;});});
      if(!done)break;}
  }
  return s.randomise===false?picked.sort(function(a,b){return a-b;}):seededShuffle(picked,seed+1);
}

/* ============ SCHEMA 2.0 ADAPTER ============
   The script skill (elearning-module-designer) writes script.json "schema 2.0":
     strings {sid, en, ar?}, section as string, one answer model (score 0/1/2), media = asset ids,
     consequence {outcome, why, next}, multiselect options[], imageTiles tiles[]{media, score, feedback},
     branch goto, order feedbackCorrect/feedbackWrong, placeholder {id, owner, note}, module.quiz, module.passMark {percent, display}.
   This file normalises such a script in place so the runtime (built for the earlier shape) renders it unchanged.
   Runs before buildFromScript(). Idempotent. */

function sc2_rating(o){if(o.rating)return o.rating;if('score' in o)return o.score===2?'best':o.score===1?'ok':'wrong';return o.correct===true?'best':'wrong';}
function sc2_assetFile(id,kind){
  if(!id||/\.(mp4|jpg|jpeg|png|webp|gif|svg)$/i.test(id))return id;
  var a=(COURSE.assets||{})[id];
  if(a&&a.file)return a.file;
  return id+(((a&&a.kind)==='video'||kind==='video')?'.mp4':'.jpg');
}
function adaptSchema2(S){
  if(!S||S.__adapted)return S;S.__adapted=true;
  var M=S.module||{};
  if(M.passMark&&typeof M.passMark==='object'){COURSE.passDisplay=M.passMark.display;}
  (M.sections||[]).forEach(function(sec){if(typeof sec.n==='string'&&/^\d+$/.test(sec.n))sec.n=+sec.n;});
  var Q=M.quiz||null;
  function fixMedia(s){
    if(!s.media)return;
    var arr=Array.isArray(s.media)?s.media:[s.media];
    s.media=arr.map(function(m){return sc2_assetFile(m,s.type==='video'?'video':null);});
  }
  function fixScreen(s){
    if(typeof s.section==='string'&&/^\d+$/.test(s.section))s.section=+s.section;
    fixMedia(s);
    if(s.placeholder&&typeof s.placeholder==='object'){s.x_placeholder=true;if(!s.x_placeholderNote)s.x_placeholderNote=s.placeholder.note||s.placeholder.id;}
    (s.options||[]).forEach(function(o){if(!o.rating)o.rating=sc2_rating(o);if(o.goto&&!o.goTo)o.goTo=o.goto;});
    switch(s.type){
      case 'multiselect':
        if(!s.items&&s.options){s.items=s.options.map(function(o){return {text:o.text,correct:sc2_rating(o)!=='wrong',icon:o.icon,why:o.feedback};});}
        if(s.feedbackCorrect&&!s.x_feedbackCorrect)s.x_feedbackCorrect=s.feedbackCorrect;
        break;
      case 'imageTiles':
        (s.tiles||[]).forEach(function(t){if(t.correct===undefined&&'score' in t)t.correct=t.score===2;if(!t.why&&t.feedback)t.why=t.feedback;if(t.media)t.media=sc2_assetFile(t.media,null);});
        break;
      case 'consequence':
        if(!s.headline&&s.outcome)s.headline=s.outcome;
        if(!s.lines&&s.why)s.lines=[s.why];
        if(!s.tone)s.tone='mixed';
        if(s.next&&!s.x_next)s.x_next=s.next;
        break;
      case 'branch':
        if(!s.situation&&s.scene)s.situation=s.scene;
        break;
      case 'order':
        if(!s.okText&&s.feedbackCorrect)s.okText=s.feedbackCorrect;
        if(!s.noText&&s.feedbackWrong)s.noText=s.feedbackWrong;
        break;
      case 'moduleQuiz':
        if(Q){if(s.count===undefined)s.count=Q.itemsShown;if(s.passMark===undefined)s.passMark=Q.passPercent;if(s.retries===undefined)s.retries=Q.retries;if(s.feedbackAfterEach===undefined)s.feedbackAfterEach=Q.feedbackAfterEach!==false;
          if(s.perObjective===undefined)s.perObjective=Q.perObjective;if(s.shuffleOptions===undefined)s.shuffleOptions=Q.shuffleOptions;if(s.randomise===undefined)s.randomise=Q.randomise;if(s.minSafety===undefined)s.minSafety=Q.minSafety;if(s.safetyMustPass===undefined)s.safetyMustPass=Q.safetyMustPass;}
        if(!s.lines&&s.intro)s.lines=[s.intro];
        break;
      case 'flashcards':
        (s.cards||[]).forEach(function(c){if(c.media)c.media=sc2_assetFile(c.media,null);});
        break;
      case 'finalQuestion':
        if(typeof s.learnIn==='string'&&!s.learnInText)s.x_learnInCode=s.learnIn;
        break;
    }
  }
  (S.screens||[]).forEach(fixScreen);
  (S.quizPool||[]).forEach(function(q){fixScreen(q);if(!q.stem&&q.task)q.stem=q.task;});
  return S;

/* ---- 5. baseline decisions (E1, 2026-10-25): confidence after the first pick, baseline points, LMS record ----
   branch.x_confidence  {id:"B1", prompt:{…}, labels:[{…}×n]} → on the FIRST pick the choices stay, the question and n buttons show,

/* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============
   The same content (script.json) can be played with different mechanics, so a module never feels like
   "the same sort again". A screen picks one with `x_mechanic`; when it does not, the engine rotates through
   the mechanics that fit the content, seeded by the module id (different modules → different order).
   Every mechanic: buttons first (tap + keyboard; swipe/drag only as extras), mirrored in RTL, never timed,
   feedback says why, first-time-correct XP only when no mistake was made.

     sort        buckets (tap card → column) · deck (one card at a time, two big choices, swipe optional)
                 · belt (cards queue on a conveyor, send each to a bin) · stamps (a sheet: stamp every line, then check)
     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe; the default, no rotation) · stamp (stamp on a paper) · thumbs (👍 / 👎 mark) — all with the same ✓ True / ✕ False buttons
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)
     match       pairs (tap an item, then its partner) · memory (face-down cards, turn two at a time)  [new type]
     hotspot     findAll (several correct spots on a picture: "Found 2 of 4") · askEach (the spots asked one at a time) — explicit only                       */

var MECH={
  sort:['buckets','deck','belt','stamps'],
  mcq:['list','tiles','doors','chat'],
  order:['list','stack','path'],
  trueFalse:['card','stamp','thumbs'],
  match:['pairs','memory']
};
var _mechSeed=(function(){var h=0,id=String(COURSE.id||'');for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h;})();
var _mechCount={};
function mechFits(type,m,s){
  if(type==='mcq'){
    var o=s.options||[];
    if(m==='doors')return o.length>=2&&o.length<=3;
    if(m==='chat')return o.length&&o.every(function(x){return /^\s*['"‘“]/.test(T(x.text));});
    if(m==='tiles')return o.length>=3&&o.length<=4&&o.every(function(x){return T(x.text).length<=70;});
  }
  if(type==='sort'&&m==='stamps')return (s.cards||[]).length<=10;
  if(type==='match'&&m==='memory')return (s.pairs||[]).length<=6;
  return true;
}
/* the mechanic for this screen: explicit x_mechanic, else the module's rotation over the mechanics that fit */
function mechanicFor(type,s){
  var list=MECH[type]||[],want=s.x_mechanic||s.mechanic;
  if(want&&list.indexOf(want)>=0&&mechFits(type,want,s))return want;
  if(!s._mech){
    var k=_mechCount[type]=(_mechCount[type]||0)+1,fits=list.filter(function(m){return mechFits(type,m,s);});
    s._mech=fits.length?fits[(_mechSeed+k)%fits.length]:list[0];
  }
  return s._mech;
}
/* the rotation must not depend on the order screens are visited: number every screen once, in course order */
(function(){var _bfs=buildFromScript;buildFromScript=function(){
  (SCRIPT.screens||[]).forEach(function(s){if(MECH[s.type])mechanicFor(s.type,s);});
  _bfs();};})();

function seededOrder(n,seedStr){var a=[],s=0,i;for(i=0;i<n;i++)a.push(i);for(i=0;i<seedStr.length;i++)s=(s*31+seedStr.charCodeAt(i))>>>0;
  for(i=n-1;i>0;i--){s=(s*1664525+1013904223)>>>0;var j=s%(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mechDone(s,h,first){awardXp(s.id,s.xp&&s.xp.complete);if(first)awardXp(s.id+':ftc',s.xp&&s.xp.firstTimeCorrect);}
function mechTag(h,m){h.setAttribute('data-mechanic',m);}

/* ---------------------------------------------------------------- SORT ---------------------------------- */

/* ---------------------------------------------------------------- HOTSPOT: ask each (E1, 2026-10-19) ------ */
/* One picture, the right targets asked one at a time ('Where is the vomitory?' = target.x_ask, else its name).
   A wrong tap shows the target's x_hint; a second wrong tap marks the place and asks the learner to tap it.
   A found target gets its name as a label on the picture and shows its `action` line. XP: s.xp.perTarget for each
   target right first time; mechDone at the end (firstTimeCorrect only for a run with no wrong tap).
   Buttons under the picture (the target names) are the keyboard / screen-reader alternative. */
/* E1 (2026-10-20) pages + choices:
   s.x_pages = [{media, alt, title, targets[], x_end, x_next}] — several pictures in turn (e.g. tickets), each with its own targets;
   after a page's last target its x_end line shows and 'Next' (x_next) opens the next page. Without x_pages: one page = s.media + s.targets.
   target.x_choices = [{text, best:true|false, feedback}] — once the place is found, the question x_choiceAsk (target, else screen)
   and the options; a wrong pick shows its feedback and stays open; the best ends the step (XP s.xp.perChoice if picked first time).
   A target with x_choices and no x (x_noSpot) is a choices-only step: nothing to tap on the picture.
   E1 (2026-10-21): a target may carry `media` (an image asset id): shown above its question (16:9, cover, at most 45vh; alt text
   from the asset; a missing file hides the picture). */
function hotspotAskEach(s,h){

    :[{img:media(s)[0],alt:T(s.heading)||'',title:'',tg:(s.targets||[]).filter(keep),end:'',nxt:''}];
  var total=pages.reduce(function(n,p){return n+p.tg.length;},0);

  var pi=0,k=0,step=0,miss=0,cmiss=0,allFirst=true,done_=false,inChoice=false,btns=[],li=[];
  var ptitle=el('<p class="askpage"></p>'),ask=el('<div class="askq" role="status" aria-live="polite"></div>'),cnt=el('<div class="findcount"></div>'),
      wrap=el('<div class="scene-wrap m-findall m-askeach"></div>'),list=el('<div class="findlist"></div>'),
      chHost=el('<div class="askchoices"></div>'),fbHost=el('<div class="mfb" role="status"></div>'),pgBar=el('<div class="askpagebar"></div>');
  h.appendChild(cnt);h.appendChild(ptitle);h.appendChild(ask);h.appendChild(wrap);h.appendChild(list);h.appendChild(chHost);h.appendChild(fbHost);h.appendChild(pgBar);
  var spot=function(t){return t.x!==undefined&&!t.x_noSpot;};
  function page(){
    var P=pages[pi];k=0;miss=0;wrap.innerHTML='';list.innerHTML='';pgBar.innerHTML='';
    ptitle.textContent=P.title||'';ptitle.style.display=P.title?'':'none';
    wrap.appendChild(imgOrPh(P.img,P.alt));
    btns=P.tg.map(function(t,i){if(!spot(t))return null;
      var b=el('<button type="button" class="hz2" style="left:'+t.x+'%;top:'+t.y+'%;width:'+t.w+'%;height:'+t.h+'%" aria-label="'+T(t.name)+'"></button>');
      b.addEventListener('click',function(e){e.stopPropagation();tap(i);});wrap.appendChild(b);return b;});
    li=P.tg.map(function(t,i){if(!spot(t))return null;var b=el('<button type="button" class="chip2">'+T(t.name)+'</button>');
      b.addEventListener('click',function(){tap(i);});list.appendChild(b);return b;});
    show();
  }
  function show(){
    var t=pages[pi].tg[k];if(!t)return;

    var o=i>=0?P.tg[i]:null;
    if(o&&i!==k&&spot(o)&&spot(t)&&o.x===t.x&&o.y===t.y&&o.w===t.w&&o.h===t.h)i=k;   /* two questions on the same place (e.g. one grid square): a tap there answers the one asked */
    if(i===k){
      var b=btns[k];if(b){b.classList.remove('hz-show');b.classList.add('g-ok');b.disabled=true;b.appendChild(el('<span class="hzlabel">'+T(t.name)+'</span>'));}

      if(li[k])li[k].disabled=true;

      return;
    }

    if(miss===1){var w=fb('bad',U('notQuite'),T(t.x_hint)||T(s.feedbackWrong)||U('pickAgain'));fbHost.appendChild(w);svin(w);}
    else if(btns[k]){btns[k].classList.add('hz-show');var w2=fb('bad',U('notQuite'),U('hereItIs'));fbHost.appendChild(w2);svin(w2);}
  }

    if(t.media){var cf=sc2_assetFile(t.media),cw=imgOrPh(cf,assetAlt(cf)||T(t.name)||'','simg askpic');cw.classList.add('askpicwrap');   /* E1 (2026-10-21): the target's own picture above its question */
      var ci=cw.querySelector('img');if(ci)ci.addEventListener('error',function(){cw.remove();});chHost.appendChild(cw);}
    var q=T(t.x_choiceAsk)||T(s.x_choiceAsk);if(q)chHost.appendChild(el('<p class="askchq"><b>'+q+'</b></p>'));
    (t.x_choices||[]).forEach(function(c){
      var b=el('<button type="button" class="opt askopt">'+T(c.text)+'</button>');
      b.addEventListener('click',function(){if(b.disabled)return;fbHost.innerHTML='';
        if(c.best){chHost.querySelectorAll('button').forEach(function(x){x.disabled=true;});b.classList.add('g-ok');
          if(cmiss===0)awardXp(s.id+':c'+step,s.xp&&s.xp.perChoice);
          var g=fb('good',U('spotOn'),T(c.feedback)||'');fbHost.appendChild(g);svin(g);
          var a=el('<button type="button" class="btn primary askgo">'+U('next')+'</button>');a.addEventListener('click',function(){a.remove();advance();});
          pgBar.innerHTML='';pgBar.appendChild(a);}
        else{cmiss++;allFirst=false;b.disabled=true;b.classList.add('g-bad');

/* ---- allocate (engine E1, 2026-10-21): put people on roles. task; x_people[]{id, name, note, icon}; x_slots[]{id, group, label,

   (mouse and pen users may also drag a person onto a slot). A person fills one slot; people left over are spare. When every slot is
   filled, Check marks each slot suitable (tick) or not suitable (cross) with its own feedback line; crossed slots are emptied and their

COURSE.reviewSheet="https://script.google.com/macros/s/AKfycbx5ytdUHl8PepmGOV02BoWL37g7uhVUnxN7YMKvlL85H3Ashe8Sx98be2LI5gApxkDK/exec";

/* ---- Review comments (user, 2026-10-17): a comment box on every screen of a course under review ----

   release, never in the SCORM zip. Runs inside the engine's closure (S, cur, render, COURSE, LANG, T).
   Shared mode (COURSE.reviewSheet = the team's Google Sheet web app, system/docs/REVIEW-COMMENTS.md): every comment goes to the

(function(){

function here(){

}
function all(){var seen={},out=[];remote.concat(mine).forEach(function(c){if(!seen[c.id]){seen[c.id]=1;out.push(c);}});return out;}
function sent(c){return !SHARED||remote.some(function(r){return r.id===c.id;});}
var KINDS=['Wording','Translation','Picture or video','Activity','Not working','Other'];
var tab=el('<button type="button" class="rv-tab" id="rvTab" aria-haspopup="dialog" aria-controls="rvPanel"><span class="rv-ic" aria-hidden="true">💬</span><span id="rvLbl">Comment</span> <b class="rv-n" id="rvN"></b></button>');

  '<p class="rv-where" id="rvWhere"></p>'+

  '<div class="rv-foot"><p id="rvAll"></p><p class="rv-hint" id="rvHint"></p>'+
  '<div class="rv-row"><button type="button" class="rv-b" id="rvDown">Download all comments</button>'+(SHARED?'':'<button type="button" class="rv-b rv-quiet" id="rvClear">Delete all</button>')+'</div></div>'+
  '</div>');

/* keep the button clear of the course: above the sticky button bar on a phone; the tip sits just above the button */
function pinned(e){   /* inside a bar that stays put on screen (sticky / fixed), not content that scrolls past */
  for(var n=e;n&&n.id!=='stage';n=n.parentElement){var p=getComputedStyle(n).position;if(p==='sticky'||p==='fixed')return true;}return false;}
function place(){   /* keep clear of the course: rise above the fixed bars (sticky Next bar, side lesson list) and, by a little, above
                       buttons near the bottom; use the bottom corner that is freest (the reading-start corner on a tie) */
  var w=tab.offsetWidth,h=tab.offsetHeight,start=getComputedStyle(document.documentElement).direction==='rtl'?'right':'left';
  var els=[].slice.call(document.querySelectorAll('#stage button,#stage a,#stage input,#stage select,#stage [role=button]'))
    .map(function(e){var r=e.getBoundingClientRect();return {r:r,pin:pinned(e)};}).filter(function(x){return x.r.width&&x.r.height;});
  function fit(side){var left=side==='left'?16:innerWidth-16-w,bottom=16,hit=0;
    for(var pass=0;pass<8;pass++){var top=innerHeight-bottom-h,moved=false;
      els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top&&r.top<top+h){var nb=innerHeight-r.top+10;
        if(x.pin||nb<=160){bottom=Math.max(bottom,nb);moved=true;}}});
      if(!moved)break;}
    bottom=Math.min(bottom,innerHeight*0.5);var top2=innerHeight-bottom-h;   /* what still lies under it: a fixed bar counts more (it cannot be scrolled away) */
    els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top2&&r.top<top2+h)hit+=x.pin?10:1;});
    return {side:side,bottom:bottom,hit:hit};}

  tab.style.left=tip.style.left=best.side==='left'?'16px':'auto';tab.style.right=tip.style.right=best.side==='right'?'16px':'auto';
