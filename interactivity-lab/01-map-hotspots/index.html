<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/lab.css"><script src="../assets/lab.js"></script>
<style>
.map{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#eef0e8}
.map svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs circle.ring{fill:var(--purple);stroke:#fff;stroke-width:3;transition:fill .2s}
.hs text{fill:#fff;font:700 15px var(--font);pointer-events:none}
.hs.seen circle.ring{fill:var(--teal)}
.hs.on circle.ring{fill:#f5b400}
.hs.on text{fill:var(--ink)}
.hs .pulse{fill:none;stroke:var(--purple);stroke-width:2;opacity:.6;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s infinite}
.hs.seen .pulse{display:none}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.hs .pulse{animation:none}}
.detail{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--soft);background:var(--tint);border-radius:12px;padding:14px 16px;margin-top:14px;min-height:92px}
.detail b{font-family:var(--disp);font-size:21px;display:block}
.detail .n{display:inline-block;background:var(--purple);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;font-weight:700;font-size:14px;line-height:24px;margin-right:6px}
.progress{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-weight:700}
.listalt{margin-top:12px}
.listalt summary{cursor:pointer;color:var(--purple);font-weight:700}
.listalt ol{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0;list-style:none;margin:10px 0 0}
.listalt button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:15px}
.listalt button.seen{border-color:var(--teal)}
.listalt button.seen::after{content:" ✓";color:var(--teal);font-weight:700}
@media (max-width:560px){.listalt ol{grid-template-columns:1fr}}
</style></head><body>
<script>
var POSTS=[ /* SMP 2.1 RL screen 1.5 'Your posts' — client wording, verbatim */
 {t:"Wayfinding",x:150,y:322,i:"palm up hand",d:"Guide spectators along the correct pathways. Direct fans to gates, facilities, transport, and key locations."},
 {t:"Soft ticket check",x:238,y:318,i:"ticket",d:"Visually check tickets and redirect fans to the right entrance."},
 {t:"Ticket scanning",x:300,y:262,i:"admission tickets",d:"Scan fans' tickets. Inform the ticketing staff if there is a problem with your equipment or ticket."},
 {t:"Queuing",x:362,y:318,i:"busts in silhouette",d:"Manage queues in various areas and ensure that spectators move safely, efficiently, and in an orderly manner."},
 {t:"Megaphone announcer",x:440,y:330,i:"megaphone",d:"Make live verbal announcements. Inform and direct fans."},
 {t:"Traffic & crossings",x:300,y:400,i:"vertical traffic light",d:"Manage fans' movement at designated crossing points; ensure fans cross roads safely and guide them through busy areas; direct them to the correct stadium entrances"},
 {t:"Info Point",x:520,y:352,i:"information",d:"Provide general information and support. Manage lost property. Care for lost children and vulnerable people."},
 {t:"Accessibility",x:84,y:214,i:"person in manual wheelchair",d:"Support fans who need mobility assistance. Inform fans about the venue's accessibility services and routes."},
 {t:"Children registration",x:560,y:286,i:"wristband",d:"Fill in the parent/guardian details, consent forms, and provide the wristband."},
 {t:"Restricted Items Storage (RIS)",x:66,y:340,i:"locked",d:"Responsible for managing the temporary storage area for restricted items."},
 {t:"Elevator",x:488,y:118,i:"elevator",d:"Assist fans, including those with disabilities or mobility issues, to safely use elevators."},
 {t:"Response team",x:128,y:96,i:"person running",d:"Mobile and flexible group responsible for reacting quickly to operational needs across the venue and last mile."}];
var NEED=5;
var stage=shell({n:1,code:"Activity 33 · Tap-to-explore hotspots",where:"Lesson 1 · Your posts",kicker:"Explore.",
  title:"Your posts on match day",
  lead:"On match day you will be given a post. Here they are on a stadium plan.",
  task:"Tap the numbers on the plan to see what each post involves. Open at least 5 of the 12 to continue."});
var svg='<svg viewBox="0 0 600 430" role="group" aria-label="Stadium plan with 12 numbered posts">'+
 '<rect width="600" height="430" fill="#eef0e8"/>'+
 /* road and crossing */
 '<rect x="0" y="380" width="600" height="40" fill="#5b5f6b"/>'+
 [0,1,2,3,4,5].map(function(k){return '<rect x="'+(268+k*11)+'" y="383" width="7" height="34" fill="#fff"/>';}).join('')+
 '<text x="16" y="404" fill="#fff" font-size="13" font-family="Source Sans 3" font-weight="700">ROAD · METRO SHUTTLES</text>'+
 /* plaza */
 '<rect x="20" y="292" width="560" height="78" rx="10" fill="#e3ddcf"/>'+
 '<text x="30" y="365" fill="#7a705a" font-size="12" font-family="Source Sans 3" font-weight="700">FAN PLAZA</text>'+
 /* stadium */
 '<ellipse cx="300" cy="150" rx="262" ry="128" fill="#d9d4e8"/>'+
 '<ellipse cx="300" cy="150" rx="232" ry="108" fill="none" stroke="#a99bd0" stroke-width="2" stroke-dasharray="6 6"/>'+
 '<ellipse cx="300" cy="150" rx="200" ry="88" fill="#8f7cc4"/>'+
 '<rect x="200" y="100" width="200" height="100" rx="6" fill="#4caf6a" stroke="#fff" stroke-width="2"/>'+
 '<line x1="300" y1="100" x2="300" y2="200" stroke="#fff" stroke-width="2"/><circle cx="300" cy="150" r="16" fill="none" stroke="#fff" stroke-width="2"/>'+
 '<text x="300" y="58" text-anchor="middle" fill="#fff" font-size="12" font-family="Source Sans 3" font-weight="700">STANDS</text>'+
 /* gates */
 [['GATE 1',48,150],['GATE 4',300,290],['GATE 7',552,150]].map(function(g){return '<rect x="'+(g[1]-30)+'" y="'+(g[2]-12)+'" width="60" height="22" rx="4" fill="#402978"/><text x="'+g[1]+'" y="'+(g[2]+4)+'" text-anchor="middle" fill="#fff" font-size="12" font-family="Source Sans 3" font-weight="700">'+g[0]+'</text>';}).join('')+
 /* queue lanes in front of Gate 4 */
 '<path d="M330 306h70M330 318h70M330 330h70" stroke="#8a8a8a" stroke-width="2"/>'+
 '<text x="300" y="240" text-anchor="middle" fill="#2A1B52" font-size="11" font-family="Source Sans 3" font-weight="700">CONCOURSE</text>'+
 POSTS.map(function(p,i){return '<g class="hs" tabindex="0" role="button" data-i="'+i+'" aria-label="'+(i+1)+'. '+p.t+'">'+
   '<circle class="pulse" cx="'+p.x+'" cy="'+p.y+'" r="15"/><circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="15"/>'+
   '<text x="'+p.x+'" y="'+(p.y+5)+'" text-anchor="middle">'+(i+1)+'</text></g>';}).join('')+'</svg>';
stage.appendChild(el('<div class="map">'+svg+'</div>'));
var detail=el('<div class="detail" aria-live="polite"><span class="small">Tap a number on the plan.</span></div>');stage.appendChild(detail);
var prog=el('<div class="progress"><span>Opened <span id="cnt">0</span> of 12</span><span class="chip" id="need">Open '+NEED+' to continue</span></div>');stage.appendChild(prog);
var list=el('<details class="listalt"><summary>Prefer a list? Show the posts as a list</summary><ol></ol></details>');
POSTS.forEach(function(p,i){var li=el('<li><button type="button" data-i="'+i+'">'+(i+1)+'. '+p.t+'</button></li>');list.querySelector('ol').appendChild(li);});
stage.appendChild(list);
var act=el('<div class="actions"><button class="btn primary" id="go" disabled>Continue</button></div>');stage.appendChild(act);
var seen={},n=0;
function open(i){var p=POSTS[i];
  $$('.hs').forEach(function(g){g.classList.toggle('on',+g.dataset.i===i);});
  detail.innerHTML='';detail.appendChild(el('<div style="display:flex;gap:14px;align-items:flex-start">'+icon(p.i,'lg')+'<div><b><span class="n">'+(i+1)+'</span>'+p.t+'</b>'+p.d+'</div></div>'));
  if(!seen[i]){seen[i]=1;n++;addXp(2);$('.hs[data-i="'+i+'"]').classList.add('seen');$('.listalt button[data-i="'+i+'"]').classList.add('seen');
    $('#cnt').textContent=n;
    if(n>=NEED){$('#go').disabled=false;$('#need').textContent=n===12?'All 12 opened':'You can continue';}
    else $('#need').textContent='Open '+(NEED-n)+' more';}
}
$$('.hs').forEach(function(g){g.addEventListener('click',function(){open(+g.dataset.i);});g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(+g.dataset.i);}});});
$$('.listalt button').forEach(function(b){b.addEventListener('click',function(){open(+b.dataset.i);});});
$('#go').addEventListener('click',function(){act.replaceWith(fb('good','Well done','Whatever your post, your job is the same: keep fans safe, keep them informed and keep them flowing. Your supervisor will give you your exact post and tasks at the briefing.'));addXp(10);});
</script></body></html>
