<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer service &amp; wayfinding</title>
<style>
:root{
    --navy:#181E30;--ink:#1c2231;--muted:#5c667a;--faint:#8a93a6;
    --bg:#eef1f6;--surface:#ffffff;--surface-2:#f5f8fc;--line:#e4e9f1;--line-2:#d5dce7;
    --blue:#1f5fb8;--sky:#4D97CA;--sky-tint:#eaf3fb;
    --orange:#FF6D01;--orange-d:#e35f00;
    --teal:#0f9d8a;--teal-tint:#e7f7f4;--red:#d83a1f;--red-tint:#fdece8;--amber:#b9770a;--amber-tint:#fdf3e0;
    --shadow-sm:0 1px 2px rgba(var(--navy-rgb),.06),0 2px 8px rgba(var(--navy-rgb),.05);
    --shadow:0 2px 6px rgba(var(--navy-rgb),.07),0 10px 30px rgba(var(--navy-rgb),.08);
    --font-display:"Arial Narrow","Arial Nova Cond",Arial,sans-serif;
    --font:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
    --pad:20px;
    /* derived tokens — build.py recomputes these when course.json overrides the theme */
    --navy-rgb:24,30,48;--blue-rgb:31,95,184;--orange-rgb:255,109,1;--teal-rgb:15,157,138;--red-rgb:216,58,31;
    --orange-tint:#fff6ee;--orange-soft:#ffd0a8;--hilite:#ffd9b3;--on-orange:#2a1500;
  }
  .brand .logo{height:30px;width:auto;display:block}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 50px rgba(var(--navy-rgb),.12)}
  .app.fatigued .screen{filter:saturate(.55) contrast(.96)}
  h1,h2,h3,h4{margin:0;color:var(--navy);font-weight:700;letter-spacing:.005em;font-family:var(--font-display)}
  h1{font-size:29px;line-height:1.1} h2{font-size:19px;line-height:1.22;margin-bottom:6px;color:#3d4657;font-weight:700}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .hex{width:26px;height:29px;flex:none;background:var(--navy);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center}
  .brand .hex::after{content:attr(data-letter);color:#fff;font-weight:800;font-size:14px;font-family:Arial}
  .brand .wm{display:flex;flex-direction:column;line-height:1.2}
  .brand .wm b{font-family:Arial;font-weight:800;font-size:18px;color:var(--navy)}
  .brand .wm span{font-family:Arial;font-size:7.5px;letter-spacing:.26em;color:var(--sky);font-weight:700;margin-top:2px}
  .bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px var(--pad)}
  .bar[hidden]{display:none}
  .bar .barrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .backbtn{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;padding:8px 14px;min-height:38px;cursor:pointer;flex:none}
  .backbtn:disabled{opacity:.35;cursor:default}
  .backbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tpick{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 6px}
  .tp{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tp button{width:64px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:22px;font-weight:800;color:var(--blue);cursor:pointer;box-shadow:var(--shadow-sm)}
  .tp button:active{background:var(--sky-tint)}
  .tp button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tp .tv{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--navy);min-width:72px;text-align:center;background:var(--surface-2);border-radius:10px;padding:2px 6px}
  .tp .tl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:none;color:var(--muted)}
  .tcolon{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--navy);padding-top:14px}
  .scorecard{width:100%;border-radius:16px;padding:20px 18px;margin:0 0 14px;text-align:center;box-shadow:var(--shadow-sm)}
  .scorecard.pass{background:linear-gradient(180deg,#eafaf5,#e2f6ef);border:1px solid var(--teal)}
  .scorecard.fail{background:linear-gradient(180deg,#fdf0ec,#fbe6df);border:1px solid var(--red)}
  .scorecard .sn{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1.15;color:var(--navy)}
  .scorecard .sn span{font-size:24px;color:var(--muted)}
  .scorecard .sl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:none;color:var(--muted);margin-top:4px}
  .scorecard .verdict{display:inline-block;margin-top:12px;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:none;padding:8px 22px;border-radius:22px;color:#fff}
  .scorecard.pass .verdict{background:var(--teal)}
  .scorecard.fail .verdict{background:var(--red)}
  .scorecard .sm{font-size:14px;color:var(--ink);margin-top:12px;line-height:1.45}
  .sbar{height:10px;border-radius:8px;background:rgba(var(--navy-rgb),.09);overflow:hidden;margin:14px 0 4px;position:relative}
  .sbar i{display:block;height:100%;border-radius:8px}
  .scorecard.pass .sbar i{background:var(--teal)}
  .scorecard.fail .sbar i{background:var(--red)}
  .sbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);opacity:.55}
  .spass{font-size:11px;color:var(--muted);text-align:right}
  .bar .ready{text-align:right;font-size:11px;color:var(--muted);font-weight:600}
  .bar .ready b{color:var(--navy);font-size:13px}
  .stepper{display:flex;align-items:center;margin-top:11px}
  .stepper .seg{flex:1;display:flex;align-items:center}
  .stepper .node{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);color:var(--faint);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:var(--font)}
  .stepper .node:disabled{cursor:default}
  .stepper .node.current{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.14)}
  .stepper .node.done{background:var(--teal);border-color:var(--teal);color:#fff}
  .stepper .link{flex:1;height:2px;background:var(--line-2);margin:0 4px;border-radius:2px}
  .stepper .link.filled{background:var(--teal)}
  .stepper .node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .clockline{display:none;margin-top:10px;font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--navy)}
  .clockline b{color:var(--orange-d);font-size:16px;margin-left:8px}
  .bar.shift .stepper{display:none} .bar.shift .clockline{display:block}
  .stage{flex:1;display:flex;flex-direction:column}
  .screen{display:flex;flex:1;flex-direction:column;padding:22px var(--pad) 30px;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:none;color:var(--sky);margin-bottom:6px;font-family:var(--font-display)}
  .scene{font-size:14.5px;color:var(--muted);margin:8px 0 14px;padding-left:13px;border-left:3px solid var(--sky)}
  .lead{font-size:16px;color:var(--ink);margin:6px 0 16px;padding:11px 14px;background:var(--surface-2);border-left:3.5px solid var(--navy);border-radius:0 10px 10px 0;line-height:1.5}
  .bq{margin:10px 0 16px;padding:2px 0 2px 15px;border-left:3px solid var(--orange);font-size:16px;color:var(--ink)}
  .bq p{margin:0 0 6px} .bq p:last-child{margin:0}
  .callout{background:var(--sky-tint);border-radius:12px;padding:13px 15px;font-size:14.5px;color:var(--ink);margin:0 0 16px}
  .callout b{color:var(--navy)}
  .hero{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;position:relative}
  .hero img{display:block;width:100%;height:auto}
  .hero .tagband{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(180deg,rgba(var(--navy-rgb),0),rgba(var(--navy-rgb),.82));color:#fff}
  .hero .tagband .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--orange-soft);font-family:var(--font-display)}
  .hero .tagband h1{color:#fff;font-size:26px;margin-top:3px}
  .card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:16px;border:1px solid var(--line)}
  .plabel{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
  .plabel .pn{width:24px;height:24px;flex:none;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .plabel .pt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:none;color:var(--navy);font-family:var(--font-display)}
  /* THE TASK — highest salience on any screen (CLT signalling) */
  .q{font-size:19px;font-weight:700;color:var(--navy);margin:0 0 12px;line-height:1.38;font-family:var(--font);
     background:var(--orange-tint);border-left:4px solid var(--orange);border-radius:0 12px 12px 0;padding:14px 16px}
  .q b{color:#000}
  /* operating hint — quiet, sits next to the controls it governs */
  .howto{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:6px}
  .howto::before{content:"›";color:var(--orange);font-weight:800;flex:none}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;min-height:56px;background:#fff;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
  .opt .dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-2);position:relative}
  .opt .body{font-size:14.5px;font-weight:500;line-height:1.35}
  .opt .body .l{font-weight:800;color:var(--sky);margin-right:6px}
  .opt.g-ok{border-color:var(--teal);background:var(--teal-tint)}
  .opt.g-ok .dot{border-color:var(--teal)} .opt.g-ok .dot::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:800;font-size:13px}
  .opt.g-no{border-color:var(--red);background:var(--red-tint)}
  .opt.g-no .dot{border-color:var(--red)} .opt.g-no .dot::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:800;font-size:13px}
  .opt.g-warn{border-color:var(--amber);background:var(--amber-tint)}
  .opt.g-warn .dot{border-color:var(--amber)} .opt.g-warn .dot::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:13px}
  .opt.g-pick{border-color:var(--blue);background:var(--sky-tint)}
  .opt.g-pick .dot{border-color:var(--blue)} .opt.g-pick .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{position:relative;min-height:92px;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:10px 6px;color:var(--ink)}
  .tile .ico{width:38px;height:38px;display:inline-flex;filter:drop-shadow(0 2px 3px rgba(var(--navy-rgb),.12))}
  .tile .ico svg{width:100%;height:100%}
  .tile .nm{font-size:11.5px;font-weight:600;color:var(--navy);text-align:center;line-height:1.2}
  .tile .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:transparent}
  .tile[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.14)}
  .tile[aria-pressed="true"] .ck{border-color:var(--orange);background:var(--orange);color:#fff}
  .tile[aria-pressed="true"] .ck::after{content:"✓"}
  .tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:9px}
  .si{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:var(--shadow-sm)}
  .si .pos{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .si .txt{flex:1;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
  .si .mvs{display:flex;gap:5px}
  .mv{width:44px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--navy);font-size:13px;cursor:pointer}
  .mv:disabled{opacity:.35;cursor:default}
  .mv:focus-visible{outline:2px solid var(--blue)}
  .si .vd{font-size:13px;font-weight:800;min-width:16px;text-align:center;display:none}
  .si.g-ok{border-color:var(--teal)} .si.g-ok .pos{background:var(--teal);color:#fff} .si.g-ok .vd{display:block;color:var(--teal)}
  .si.g-no{border-color:var(--red)} .si.g-no .pos{background:var(--red);color:#fff} .si.g-no .vd{display:block;color:var(--red)}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:22px}
  .dcard{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow-sm)}
  .dcard .b{width:12px;height:14px;background:var(--sky);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);flex:none}
  .dcard.picked{border-color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.18)}
  .dcard.g-ok{border-color:var(--teal)} .dcard.g-ok .b{background:var(--teal)}
  .dcard.g-no{border-color:var(--red)} .dcard.g-no .b{background:var(--red)}
  .dcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:8px}
  .bucket{min-height:120px;border:2px dashed var(--line-2);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
  .bucket.over{border-color:var(--orange);background:var(--orange-tint)}
  .bucket .bh{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:none;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--navy);font-family:var(--font-display)}
  .bucket.b-now .bh{color:var(--orange-d)} .bucket.b-watch .bh{color:var(--blue)}
  .bucket .bdrop{flex:1;display:flex;flex-direction:column;gap:8px}
  .pickhint{font-size:12.5px;color:var(--muted);margin:0 0 10px;min-height:16px}
  .scene-wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;line-height:0}
  .hazsvg{display:block;width:100%;height:auto}
  .hz{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .hz:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .hz.found{background:rgba(var(--teal-rgb),.25);border-color:var(--teal)}
  .hz.wrong{background:rgba(var(--red-rgb),.22);border-color:var(--red)}
  .hz.wrong::after{content:"✕";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .hz.found::after{content:"✓";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .reveal{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--orange);padding:12px 13px;margin-bottom:12px;position:relative;display:none}
  .reveal.show{display:block;animation:rise .2s ease}
  .reveal .rt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
  .reveal .rx{font-size:13.5px;color:var(--muted)}
  .fb{border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none;font-size:14.5px}
  .fb.show{display:block;animation:rise .25s ease}
  .fb .head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:3px;font-size:15px}
  .fb .ic{min-width:22px;height:22px;border-radius:11px;padding:0 5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
  .fb.good{background:var(--teal-tint)} .fb.good .head{color:var(--teal)} .fb.good .ic{background:var(--teal)}
  .fb.bad{background:var(--red-tint)} .fb.bad .head{color:var(--red)} .fb.bad .ic{background:var(--red)}
  .fb.tip{background:var(--amber-tint)} .fb.tip .head{color:var(--amber)} .fb.tip .ic{background:var(--amber)}
  .fb.info{background:var(--sky-tint)} .fb.info .head{color:var(--blue)} .fb.info .ic{background:var(--blue)}
  .fb b{color:var(--navy)}
  .consq{background:var(--surface-2);border-radius:12px;padding:14px 15px;margin:0 0 12px;border-left:4px solid var(--red)}
  .consq.good{border-left-color:var(--teal)}
  .consq .ch{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy);margin-bottom:5px}
  .consq p{margin:0 0 6px;font-size:14.5px;color:var(--ink)} .consq p:last-child{margin:0}
  .consq .say{font-style:italic;color:var(--muted)}
  .timerchip{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:20px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;margin-bottom:12px}
  .timerchip.low{background:var(--red)}
  .timerchip .ext{font-family:var(--font);font-size:11px;font-weight:600;color:var(--orange-soft);background:none;border:0;cursor:pointer;text-decoration:underline;padding:2px}
  .ipt{width:100%;font:inherit;font-size:15px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:12px;color:var(--ink);background:#fff;margin-bottom:10px}
  .ipt:focus{outline:3px solid var(--sky-tint);border-color:var(--blue)}
  textarea.ipt{min-height:74px;resize:vertical}
  .toks{background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px;line-height:2;margin-bottom:12px;color:var(--ink)}
  .tok{display:inline;background:#fff;border:1.5px solid var(--line-2);border-radius:8px;padding:3px 7px;margin:0 2px;cursor:pointer;font:inherit;font-size:14px;color:var(--navy)}
  .tok[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint);text-decoration:line-through}
  .tok.g-ok{border-color:var(--teal);background:var(--teal-tint);text-decoration:line-through}
  .tok.g-no{border-color:var(--red);background:var(--red-tint);text-decoration:none}
  .tok.g-miss{border-color:var(--amber);background:var(--amber-tint)}
  .tok:focus-visible{outline:2px solid var(--blue)}
  .frames{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .frame{border:2px solid var(--line-2);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;background:#fff;position:relative;line-height:0}
  .frame .fl{position:absolute;top:6px;left:8px;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--navy);background:rgba(255,255,255,.9);border-radius:6px;padding:2px 7px;line-height:1.4}
  .frame.g-pick{border-color:var(--orange)}
  .frame:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .soundcard{background:var(--navy);border-radius:14px;padding:16px;margin-bottom:14px;color:#fff}
  .soundcard .sl{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;color:#7fd0ff;margin-bottom:10px}
  .soundcard .sline{display:flex;align-items:center;gap:10px;font-size:14.5px;margin-bottom:8px;color:#dfe6f5}
  .soundcard .sline .w{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
  .soundcard .sline .w i{width:3px;background:#4D97CA;border-radius:2px;display:inline-block}
  .panels{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
  .panels .pnl{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);line-height:0;box-shadow:var(--shadow-sm)}
  .pnl .ptime{position:absolute;left:10px;top:10px;z-index:2;background:rgba(var(--navy-rgb),.88);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.06em;padding:5px 12px;border-radius:15px;line-height:1.3}
  .pnl .pstep{position:absolute;right:10px;top:10px;z-index:2;background:rgba(255,255,255,.92);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:15px;line-height:1.3}
  .pnl .pdesc{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.94);color:var(--navy);font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;line-height:1.35}
  .pcap{font-size:12.5px;color:var(--muted);font-style:italic;margin:0 0 14px;text-align:center}
  @media (min-width:700px){.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
  .exl{border-radius:12px;background:#fff;border:1px solid var(--line-2);box-shadow:var(--shadow-sm);padding:12px 13px;margin-bottom:9px}
  .exl .ext2{font-size:14px;color:var(--ink);margin-bottom:5px}
  .exl .exv{font-size:12.5px;font-weight:700}
  .exl.v-ok .exv{color:var(--teal)} .exl.v-warn .exv{color:var(--amber)} .exl.v-no .exv{color:var(--red)}
  /* ranking cards (3.7) */
  .rkcard{position:relative;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:13px 13px 13px 52px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
  .rkcard .who3{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:none;color:var(--faint);margin-bottom:5px}
  .rkcard .ln{font-size:13.5px;line-height:1.4;margin-bottom:3px}
  .rkcard .ln b{color:var(--navy);font-weight:700}
  .rkcard .ln.sp{color:var(--muted);font-style:italic}
  .rkcard .rkn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:transparent}
  .rkcard.ranked{border-color:var(--blue)}
  .rkcard.ranked .rkn{border-style:solid;border-color:var(--blue);background:var(--blue);color:#fff}
  .rkcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .rkcard.graded{cursor:default}
  .rkcard .vch{display:none;margin-top:8px;font-size:12.5px;font-weight:700}
  .rkcard.graded .vch{display:block}
  .rkcard.iv-1 .vch{color:var(--teal)} .rkcard.iv-2 .vch{color:var(--blue)}
  .rkcard.iv-3 .vch{color:var(--amber)} .rkcard.iv-4 .vch{color:var(--red)}
  .mapblock{background:var(--surface-2);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-align:left}
  .mapblock .mh{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:none;margin-bottom:7px}
  .mapblock.mb-strong .mh{color:var(--teal)} .mapblock.mb-hes .mh{color:var(--amber)}
  .mapblock.mb-cost .mh{color:var(--red)} .mapblock.mb-one .mh{color:var(--blue)}
  .mapblock p{margin:0 0 7px;font-size:14px;color:var(--ink)} .mapblock p:last-child{margin:0}
  .rules{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}
  .iconrow{display:flex;justify-content:space-between;gap:6px;margin:4px 0 18px}
  .iconrow .ir{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .iconrow .ir .ico{width:40px;height:40px;display:inline-flex}
  .iconrow .ir .ico svg{width:100%;height:100%}
  .iconrow .ir span{font-size:10px;color:var(--muted);font-weight:600;text-align:center}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .btn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;min-height:52px;padding:14px 20px;border-radius:26px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--orange);color:var(--on-orange);box-shadow:0 6px 16px rgba(var(--orange-rgb),.28)}
  .btn.primary:hover{background:var(--orange-d)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.ghost{background:#fff;color:var(--blue);border-color:var(--line-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  .btn.sm{min-height:40px;font-size:13.5px;padding:8px 16px;border-radius:20px}
  .guide{display:inline-block;background-repeat:no-repeat;background-color:#fff;border-radius:12px;flex:none;box-shadow:var(--shadow-sm)}
  .gfloat{float:right;margin:0 0 8px 12px}
  .closewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .closewrap .big{font-size:44px;margin-bottom:8px}
  .progressdots{display:flex;gap:7px;justify-content:center;margin:14px 0 6px}
  .progressdots i{width:34px;height:8px;border-radius:6px;background:var(--line-2)}
  .progressdots i.on{background:var(--teal)}
  .badgewrap{text-align:center}
  /* video layer (progressive enhancement) */
  .vidwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:0 0 14px;background:#000;line-height:0}
  .vidwrap[hidden]{display:none}
  .vidwrap video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .vidctl{position:absolute;right:8px;top:8px;display:flex;gap:6px;line-height:1.4}   /* at the top, so the captions along the bottom stay readable */
  .tap-hint{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
  .warmup-note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:6px 10px;margin:0 0 8px}
  /* x_objective line under the heading, and the 'first choice counts' note of a scored story: quiet, no box; inline-end margin works in RTL (user, 2026-10-14) */
  .objline,.storyfirst{font-size:13.5px;line-height:1.45;color:var(--muted);margin:-2px 0 12px}
  .objline b{color:var(--ink);font-weight:700;margin-inline-end:6px}
  .vc{font:inherit;font-size:11px;font-weight:700;background:rgba(var(--navy-rgb),.75);color:#fff;border:0;border-radius:15px;padding:6px 11px;cursor:pointer;min-height:30px}
  .vc[aria-pressed="true"]{background:var(--orange);color:var(--on-orange)}
  .vc:focus-visible{outline:2px solid #fff}
  .vc.nosound{cursor:default;display:inline-flex;align-items:center;white-space:nowrap}   /* a silent clip says so where the sound button was (decision 237) */
  video::cue{background:rgba(10,14,25,.85);color:#fff;font-size:14px}
  @media print{ body *{visibility:hidden} .printonly,.printonly *{visibility:visible} .printonly{position:absolute;left:0;top:0;width:100%} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:640px){:root{--pad:32px}.app{max-width:760px}h1{font-size:36px}h2{font-size:27px}.screen{padding:28px var(--pad) 36px}.tiles{grid-template-columns:repeat(4,1fr)}.hero .tagband h1{font-size:32px}}
  @media (min-width:1024px){:root{--pad:48px}body{padding:28px 0}.app{max-width:920px;min-height:calc(100dvh - 56px);border-radius:18px;overflow:hidden;border:1px solid var(--line)}.btn{width:fit-content;min-width:280px}.actions{align-items:flex-end}.opts,.steps,.frames,.toks,.buckets,.tray,.scene-wrap,.panels{max-width:680px}}

  /* ============================================================
     EMPHASIS SYSTEM — deliberate hierarchy, not uniform glow.
     L1 the task + primary action · L2 feedback & consequences
     L3 teaching callouts · L4 body copy
     ============================================================ */

  /* L1 — THE TASK: lifts off the page and arrives with a beat */
  .q{box-shadow:0 6px 18px rgba(var(--orange-rgb),.18);animation:qPop .42s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes qPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

  /* highlighter pen on the words that matter, inside key blocks only */
  .q b,.bq b,.callout b,.learn .ft b{
    background:linear-gradient(transparent 58%,var(--hilite) 58%);
    padding:0 2px;border-radius:2px;color:var(--navy)}
  .fb b{background:linear-gradient(transparent 58%,rgba(255,255,255,.85) 58%);padding:0 2px}

  /* L1 — PRIMARY ACTION: physical, and it breathes when it's the way forward */
  .btn.primary{box-shadow:0 6px 18px rgba(var(--orange-rgb),.34);transition:transform .12s ease,box-shadow .12s ease,background .12s}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(var(--orange-rgb),.42)}
  .btn.primary:active{transform:translateY(0)}
  .btn.blue{box-shadow:0 5px 14px rgba(var(--blue-rgb),.28);transition:transform .12s ease,box-shadow .12s ease}
  .btn.blue:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(var(--blue-rgb),.36)}
  .btn.blue:active{transform:translateY(0)}
  /* guides the eye on arrival, then settles — never nags */
  .actions .btn.primary:only-child{animation:ctaBreathe 2.2s ease-in-out .9s 3 both}
  @keyframes ctaBreathe{
    0%,100%{box-shadow:0 6px 18px rgba(var(--orange-rgb),.34)}
    50%{box-shadow:0 6px 26px rgba(var(--orange-rgb),.55)}}

  /* L2 — FEEDBACK: lands with weight, icon reads at a glance */
  .fb{box-shadow:0 4px 16px rgba(var(--navy-rgb),.10);border-left:5px solid transparent;
      animation:fbPop .34s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes fbPop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .fb.good{border-left-color:var(--teal)}
  .fb.bad{border-left-color:var(--red)}
  .fb.tip{border-left-color:var(--amber)}
  .fb.info{border-left-color:var(--blue)}
  .fb .head{font-size:16.5px}
  .fb .ic{width:26px;height:26px;font-size:15px;box-shadow:0 2px 8px rgba(var(--navy-rgb),.18)}

  /* L2 — CONSEQUENCES: the emotional payload of the course */
  .consq{box-shadow:0 5px 18px rgba(var(--navy-rgb),.10);border-left-width:5px;
         animation:fbPop .38s cubic-bezier(.2,.9,.3,1.15) both}
  .consq .ch{font-size:16.5px}

  /* L3 — TEACHING BLOCKS: clearly "this is the standard" */
  .callout{border-left:5px solid var(--sky);box-shadow:0 3px 12px rgba(var(--blue-rgb),.10);
           background:linear-gradient(180deg,#f2f8fe,#eaf3fb);font-size:15px}
  .bq{background:var(--surface-2);border-radius:0 12px 12px 0;padding:14px 16px;
      box-shadow:0 2px 10px rgba(var(--navy-rgb),.06)}
  .learn{box-shadow:0 4px 16px rgba(var(--blue-rgb),.10)}
  .learn .ll{background:var(--blue);color:#fff;padding:5px 12px;border-radius:14px;
             display:inline-flex;box-shadow:0 3px 10px rgba(var(--blue-rgb),.28)}
  .learn .ll .d{background:#fff}
  .fs{transition:transform .12s ease,box-shadow .12s ease}
  .fs:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(var(--navy-rgb),.10)}

  /* SELECTION FEEDBACK: choices feel physical */
  .opt{transition:transform .1s ease,box-shadow .12s ease,border-color .12s,background .12s}
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(var(--navy-rgb),.10);border-color:var(--sky)}
  .opt[aria-pressed="true"],.opt.g-pick{box-shadow:0 4px 16px rgba(var(--orange-rgb),.20)}
  .opt.g-ok{box-shadow:0 4px 16px rgba(var(--teal-rgb),.22)}
  .opt.g-no{box-shadow:0 4px 16px rgba(var(--red-rgb),.18)}
  .tile{transition:transform .12s ease,box-shadow .14s ease,border-color .12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(var(--navy-rgb),.12)}
  .tile[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 8px 22px rgba(var(--orange-rgb),.26)}
  .tile.g-ok{box-shadow:0 6px 18px rgba(var(--teal-rgb),.24)}
  .tile.g-no{box-shadow:0 6px 18px rgba(var(--red-rgb),.20)}
  .dcard{transition:transform .12s ease,box-shadow .14s ease}
  .dcard.picked{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px rgba(var(--orange-rgb),.28)}
  .bucket.over{box-shadow:inset 0 0 0 2px var(--orange),0 6px 20px rgba(var(--orange-rgb),.18)}

  /* HAZARD HOTSPOTS: findable without giving the answer away */
  .hz{transition:background .15s,box-shadow .15s,transform .12s}
  .hz:hover{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
  .hz.found{box-shadow:0 0 0 3px rgba(var(--teal-rgb),.35),0 4px 14px rgba(0,0,0,.3);animation:hzFound .3s ease both}
  .hz.wrong{box-shadow:0 0 0 3px rgba(var(--red-rgb),.32)}
  @keyframes hzFound{from{transform:scale(.7);opacity:.4}to{transform:scale(1);opacity:1}}

  /* PROGRESS: the current step is unmistakable */
  .stepper .node.current{transform:scale(1.14);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.18),0 3px 10px rgba(var(--orange-rgb),.28)}
  .stepper .node{transition:transform .18s ease,box-shadow .18s ease,background .18s}
  .stepper .node.done{box-shadow:0 2px 8px rgba(var(--teal-rgb),.32)}

  /* MILESTONES: earn the moment */
  .closewrap .big{font-size:56px;animation:tick .5s cubic-bezier(.2,.9,.3,1.4) both;
    display:inline-flex;width:96px;height:96px;align-items:center;justify-content:center;
    border-radius:50%;background:var(--teal-tint);color:var(--teal);
    box-shadow:0 8px 26px rgba(var(--teal-rgb),.28)}
  @keyframes tick{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .progressdots i{transition:background .3s ease,transform .3s ease}
  .progressdots i.on{transform:scaleY(1.25);box-shadow:0 2px 8px rgba(var(--teal-rgb),.35)}
  .scorecard{animation:tick .55s cubic-bezier(.2,.9,.3,1.3) both}
  .scorecard .verdict{box-shadow:0 5px 16px rgba(var(--navy-rgb),.22)}

  /* media + pledge */
  .vidwrap,.scene-wrap,.hero{box-shadow:0 8px 26px rgba(var(--navy-rgb),.16)}
  .pledge{box-shadow:0 6px 22px rgba(var(--blue-rgb),.16);border-left:5px solid var(--blue);
          animation:fbPop .4s cubic-bezier(.2,.9,.3,1.15) both}
  .pnl{transition:transform .14s ease,box-shadow .16s ease}
  .pnl:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(var(--navy-rgb),.16)}

  /* nothing moves for anyone who has asked it not to */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .stepper .node.current{transform:none}
    .closewrap .big{transform:none}
  }


  /* 4.3 — three moves */
  .sss{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .sss .mv3{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .sss .mv3 .n3{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;letter-spacing:.04em}
  .sss .mv3:nth-child(1) .n3{background:var(--blue)}
  .sss .mv3:nth-child(2) .n3{background:var(--orange)}
  .sss .mv3:nth-child(3) .n3{background:var(--teal)}
  .sss .mv3 b{display:block;font-family:var(--font-display);font-size:17px;color:var(--navy);letter-spacing:.04em}
  .sss .mv3 span{font-size:13.5px;color:var(--muted)}
  /* 4.3 — tap-to-learn hazard cards */
  .hcard{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:0;margin-bottom:10px;cursor:pointer;overflow:hidden}
  .hcard .hrow{display:flex;align-items:center;gap:12px;padding:14px 14px}
  .hcard .hn{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .hcard .ht{flex:1;font-size:15.5px;font-weight:700;color:var(--navy)}
  .hcard .hchev{color:var(--faint);font-size:13px;transition:transform .2s}
  .hcard .hbody{display:none;padding:0 14px 14px 56px;font-size:14px;color:var(--ink);line-height:1.45}
  .hcard .hbody b{color:var(--orange-d)}
  .hcard.open{border-color:var(--sky)}
  .hcard.open .hbody{display:block;animation:rise .22s ease}
  .hcard.open .hchev{transform:rotate(90deg)}
  .hcard.seen .hn{background:var(--teal);color:#fff}
  .hcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* video: last-resort tap-to-play overlay */
  .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(var(--navy-rgb),.35);border:0;cursor:pointer}
  .vplay span{width:74px;height:74px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .vsound{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:inherit;font-size:14px;font-weight:700;background:var(--orange);color:var(--on-orange);border:0;border-radius:22px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:rise .3s ease}

  /* ---- Section 2: radio options — same calm cards as everywhere else,
          one small SEND cue; colour only ever means correct/wrong ---- */
  .skin-radio .opt{background:#fff;border-color:var(--line-2)}
  .skin-radio .opt .body{font-size:14.5px;color:var(--navy)}
  .skin-radio .opt .body .l{color:var(--muted)}
  .skin-radio .opt::after{content:"SEND";position:absolute;top:50%;transform:translateY(-50%);right:12px;font-family:var(--font-display);font-size:10px;letter-spacing:.12em;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:2px 7px}
  .skin-radio .opt .body{padding-right:52px}
  .skin-radio .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-radio .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-radio .opt.g-ok::after{content:"SENT";color:#0a5a4e;border-color:var(--teal)}
  .skin-radio .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-radio .opt.g-no::after{content:"✕";color:var(--red);border-color:var(--red)}
  .skin-radio .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  /* ---- Sections 3/6: options as speech bubbles ---- */
  .skin-speech{gap:12px}
  .skin-speech .opt{border-radius:16px 16px 4px 16px;background:#fff;border-color:var(--line-2);position:relative}
  .skin-speech .opt::before{content:"";position:absolute;right:-1px;bottom:-9px;border:10px solid transparent;border-top-color:var(--line-2);border-right-color:var(--line-2)}
  .skin-speech .opt .body{font-size:14.5px}
  .skin-speech .opt .body::before{content:"YOU";display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
  .skin-speech .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-speech .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-speech .opt.g-ok::before{border-top-color:var(--teal);border-right-color:var(--teal)}
  .skin-speech .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-speech .opt.g-no::before{border-top-color:var(--red);border-right-color:var(--red)}
  .skin-speech .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  .skin-speech .opt.g-pick{border-color:var(--navy)}
  /* compact in-scene video + finished-cue */
  .vidwrap.vcompact{max-width:430px;margin:0 auto 10px}
  .vidwrap.vended{box-shadow:0 0 0 2px var(--teal)}
  /* ===== Section 4 — image hazards ===== */
  .jaid .jfoot{font-size:11.5px;color:var(--muted);margin:8px 14px 12px;padding-top:8px;border-top:1px solid var(--line-2);line-height:1.45}
