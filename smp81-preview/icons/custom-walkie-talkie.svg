<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Handheld two-way radio (walkie-talkie), upright, drawn in the Fluent Emoji 3D style (soft gradients, glossy highlights). Custom: the Fluent set has only a home radio. No text. -->
  <defs>
    <linearGradient id="wtBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5568"/><stop offset=".45" stop-color="#2f3744"/><stop offset="1" stop-color="#1d222b"/>
    </linearGradient>
    <linearGradient id="wtFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6678"/><stop offset="1" stop-color="#363e4c"/>
    </linearGradient>
    <linearGradient id="wtAnt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a414d"/><stop offset=".5" stop-color="#232830"/><stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="wtKnob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ffb627"/><stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
    <linearGradient id="wtScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f0ff"/><stop offset="1" stop-color="#6fc3e8"/>
    </linearGradient>
    <radialGradient id="wtPtt" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ff8a80"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#a61e1a"/>
    </radialGradient>
  </defs>
  <!-- antenna -->
  <rect x="94" y="20" width="22" height="64" rx="10" fill="url(#wtAnt)"/>
  <rect x="99" y="26" width="5" height="40" rx="2.5" fill="#ffffff" fill-opacity=".25"/>
  <!-- channel knob -->
  <rect x="140" y="50" width="26" height="30" rx="8" fill="url(#wtKnob)"/>
  <rect x="145" y="54" width="6" height="18" rx="3" fill="#ffffff" fill-opacity=".45"/>
  <!-- push-to-talk side button -->
  <rect x="68" y="112" width="22" height="52" rx="9" fill="url(#wtPtt)"/>
  <rect x="72" y="118" width="5" height="28" rx="2.5" fill="#ffffff" fill-opacity=".4"/>
  <!-- body -->
  <rect x="82" y="68" width="100" height="172" rx="26" fill="url(#wtBody)"/>
  <rect x="88" y="74" width="88" height="160" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>
  <path d="M96 84 Q96 76 108 76 L118 76" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
  <!-- speaker grille -->
  <rect x="98" y="88" width="68" height="46" rx="12" fill="#12151b"/>
  <g stroke="#5b6678" stroke-width="6" stroke-linecap="round">
    <line x1="110" y1="100" x2="154" y2="100"/>
    <line x1="110" y1="111" x2="154" y2="111"/>
    <line x1="110" y1="122" x2="154" y2="122"/>
  </g>
  <!-- small screen with a status light -->
  <rect x="98" y="146" width="46" height="26" rx="8" fill="url(#wtScreen)"/>
  <rect x="103" y="150" width="20" height="5" rx="2.5" fill="#ffffff" fill-opacity=".7"/>
  <circle cx="156" cy="159" r="7" fill="#7be07b"/>
  <circle cx="154" cy="157" r="2.4" fill="#ffffff" fill-opacity=".7"/>
  <!-- keypad dots -->
  <g fill="url(#wtFace)">
    <circle cx="112" cy="192" r="8"/><circle cx="132" cy="192" r="8"/><circle cx="152" cy="192" r="8"/>
    <circle cx="112" cy="212" r="8"/><circle cx="132" cy="212" r="8"/><circle cx="152" cy="212" r="8"/>
  </g>
</svg>
