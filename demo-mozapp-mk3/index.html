<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mozapp: two MK3 screens - DEMO, Arabic is an unapproved Claude draft</title>
<style>
:root{
    --navy:#181E30;--ink:#1c2231;--muted:#5c667a;--faint:#8a93a6;
    --bg:#eef1f6;--surface:#ffffff;--surface-2:#f5f8fc;--line:#e4e9f1;--line-2:#d5dce7;
    --blue:#1f5fb8;--sky:#4D97CA;--sky-tint:#eaf3fb;
    --orange:#FF6D01;--orange-d:#e35f00;
    --teal:#0f9d8a;--teal-tint:#e7f7f4;--red:#d83a1f;--red-tint:#fdece8;--amber:#b9770a;--amber-tint:#fdf3e0;
    --shadow-sm:0 1px 2px rgba(var(--navy-rgb),.06),0 2px 8px rgba(var(--navy-rgb),.05);
    --shadow:0 2px 6px rgba(var(--navy-rgb),.07),0 10px 30px rgba(var(--navy-rgb),.08);
    --font-display:"Arial Narrow","Arial Nova Cond",Arial,sans-serif;
    --font:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
    --pad:20px;
    /* derived tokens — build.py recomputes these when course.json overrides the theme */
    --navy-rgb:24,30,48;--blue-rgb:31,95,184;--orange-rgb:255,109,1;--teal-rgb:15,157,138;--red-rgb:216,58,31;
    --orange-tint:#fff6ee;--orange-soft:#ffd0a8;--hilite:#ffd9b3;--on-orange:#2a1500;
  }
  .brand .logo{height:30px;width:auto;display:block}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 50px rgba(var(--navy-rgb),.12)}
  .app.fatigued .screen{filter:saturate(.55) contrast(.96)}
  h1,h2,h3,h4{margin:0;color:var(--navy);font-weight:700;letter-spacing:.005em;font-family:var(--font-display)}
  h1{font-size:29px;line-height:1.1} h2{font-size:19px;line-height:1.22;margin-bottom:6px;color:#3d4657;font-weight:700}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .hex{width:26px;height:29px;flex:none;background:var(--navy);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center}
  .brand .hex::after{content:attr(data-letter);color:#fff;font-weight:800;font-size:14px;font-family:Arial}
  .brand .wm{display:flex;flex-direction:column;line-height:1.2}
  .brand .wm b{font-family:Arial;font-weight:800;font-size:18px;color:var(--navy)}
  .brand .wm span{font-family:Arial;font-size:7.5px;letter-spacing:.26em;color:var(--sky);font-weight:700;margin-top:2px}
  .bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px var(--pad)}
  .bar[hidden]{display:none}
  .bar .barrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .backbtn{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;padding:8px 14px;min-height:38px;cursor:pointer;flex:none}
  .backbtn:disabled{opacity:.35;cursor:default}
  .backbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tpick{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 6px}
  .tp{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tp button{width:64px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:22px;font-weight:800;color:var(--blue);cursor:pointer;box-shadow:var(--shadow-sm)}
  .tp button:active{background:var(--sky-tint)}
  .tp button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tp .tv{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--navy);min-width:72px;text-align:center;background:var(--surface-2);border-radius:10px;padding:2px 6px}
  .tp .tl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:none;color:var(--muted)}
  .tcolon{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--navy);padding-top:14px}
  .scorecard{width:100%;border-radius:16px;padding:20px 18px;margin:0 0 14px;text-align:center;box-shadow:var(--shadow-sm)}
  .scorecard.pass{background:linear-gradient(180deg,#eafaf5,#e2f6ef);border:1px solid var(--teal)}
  .scorecard.fail{background:linear-gradient(180deg,#fdf0ec,#fbe6df);border:1px solid var(--red)}
  .scorecard .sn{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1.15;color:var(--navy)}
  .scorecard .sn span{font-size:24px;color:var(--muted)}
  .scorecard .sl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:none;color:var(--muted);margin-top:4px}
  .scorecard .verdict{display:inline-block;margin-top:12px;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:none;padding:8px 22px;border-radius:22px;color:#fff}
  .scorecard.pass .verdict{background:var(--teal)}
  .scorecard.fail .verdict{background:var(--red)}
  .scorecard .sm{font-size:14px;color:var(--ink);margin-top:12px;line-height:1.45}
  .sbar{height:10px;border-radius:8px;background:rgba(var(--navy-rgb),.09);overflow:hidden;margin:14px 0 4px;position:relative}
  .sbar i{display:block;height:100%;border-radius:8px}
  .scorecard.pass .sbar i{background:var(--teal)}
  .scorecard.fail .sbar i{background:var(--red)}
  .sbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);opacity:.55}
  .spass{font-size:11px;color:var(--muted);text-align:right}
  .bar .ready{text-align:right;font-size:11px;color:var(--muted);font-weight:600}
  .bar .ready b{color:var(--navy);font-size:13px}
  .stepper{display:flex;align-items:center;margin-top:11px}
  .stepper .seg{flex:1;display:flex;align-items:center}
  .stepper .node{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);color:var(--faint);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:var(--font)}
  .stepper .node:disabled{cursor:default}
  .stepper .node.current{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.14)}
  .stepper .node.done{background:var(--teal);border-color:var(--teal);color:#fff}
  .stepper .link{flex:1;height:2px;background:var(--line-2);margin:0 4px;border-radius:2px}
  .stepper .link.filled{background:var(--teal)}
  .stepper .node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .clockline{display:none;margin-top:10px;font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--navy)}
  .clockline b{color:var(--orange-d);font-size:16px;margin-left:8px}
  .bar.shift .stepper{display:none} .bar.shift .clockline{display:block}
  .stage{flex:1;display:flex;flex-direction:column}
  .screen{display:flex;flex:1;flex-direction:column;padding:22px var(--pad) 30px;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:none;color:var(--sky);margin-bottom:6px;font-family:var(--font-display)}
  .scene{font-size:14.5px;color:var(--muted);margin:8px 0 14px;padding-left:13px;border-left:3px solid var(--sky)}
  .lead{font-size:16px;color:var(--ink);margin:6px 0 16px;padding:11px 14px;background:var(--surface-2);border-left:3.5px solid var(--navy);border-radius:0 10px 10px 0;line-height:1.5}
  .bq{margin:10px 0 16px;padding:2px 0 2px 15px;border-left:3px solid var(--orange);font-size:16px;color:var(--ink)}
  .bq p{margin:0 0 6px} .bq p:last-child{margin:0}
  .callout{background:var(--sky-tint);border-radius:12px;padding:13px 15px;font-size:14.5px;color:var(--ink);margin:0 0 16px}
  .callout b{color:var(--navy)}
  .hero{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;position:relative}
  .hero img{display:block;width:100%;height:auto}
  .hero .tagband{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(180deg,rgba(var(--navy-rgb),0),rgba(var(--navy-rgb),.82));color:#fff}
  .hero .tagband .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--orange-soft);font-family:var(--font-display)}
  .hero .tagband h1{color:#fff;font-size:26px;margin-top:3px}
  .card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:16px;border:1px solid var(--line)}
  .plabel{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
  .plabel .pn{width:24px;height:24px;flex:none;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .plabel .pt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:none;color:var(--navy);font-family:var(--font-display)}
  /* THE TASK — highest salience on any screen (CLT signalling) */
  .q{font-size:19px;font-weight:700;color:var(--navy);margin:0 0 12px;line-height:1.38;font-family:var(--font);
     background:var(--orange-tint);border-left:4px solid var(--orange);border-radius:0 12px 12px 0;padding:14px 16px}
  .q b{color:#000}
  /* operating hint — quiet, sits next to the controls it governs */
  .howto{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:6px}
  .howto::before{content:"›";color:var(--orange);font-weight:800;flex:none}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;min-height:56px;background:#fff;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
  .opt .dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-2);position:relative}
  .opt .body{font-size:14.5px;font-weight:500;line-height:1.35}
  .opt .body .l{font-weight:800;color:var(--sky);margin-right:6px}
  .opt.g-ok{border-color:var(--teal);background:var(--teal-tint)}
  .opt.g-ok .dot{border-color:var(--teal)} .opt.g-ok .dot::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:800;font-size:13px}
  .opt.g-no{border-color:var(--red);background:var(--red-tint)}
  .opt.g-no .dot{border-color:var(--red)} .opt.g-no .dot::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:800;font-size:13px}
  .opt.g-warn{border-color:var(--amber);background:var(--amber-tint)}
  .opt.g-warn .dot{border-color:var(--amber)} .opt.g-warn .dot::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:13px}
  .opt.g-pick{border-color:var(--blue);background:var(--sky-tint)}
  .opt.g-pick .dot{border-color:var(--blue)} .opt.g-pick .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{position:relative;min-height:92px;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:10px 6px;color:var(--ink)}
  .tile .ico{width:38px;height:38px;display:inline-flex;filter:drop-shadow(0 2px 3px rgba(var(--navy-rgb),.12))}
  .tile .ico svg{width:100%;height:100%}
  .tile .nm{font-size:11.5px;font-weight:600;color:var(--navy);text-align:center;line-height:1.2}
  .tile .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:transparent}
  .tile[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.14)}
  .tile[aria-pressed="true"] .ck{border-color:var(--orange);background:var(--orange);color:#fff}
  .tile[aria-pressed="true"] .ck::after{content:"✓"}
  .tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:9px}
  .si{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:var(--shadow-sm)}
  .si .pos{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .si .txt{flex:1;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
  .si .mvs{display:flex;gap:5px}
  .mv{width:44px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--navy);font-size:13px;cursor:pointer}
  .mv:disabled{opacity:.35;cursor:default}
  .mv:focus-visible{outline:2px solid var(--blue)}
  .si .vd{font-size:13px;font-weight:800;min-width:16px;text-align:center;display:none}
  .si.g-ok{border-color:var(--teal)} .si.g-ok .pos{background:var(--teal);color:#fff} .si.g-ok .vd{display:block;color:var(--teal)}
  .si.g-no{border-color:var(--red)} .si.g-no .pos{background:var(--red);color:#fff} .si.g-no .vd{display:block;color:var(--red)}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:22px}
  .dcard{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow-sm)}
  .dcard .b{width:12px;height:14px;background:var(--sky);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);flex:none}
  .dcard.picked{border-color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.18)}
  .dcard.g-ok{border-color:var(--teal)} .dcard.g-ok .b{background:var(--teal)}
  .dcard.g-no{border-color:var(--red)} .dcard.g-no .b{background:var(--red)}
  .dcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:8px}
  .bucket{min-height:120px;border:2px dashed var(--line-2);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
  .bucket.over{border-color:var(--orange);background:var(--orange-tint)}
  .bucket .bh{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:none;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--navy);font-family:var(--font-display)}
  .bucket.b-now .bh{color:var(--orange-d)} .bucket.b-watch .bh{color:var(--blue)}
  .bucket .bdrop{flex:1;display:flex;flex-direction:column;gap:8px}
  .pickhint{font-size:12.5px;color:var(--muted);margin:0 0 10px;min-height:16px}
  .scene-wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;line-height:0}
  .hazsvg{display:block;width:100%;height:auto}
  .hz{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .hz:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .hz.found{background:rgba(var(--teal-rgb),.25);border-color:var(--teal)}
  .hz.wrong{background:rgba(var(--red-rgb),.22);border-color:var(--red)}
  .hz.wrong::after{content:"✕";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .hz.found::after{content:"✓";color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .reveal{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--orange);padding:12px 13px;margin-bottom:12px;position:relative;display:none}
  .reveal.show{display:block;animation:rise .2s ease}
  .reveal .rt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
  .reveal .rx{font-size:13.5px;color:var(--muted)}
  .fb{border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none;font-size:14.5px}
  .fb.show{display:block;animation:rise .25s ease}
  .fb .head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:3px;font-size:15px}
  .fb .ic{min-width:22px;height:22px;border-radius:11px;padding:0 5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
  .fb.good{background:var(--teal-tint)} .fb.good .head{color:var(--teal)} .fb.good .ic{background:var(--teal)}
  .fb.bad{background:var(--red-tint)} .fb.bad .head{color:var(--red)} .fb.bad .ic{background:var(--red)}
  .fb.tip{background:var(--amber-tint)} .fb.tip .head{color:var(--amber)} .fb.tip .ic{background:var(--amber)}
  .fb.info{background:var(--sky-tint)} .fb.info .head{color:var(--blue)} .fb.info .ic{background:var(--blue)}
  .fb b{color:var(--navy)}
  .consq{background:var(--surface-2);border-radius:12px;padding:14px 15px;margin:0 0 12px;border-left:4px solid var(--red)}
  .consq.good{border-left-color:var(--teal)}
  .consq .ch{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy);margin-bottom:5px}
  .consq p{margin:0 0 6px;font-size:14.5px;color:var(--ink)} .consq p:last-child{margin:0}
  .consq .say{font-style:italic;color:var(--muted)}
  .timerchip{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:20px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;margin-bottom:12px}
  .timerchip.low{background:var(--red)}
  .timerchip .ext{font-family:var(--font);font-size:11px;font-weight:600;color:var(--orange-soft);background:none;border:0;cursor:pointer;text-decoration:underline;padding:2px}
  .ipt{width:100%;font:inherit;font-size:15px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:12px;color:var(--ink);background:#fff;margin-bottom:10px}
  .ipt:focus{outline:3px solid var(--sky-tint);border-color:var(--blue)}
  textarea.ipt{min-height:74px;resize:vertical}
  .toks{background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px;line-height:2;margin-bottom:12px;color:var(--ink)}
  .tok{display:inline;background:#fff;border:1.5px solid var(--line-2);border-radius:8px;padding:3px 7px;margin:0 2px;cursor:pointer;font:inherit;font-size:14px;color:var(--navy)}
  .tok[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint);text-decoration:line-through}
  .tok.g-ok{border-color:var(--teal);background:var(--teal-tint);text-decoration:line-through}
  .tok.g-no{border-color:var(--red);background:var(--red-tint);text-decoration:none}
  .tok.g-miss{border-color:var(--amber);background:var(--amber-tint)}
  .tok:focus-visible{outline:2px solid var(--blue)}
  .frames{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .frame{border:2px solid var(--line-2);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;background:#fff;position:relative;line-height:0}
  .frame .fl{position:absolute;top:6px;left:8px;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--navy);background:rgba(255,255,255,.9);border-radius:6px;padding:2px 7px;line-height:1.4}
  .frame.g-pick{border-color:var(--orange)}
  .frame:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .soundcard{background:var(--navy);border-radius:14px;padding:16px;margin-bottom:14px;color:#fff}
  .soundcard .sl{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;color:#7fd0ff;margin-bottom:10px}
  .soundcard .sline{display:flex;align-items:center;gap:10px;font-size:14.5px;margin-bottom:8px;color:#dfe6f5}
  .soundcard .sline .w{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
  .soundcard .sline .w i{width:3px;background:#4D97CA;border-radius:2px;display:inline-block}
  .panels{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
  .panels .pnl{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);line-height:0;box-shadow:var(--shadow-sm)}
  .pnl .ptime{position:absolute;left:10px;top:10px;z-index:2;background:rgba(var(--navy-rgb),.88);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.06em;padding:5px 12px;border-radius:15px;line-height:1.3}
  .pnl .pstep{position:absolute;right:10px;top:10px;z-index:2;background:rgba(255,255,255,.92);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:15px;line-height:1.3}
  .pnl .pdesc{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.94);color:var(--navy);font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;line-height:1.35}
  .pcap{font-size:12.5px;color:var(--muted);font-style:italic;margin:0 0 14px;text-align:center}
  @media (min-width:700px){.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
  .exl{border-radius:12px;background:#fff;border:1px solid var(--line-2);box-shadow:var(--shadow-sm);padding:12px 13px;margin-bottom:9px}
  .exl .ext2{font-size:14px;color:var(--ink);margin-bottom:5px}
  .exl .exv{font-size:12.5px;font-weight:700}
  .exl.v-ok .exv{color:var(--teal)} .exl.v-warn .exv{color:var(--amber)} .exl.v-no .exv{color:var(--red)}
  /* ranking cards (3.7) */
  .rkcard{position:relative;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:13px 13px 13px 52px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
  .rkcard .who3{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:none;color:var(--faint);margin-bottom:5px}
  .rkcard .ln{font-size:13.5px;line-height:1.4;margin-bottom:3px}
  .rkcard .ln b{color:var(--navy);font-weight:700}
  .rkcard .ln.sp{color:var(--muted);font-style:italic}
  .rkcard .rkn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:transparent}
  .rkcard.ranked{border-color:var(--blue)}
  .rkcard.ranked .rkn{border-style:solid;border-color:var(--blue);background:var(--blue);color:#fff}
  .rkcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .rkcard.graded{cursor:default}
  .rkcard .vch{display:none;margin-top:8px;font-size:12.5px;font-weight:700}
  .rkcard.graded .vch{display:block}
  .rkcard.iv-1 .vch{color:var(--teal)} .rkcard.iv-2 .vch{color:var(--blue)}
  .rkcard.iv-3 .vch{color:var(--amber)} .rkcard.iv-4 .vch{color:var(--red)}
  .mapblock{background:var(--surface-2);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-align:left}
  .mapblock .mh{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:none;margin-bottom:7px}
  .mapblock.mb-strong .mh{color:var(--teal)} .mapblock.mb-hes .mh{color:var(--amber)}
  .mapblock.mb-cost .mh{color:var(--red)} .mapblock.mb-one .mh{color:var(--blue)}
  .mapblock p{margin:0 0 7px;font-size:14px;color:var(--ink)} .mapblock p:last-child{margin:0}
  .rules{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}
  .iconrow{display:flex;justify-content:space-between;gap:6px;margin:4px 0 18px}
  .iconrow .ir{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .iconrow .ir .ico{width:40px;height:40px;display:inline-flex}
  .iconrow .ir .ico svg{width:100%;height:100%}
  .iconrow .ir span{font-size:10px;color:var(--muted);font-weight:600;text-align:center}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .btn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;min-height:52px;padding:14px 20px;border-radius:26px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--orange);color:var(--on-orange);box-shadow:0 6px 16px rgba(var(--orange-rgb),.28)}
  .btn.primary:hover{background:var(--orange-d)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.ghost{background:#fff;color:var(--blue);border-color:var(--line-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  .btn.sm{min-height:40px;font-size:13.5px;padding:8px 16px;border-radius:20px}
  .guide{display:inline-block;background-repeat:no-repeat;background-color:#fff;border-radius:12px;flex:none;box-shadow:var(--shadow-sm)}
  .gfloat{float:right;margin:0 0 8px 12px}
  .closewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .closewrap .big{font-size:44px;margin-bottom:8px}
  .progressdots{display:flex;gap:7px;justify-content:center;margin:14px 0 6px}
  .progressdots i{width:34px;height:8px;border-radius:6px;background:var(--line-2)}
  .progressdots i.on{background:var(--teal)}
  .badgewrap{text-align:center}
  /* video layer (progressive enhancement) */
  .vidwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:0 0 14px;background:#000;line-height:0}
  .vidwrap[hidden]{display:none}
  .vidwrap video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .vidctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;line-height:1.4}
  .vc{font:inherit;font-size:11px;font-weight:700;background:rgba(var(--navy-rgb),.75);color:#fff;border:0;border-radius:15px;padding:6px 11px;cursor:pointer;min-height:30px}
  .vc[aria-pressed="true"]{background:var(--orange);color:var(--on-orange)}
  .vc:focus-visible{outline:2px solid #fff}
  video::cue{background:rgba(10,14,25,.85);color:#fff;font-size:14px}
  @media print{ body *{visibility:hidden} .printonly,.printonly *{visibility:visible} .printonly{position:absolute;left:0;top:0;width:100%} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:640px){:root{--pad:32px}.app{max-width:760px}h1{font-size:36px}h2{font-size:27px}.screen{padding:28px var(--pad) 36px}.tiles{grid-template-columns:repeat(4,1fr)}.hero .tagband h1{font-size:32px}}
  @media (min-width:1024px){:root{--pad:48px}body{padding:28px 0}.app{max-width:920px;min-height:calc(100dvh - 56px);border-radius:18px;overflow:hidden;border:1px solid var(--line)}.btn{width:fit-content;min-width:280px}.actions{align-items:flex-end}.opts,.steps,.frames,.toks,.buckets,.tray,.scene-wrap,.panels{max-width:680px}}

  /* ============================================================
     EMPHASIS SYSTEM — deliberate hierarchy, not uniform glow.
     L1 the task + primary action · L2 feedback & consequences
     L3 teaching callouts · L4 body copy
     ============================================================ */

  /* L1 — THE TASK: lifts off the page and arrives with a beat */
  .q{box-shadow:0 6px 18px rgba(var(--orange-rgb),.18);animation:qPop .42s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes qPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

  /* highlighter pen on the words that matter, inside key blocks only */
  .q b,.bq b,.callout b,.learn .ft b{
    background:linear-gradient(transparent 58%,var(--hilite) 58%);
    padding:0 2px;border-radius:2px;color:var(--navy)}
  .fb b{background:linear-gradient(transparent 58%,rgba(255,255,255,.85) 58%);padding:0 2px}

  /* L1 — PRIMARY ACTION: physical, and it breathes when it's the way forward */
  .btn.primary{box-shadow:0 6px 18px rgba(var(--orange-rgb),.34);transition:transform .12s ease,box-shadow .12s ease,background .12s}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(var(--orange-rgb),.42)}
  .btn.primary:active{transform:translateY(0)}
  .btn.blue{box-shadow:0 5px 14px rgba(var(--blue-rgb),.28);transition:transform .12s ease,box-shadow .12s ease}
  .btn.blue:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(var(--blue-rgb),.36)}
  .btn.blue:active{transform:translateY(0)}
  /* guides the eye on arrival, then settles — never nags */
  .actions .btn.primary:only-child{animation:ctaBreathe 2.2s ease-in-out .9s 3 both}
  @keyframes ctaBreathe{
    0%,100%{box-shadow:0 6px 18px rgba(var(--orange-rgb),.34)}
    50%{box-shadow:0 6px 26px rgba(var(--orange-rgb),.55)}}

  /* L2 — FEEDBACK: lands with weight, icon reads at a glance */
  .fb{box-shadow:0 4px 16px rgba(var(--navy-rgb),.10);border-left:5px solid transparent;
      animation:fbPop .34s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes fbPop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .fb.good{border-left-color:var(--teal)}
  .fb.bad{border-left-color:var(--red)}
  .fb.tip{border-left-color:var(--amber)}
  .fb.info{border-left-color:var(--blue)}
  .fb .head{font-size:16.5px}
  .fb .ic{width:26px;height:26px;font-size:15px;box-shadow:0 2px 8px rgba(var(--navy-rgb),.18)}

  /* L2 — CONSEQUENCES: the emotional payload of the course */
  .consq{box-shadow:0 5px 18px rgba(var(--navy-rgb),.10);border-left-width:5px;
         animation:fbPop .38s cubic-bezier(.2,.9,.3,1.15) both}
  .consq .ch{font-size:16.5px}

  /* L3 — TEACHING BLOCKS: clearly "this is the standard" */
  .callout{border-left:5px solid var(--sky);box-shadow:0 3px 12px rgba(var(--blue-rgb),.10);
           background:linear-gradient(180deg,#f2f8fe,#eaf3fb);font-size:15px}
  .bq{background:var(--surface-2);border-radius:0 12px 12px 0;padding:14px 16px;
      box-shadow:0 2px 10px rgba(var(--navy-rgb),.06)}
  .learn{box-shadow:0 4px 16px rgba(var(--blue-rgb),.10)}
  .learn .ll{background:var(--blue);color:#fff;padding:5px 12px;border-radius:14px;
             display:inline-flex;box-shadow:0 3px 10px rgba(var(--blue-rgb),.28)}
  .learn .ll .d{background:#fff}
  .fs{transition:transform .12s ease,box-shadow .12s ease}
  .fs:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(var(--navy-rgb),.10)}

  /* SELECTION FEEDBACK: choices feel physical */
  .opt{transition:transform .1s ease,box-shadow .12s ease,border-color .12s,background .12s}
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(var(--navy-rgb),.10);border-color:var(--sky)}
  .opt[aria-pressed="true"],.opt.g-pick{box-shadow:0 4px 16px rgba(var(--orange-rgb),.20)}
  .opt.g-ok{box-shadow:0 4px 16px rgba(var(--teal-rgb),.22)}
  .opt.g-no{box-shadow:0 4px 16px rgba(var(--red-rgb),.18)}
  .tile{transition:transform .12s ease,box-shadow .14s ease,border-color .12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(var(--navy-rgb),.12)}
  .tile[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 8px 22px rgba(var(--orange-rgb),.26)}
  .tile.g-ok{box-shadow:0 6px 18px rgba(var(--teal-rgb),.24)}
  .tile.g-no{box-shadow:0 6px 18px rgba(var(--red-rgb),.20)}
  .dcard{transition:transform .12s ease,box-shadow .14s ease}
  .dcard.picked{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px rgba(var(--orange-rgb),.28)}
  .bucket.over{box-shadow:inset 0 0 0 2px var(--orange),0 6px 20px rgba(var(--orange-rgb),.18)}

  /* HAZARD HOTSPOTS: findable without giving the answer away */
  .hz{transition:background .15s,box-shadow .15s,transform .12s}
  .hz:hover{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
  .hz.found{box-shadow:0 0 0 3px rgba(var(--teal-rgb),.35),0 4px 14px rgba(0,0,0,.3);animation:hzFound .3s ease both}
  .hz.wrong{box-shadow:0 0 0 3px rgba(var(--red-rgb),.32)}
  @keyframes hzFound{from{transform:scale(.7);opacity:.4}to{transform:scale(1);opacity:1}}

  /* PROGRESS: the current step is unmistakable */
  .stepper .node.current{transform:scale(1.14);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.18),0 3px 10px rgba(var(--orange-rgb),.28)}
  .stepper .node{transition:transform .18s ease,box-shadow .18s ease,background .18s}
  .stepper .node.done{box-shadow:0 2px 8px rgba(var(--teal-rgb),.32)}

  /* MILESTONES: earn the moment */
  .closewrap .big{font-size:56px;animation:tick .5s cubic-bezier(.2,.9,.3,1.4) both;
    display:inline-flex;width:96px;height:96px;align-items:center;justify-content:center;
    border-radius:50%;background:var(--teal-tint);color:var(--teal);
    box-shadow:0 8px 26px rgba(var(--teal-rgb),.28)}
  @keyframes tick{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .progressdots i{transition:background .3s ease,transform .3s ease}
  .progressdots i.on{transform:scaleY(1.25);box-shadow:0 2px 8px rgba(var(--teal-rgb),.35)}
  .scorecard{animation:tick .55s cubic-bezier(.2,.9,.3,1.3) both}
  .scorecard .verdict{box-shadow:0 5px 16px rgba(var(--navy-rgb),.22)}

  /* media + pledge */
  .vidwrap,.scene-wrap,.hero{box-shadow:0 8px 26px rgba(var(--navy-rgb),.16)}
  .pledge{box-shadow:0 6px 22px rgba(var(--blue-rgb),.16);border-left:5px solid var(--blue);
          animation:fbPop .4s cubic-bezier(.2,.9,.3,1.15) both}
  .pnl{transition:transform .14s ease,box-shadow .16s ease}
  .pnl:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(var(--navy-rgb),.16)}

  /* nothing moves for anyone who has asked it not to */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .stepper .node.current{transform:none}
    .closewrap .big{transform:none}
  }


  /* 4.3 — three moves */
  .sss{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .sss .mv3{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .sss .mv3 .n3{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;letter-spacing:.04em}
  .sss .mv3:nth-child(1) .n3{background:var(--blue)}
  .sss .mv3:nth-child(2) .n3{background:var(--orange)}
  .sss .mv3:nth-child(3) .n3{background:var(--teal)}
  .sss .mv3 b{display:block;font-family:var(--font-display);font-size:17px;color:var(--navy);letter-spacing:.04em}
  .sss .mv3 span{font-size:13.5px;color:var(--muted)}
  /* 4.3 — tap-to-learn hazard cards */
  .hcard{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-sm);padding:0;margin-bottom:10px;cursor:pointer;overflow:hidden}
  .hcard .hrow{display:flex;align-items:center;gap:12px;padding:14px 14px}
  .hcard .hn{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .hcard .ht{flex:1;font-size:15.5px;font-weight:700;color:var(--navy)}
  .hcard .hchev{color:var(--faint);font-size:13px;transition:transform .2s}
  .hcard .hbody{display:none;padding:0 14px 14px 56px;font-size:14px;color:var(--ink);line-height:1.45}
  .hcard .hbody b{color:var(--orange-d)}
  .hcard.open{border-color:var(--sky)}
  .hcard.open .hbody{display:block;animation:rise .22s ease}
  .hcard.open .hchev{transform:rotate(90deg)}
  .hcard.seen .hn{background:var(--teal);color:#fff}
  .hcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* video: last-resort tap-to-play overlay */
  .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(var(--navy-rgb),.35);border:0;cursor:pointer}
  .vplay span{width:74px;height:74px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .vsound{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:inherit;font-size:14px;font-weight:700;background:var(--orange);color:var(--on-orange);border:0;border-radius:22px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:rise .3s ease}

  /* ---- Section 2: radio options — same calm cards as everywhere else,
          one small SEND cue; colour only ever means correct/wrong ---- */
  .skin-radio .opt{background:#fff;border-color:var(--line-2)}
  .skin-radio .opt .body{font-size:14.5px;color:var(--navy)}
  .skin-radio .opt .body .l{color:var(--muted)}
  .skin-radio .opt::after{content:"SEND";position:absolute;top:50%;transform:translateY(-50%);right:12px;font-family:var(--font-display);font-size:10px;letter-spacing:.12em;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:2px 7px}
  .skin-radio .opt .body{padding-right:52px}
  .skin-radio .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-radio .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-radio .opt.g-ok::after{content:"SENT";color:#0a5a4e;border-color:var(--teal)}
  .skin-radio .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-radio .opt.g-no::after{content:"✕";color:var(--red);border-color:var(--red)}
  .skin-radio .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  /* ---- Sections 3/6: options as speech bubbles ---- */
  .skin-speech{gap:12px}
  .skin-speech .opt{border-radius:16px 16px 4px 16px;background:#fff;border-color:var(--line-2);position:relative}
  .skin-speech .opt::before{content:"";position:absolute;right:-1px;bottom:-9px;border:10px solid transparent;border-top-color:var(--line-2);border-right-color:var(--line-2)}
  .skin-speech .opt .body{font-size:14.5px}
  .skin-speech .opt .body::before{content:"YOU";display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
  .skin-speech .opt:hover:not(:disabled){border-color:var(--muted);background:var(--surface)}
  .skin-speech .opt.g-ok{background:var(--teal-tint);border-color:var(--teal)}
  .skin-speech .opt.g-ok::before{border-top-color:var(--teal);border-right-color:var(--teal)}
  .skin-speech .opt.g-no{background:var(--red-tint);border-color:var(--red)}
  .skin-speech .opt.g-no::before{border-top-color:var(--red);border-right-color:var(--red)}
  .skin-speech .opt.g-warn{background:var(--amber-tint);border-color:var(--amber)}
  .skin-speech .opt.g-pick{border-color:var(--navy)}
  /* compact in-scene video + finished-cue */
  .vidwrap.vcompact{max-width:430px;margin:0 auto 10px}
  .vidwrap.vended{box-shadow:0 0 0 2px var(--teal)}
  /* ===== Section 4 — image hazards ===== */
  .flash{background:#fff;border:1.5px solid var(--line-2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:10px;animation:rise .22s ease}
  .flash img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
  .flash .fcbody{padding:14px 16px}
  .flash .fcn{font-family:var(--font-display);font-size:12px;letter-spacing:.12em;color:var(--orange-d);margin-bottom:5px}
  .flash .fcbody b{font-size:18px;color:var(--navy);display:block;margin-bottom:6px}
  .flash .fcbody p{font-size:14.5px;color:var(--ink);line-height:1.5;margin:0}
  .progressdots.fdots{margin:0 0 4px}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
  .htile{position:relative;font:inherit;background:#fff;border:2px solid var(--line-2);border-radius:13px;padding:6px 6px 8px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .htile img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;display:block}
  .htile .cap{display:block;font-size:12.5px;color:var(--navy);font-weight:600;margin-top:6px;text-align:center}
  .htile[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(var(--orange-rgb),.22)}

  /* ---- 5.2: the report as a paper form ---- */

  /* contrast (WCAG AA): small grey text clears 4.5:1 on white */
  :root{--faint:#6b7689}

  .swipeable{cursor:grab;user-select:none;-webkit-user-select:none}
  .swipeable .flash img{pointer-events:none}

  /* ===== icon treatment (stroke icons from icons.js take the brand colours from CSS) ===== */
  .ico svg{width:100%;height:100%;stroke-width:1.75}
  .tile .ico{width:52px;height:52px;padding:11px;border-radius:50%;background:var(--sky-tint);color:var(--blue);filter:none;box-sizing:border-box}
  .tile[aria-pressed="true"] .ico{background:var(--orange);color:var(--on-orange)}
  .tile.g-ok .ico{background:var(--teal);color:#fff}
  .flashico{height:170px;background:linear-gradient(160deg,var(--navy),var(--blue))}
  .flashico .ico{width:96px;height:96px;padding:22px;border-radius:50%;background:rgba(255,255,255,.12);color:var(--orange);box-sizing:border-box}
  .flashico .ico svg{stroke-width:1.5}
  .iconrow .ir .ico{width:46px;height:46px;padding:10px;border-radius:50%;background:var(--sky-tint);color:var(--blue);box-sizing:border-box}

  /* ===== DESKTOP (≥1024px): app layout — dark side rail + content card. Phone layout above is untouched. ===== */
  @media (min-width:1024px){
    body{padding:0}

    .bar .barrow{flex-direction:column;align-items:stretch;gap:16px}
    .bar .brand{order:1;justify-content:flex-start}
    .bar .brand .wm b{color:#fff} .bar .brand .wm span{color:var(--orange)}
    .bar .brand .hex{background:#fff} .bar .brand .hex::after{color:var(--navy)}
    .bar .bartools{order:2;justify-content:flex-start}
    .bar .tool{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
    .bar .tool:hover{background:rgba(255,255,255,.2)}
    .bar .backbtn{order:3;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff;width:fit-content}

    .barmeta{flex-direction:column;align-items:stretch;gap:10px;margin-top:0}

    .bar .ready{text-align:left;color:rgba(255,255,255,.7);font-size:12px}
    .bar .ready b{color:#fff}
    .bar .ready .xp{background:var(--orange);color:var(--on-orange)}
    [dir=rtl] .bar .ready{text-align:right}
    .stepper{flex-direction:column;align-items:stretch;margin-top:4px}
    .stepper .seg{flex:none;flex-direction:column;align-items:stretch}
    .stepper .seg:has(.current){flex:none}
    .stepper .link{width:2px;min-width:0;height:16px;margin:3px 0 3px 19px;background:rgba(255,255,255,.18)}
    [dir=rtl] .stepper .link{margin:3px 19px 3px 0}
    .stepper .link.filled{background:var(--teal)}
    .stepper .node{width:100%;height:auto;min-height:42px;justify-content:flex-start;padding:6px 14px 6px 6px;border-radius:21px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;gap:10px}

    .stepper .node .nt{display:inline;max-width:none;white-space:normal;text-align:start;line-height:1.2}
    .stepper .node:hover{background:rgba(255,255,255,.16)}
    .stepper .node.current{background:rgba(255,255,255,.14);border-color:var(--orange);color:#fff;padding:6px 14px 6px 6px;box-shadow:none}
    .stepper .node.current .nn{background:var(--orange);color:var(--on-orange)}
    .stepper .node.done{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
    .stepper .node.done .nn{background:var(--teal)}
    .clockline{color:#fff;margin-top:auto} .clockline b{color:var(--orange)}
    .bar.shift .stepper{display:none}
    .stage{display:flex;justify-content:center;align-items:flex-start;padding:40px 48px 56px;overflow-x:hidden}
    .screen{flex:none;width:100%;max-width:780px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:40px 48px 44px;animation:fade .28s ease}
    .screen h2{font-size:28px}

    [dir=rtl] .actions{align-items:flex-start}

  }
  @media (min-width:1400px){.app{grid-template-columns:340px minmax(0,1fr)}.screen{max-width:860px}}

  /* ===== raster (3D) icons from the library: no tint circle, let the artwork breathe ===== */
  .ico img{width:100%;height:100%;object-fit:contain;display:block}
  .tile .ico:has(img){background:transparent;padding:2px;width:58px;height:58px}
  .tile[aria-pressed="true"] .ico:has(img),.tile.g-ok .ico:has(img){background:transparent}
  .flashico .ico:has(img){background:transparent;padding:6px;width:110px;height:110px}

  .flashico .ico:has(svg){padding:16px}

  /* ===== Help panel: live mini-demos of every control ===== */
  .hpanel{max-width:820px}
  .hgridh{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 16px}
  @media (min-width:640px){.hgridh{grid-template-columns:1fr 1fr}}
  .hitem{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
  .htext b{display:block;font-size:14.5px;color:var(--navy);margin-bottom:2px}
  .htext span{font-size:13px;color:var(--muted);line-height:1.45}
  .hd{position:relative;height:74px;background:#fff;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;direction:ltr}
  .hd .finger{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(var(--navy-rgb),.28);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none;opacity:0}
  .mbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font-display);font-weight:700;font-size:12px;min-height:30px;padding:0 14px;border-radius:15px;border:1.5px solid var(--line-2);background:#fff;color:var(--blue);white-space:nowrap}
  .mbtn.primary{background:var(--orange);color:var(--on-orange);border-color:transparent;min-width:120px}
  .mbtn.amber{background:var(--amber-tint);color:var(--amber);border-color:var(--amber)}
  /* next: button breathes, finger taps, button slides away as a new one arrives */
  .hd-next .mbtn{animation:hdNext 3.2s ease-in-out infinite}
  .hd-next .finger{left:50%;top:50%;margin:-11px 0 0 -11px;animation:hdTap 3.2s ease-in-out infinite}
  @keyframes hdNext{0%,45%{transform:scale(1);box-shadow:0 4px 12px rgba(var(--orange-rgb),.35)}50%{transform:scale(.93)}60%{transform:translateX(0);opacity:1}72%{transform:translateX(-140%);opacity:0}73%{transform:translateX(140%)}86%,100%{transform:translateX(0);opacity:1}}
  @keyframes hdTap{0%,30%{opacity:0;transform:scale(1.6)}40%{opacity:1;transform:scale(1.2)}50%{opacity:1;transform:scale(.8)}60%,100%{opacity:0;transform:scale(1.4)}}
  /* back: chevron nudges, finger taps, content slides back in from the left */
  .hd-back .chev{font-style:normal;display:inline-block;animation:hdChev 3s ease-in-out infinite}
  .hd-back .finger{left:50%;top:50%;margin:-11px 0 0 -11px;animation:hdTap 3s ease-in-out infinite}
  @keyframes hdChev{0%,40%{transform:translateX(0)}55%{transform:translateX(-5px)}70%,100%{transform:translateX(0)}}
  /* progress: section 1 completes (tick), 2 becomes current, finger taps 3 */
  .mnode{width:26px;height:26px;border-radius:13px;background:var(--sky);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--sky);transition:all .3s}
  .ml{width:22px;height:2px;background:var(--line-2)}
  .hd-prog .n1{animation:hdN1 6s ease-in-out infinite}
  .hd-prog .n2{animation:hdN2 6s ease-in-out infinite}
  .hd-prog .n3{animation:hdN3 6s ease-in-out infinite}
  .hd-prog .finger{left:calc(50% + 42px);top:50%;margin:-11px 0 0 -11px;animation:hdTap3 6s ease-in-out infinite}
  @keyframes hdN1{0%,20%{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}30%,100%{background:var(--teal);border-color:var(--teal);color:#fff}}
  @keyframes hdN2{0%,25%{background:var(--sky);border-color:var(--sky)}35%,100%{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}}
  @keyframes hdN3{0%,70%{transform:scale(1)}78%{transform:scale(1.25);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.3)}86%,100%{transform:scale(1)}}
  @keyframes hdTap3{0%,62%{opacity:0;transform:scale(1.6)}70%{opacity:1;transform:scale(1.1)}78%{opacity:1;transform:scale(.8)}86%,100%{opacity:0;transform:scale(1.4)}}
  /* questions: tap A (wrong, red, why appears) then B (right, green) */
  .hd-q{flex-direction:column;gap:5px;height:90px}
  .mopt{display:inline-flex;align-items:center;gap:7px;width:150px;padding:4px 8px;border:1.5px solid var(--line-2);border-radius:9px;font-size:11.5px;font-weight:600;color:var(--ink);background:#fff}
  .mopt .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2)}
  .hd-q .o1{animation:hdWrong 6s ease-in-out infinite}
  .hd-q .o2{animation:hdRight 6s ease-in-out infinite}
  /* scoped to the Help demo: the activity screens use .mfb for their own feedback (this once leaked a blinking "✕ why…" onto them) */
  .hd-q .mfb{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:700;color:var(--red);opacity:0;animation:hdWhy 6s ease-in-out infinite}
  .hd-q .mfb::before{content:"✕ why…"}
  .hd-q .finger{left:50%;margin-left:-60px;top:14px;animation:hdTapQ 6s ease-in-out infinite}
  @keyframes hdWrong{0%,15%{border-color:var(--line-2);background:#fff}22%,100%{border-color:var(--red);background:var(--red-tint);opacity:.75}}
  @keyframes hdRight{0%,50%{border-color:var(--line-2);background:#fff}58%,100%{border-color:var(--teal);background:var(--teal-tint)}}
  @keyframes hdWhy{0%,22%{opacity:0}28%,55%{opacity:1}62%,100%{opacity:0}}
  @keyframes hdTapQ{0%,8%{opacity:0;top:14px;transform:scale(1.5)}14%{opacity:1;top:14px;transform:scale(.8)}22%{opacity:0;top:14px}44%{opacity:0;top:46px;transform:scale(1.5)}50%{opacity:1;top:46px;transform:scale(.8)}58%,100%{opacity:0;top:46px}}
  /* timer: counts 5→1, finger taps +15, chip jumps to 16 */
  .mchip{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:#fff;border-radius:14px;padding:4px 11px;font-family:var(--font-display);font-weight:700;font-size:13px;min-width:62px;justify-content:center}
  .mchip .tt::after{content:"5s";animation:hdCount 7s steps(1,end) infinite}
  .hd-timer .mchip{animation:hdChipLow 7s steps(1,end) infinite}
  .hd-timer .finger{left:calc(50% + 48px);top:50%;margin:-11px 0 0 -11px;animation:hdTapT 7s ease-in-out infinite}
  @keyframes hdCount{0%{content:"5s"}12%{content:"4s"}24%{content:"3s"}36%{content:"2s"}48%{content:"1s"}62%{content:"16s"}74%{content:"15s"}86%{content:"14s"}100%{content:"14s"}}
  @keyframes hdChipLow{0%,35%{background:var(--navy)}36%,61%{background:var(--red)}62%,100%{background:var(--navy)}}
  @keyframes hdTapT{0%,48%{opacity:0;transform:scale(1.6)}54%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(.8)}66%,100%{opacity:0;transform:scale(1.4)}}
  /* xp: +10 floats in, pill bumps */
  .mxp{display:inline-block;background:var(--navy);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;border-radius:14px;padding:5px 12px;animation:hdXp 4s ease-in-out infinite}
  .mxp::after{content:"";animation:hdXpVal 4s steps(1,end) infinite}
  .hd-xp .plus{position:absolute;left:calc(50% + 34px);top:50%;color:var(--teal);font-weight:800;font-size:14px;opacity:0;animation:hdPlus 4s ease-in-out infinite}
  @keyframes hdXp{0%,40%{transform:scale(1)}48%{transform:scale(1.2);background:var(--orange);color:var(--on-orange)}56%,100%{transform:scale(1)}}
  @keyframes hdPlus{0%,25%{opacity:0;transform:translateY(10px)}35%{opacity:1;transform:translateY(-4px)}48%{opacity:0;transform:translateY(-16px)}100%{opacity:0}}
  .mxp{min-width:66px;text-align:center}
  .hd-xp .mxp{color:transparent;position:relative}
  .hd-xp .mxp::before{content:"0 XP";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;animation:hdXpText 4s steps(1,end) infinite}
  @keyframes hdXpText{0%,47%{content:"0 XP";color:#fff}48%,55%{content:"10 XP";color:var(--on-orange)}56%,100%{content:"10 XP";color:#fff}}
  /* video: plays with a caption line, CC toggles */
  .mvid{position:relative;width:150px;height:58px;border-radius:8px;background:linear-gradient(135deg,#1b2a3a,#3a4f66);overflow:hidden;display:block}
  .mvid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;font-style:normal;animation:hdPlay 5s ease-in-out infinite}
  .mvid .mcap{position:absolute;left:10px;right:34px;bottom:6px;height:7px;border-radius:3px;background:rgba(255,255,255,.85);animation:hdCap 5s ease-in-out infinite}
  .mvid .mvc{position:absolute;right:5px;bottom:4px;font-size:9px;font-weight:800;background:var(--orange);color:var(--on-orange);border-radius:8px;padding:1px 5px;animation:hdCC 5s steps(1,end) infinite}
  @keyframes hdPlay{0%,20%{opacity:1}30%,100%{opacity:0}}
  @keyframes hdCap{0%,30%{opacity:0;width:0}40%{opacity:1}55%,100%{opacity:1}}
  @keyframes hdCC{0%,70%{background:var(--orange);color:var(--on-orange)}71%,100%{background:rgba(24,30,48,.7);color:#fff}}
  /* language: toggle flips, text swaps and direction mirrors */
  .hd-lang .lang{position:relative;min-width:84px;overflow:hidden}
  .hd-lang .lang span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .hd-lang .l1{animation:hdL1 5s steps(1,end) infinite}.hd-lang .l2{animation:hdL2 5s steps(1,end) infinite}
  .mtext{position:relative;width:70px;height:22px;font-size:14px;font-weight:700;color:var(--navy)}
  .mtext span{position:absolute;inset:0;display:flex;align-items:center}
  .mtext .t1{justify-content:flex-start;animation:hdL1 5s steps(1,end) infinite}.mtext .t2{justify-content:flex-end;animation:hdL2 5s steps(1,end) infinite;font-family:var(--font-ar,inherit)}
  .hd-lang .finger{left:calc(50% - 42px);top:50%;margin:-11px 0 0 -11px;animation:hdTapL 5s ease-in-out infinite}
  @keyframes hdL1{0%,45%{opacity:1}46%,100%{opacity:0}}@keyframes hdL2{0%,45%{opacity:0}46%,100%{opacity:1}}
  @keyframes hdTapL{0%,30%{opacity:0;transform:scale(1.6)}36%{opacity:1;transform:scale(1.1)}44%{opacity:1;transform:scale(.8)}52%,100%{opacity:0;transform:scale(1.4)}}
  /* resume: phone closes (dims), reopens at the same place with a bookmark */
  .mphone{position:relative;width:40px;height:62px;border-radius:8px;border:2px solid var(--navy);background:#fff;display:flex;flex-direction:column;gap:5px;padding:7px 5px;animation:hdPhone 5s ease-in-out infinite}
  .mbar{height:5px;border-radius:3px;background:var(--orange);width:70%}
  .mline{height:4px;border-radius:2px;background:var(--line-2)}.mline.s{width:60%}
  .mbook{font-size:16px;animation:hdBook 5s ease-in-out infinite}
  @keyframes hdPhone{0%,30%{opacity:1;transform:scale(1)}40%,55%{opacity:.25;transform:scale(.92)}65%,100%{opacity:1;transform:scale(1)}}
  @keyframes hdBook{0%,55%{opacity:0;transform:translateY(6px)}68%,100%{opacity:1;transform:translateY(0)}}
  /* keyboard: Tab moves the focus ring A→B, Enter presses B */
  .mkey{font-family:Consolas,monospace;font-size:11px;font-weight:700;border:1.5px solid var(--line-2);border-bottom-width:3px;border-radius:6px;padding:3px 7px;background:#fff;color:var(--navy)}
  .hd-key .k1{animation:hdK1 5s steps(1,end) infinite}.hd-key .k2{animation:hdK2 5s steps(1,end) infinite}
  .hd-key .mkey:first-child{animation:hdPress 5s ease-in-out infinite}.hd-key .enter{animation:hdPress2 5s ease-in-out infinite}
  @keyframes hdK1{0%,25%{box-shadow:0 0 0 3px var(--blue)}26%,100%{box-shadow:none}}
  @keyframes hdK2{0%,25%{box-shadow:none}26%,65%{box-shadow:0 0 0 3px var(--blue)}66%,100%{box-shadow:none;background:var(--orange);color:var(--on-orange);border-color:transparent}}
  @keyframes hdPress{0%,18%{transform:translateY(0)}24%{transform:translateY(2px);border-bottom-width:1.5px}30%,100%{transform:translateY(0)}}
  @keyframes hdPress2{0%,58%{transform:translateY(0)}64%{transform:translateY(2px)}70%,100%{transform:translateY(0)}}
  /* reduced motion: demos show their finished state, nothing moves */
  @media (prefers-reduced-motion:reduce){

  .scn-panel{grid-area:1/1;display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1.15);min-height:178px}
  .scn-face{grid-area:1/1;border-radius:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:84px 8px 10px}
  .scn-front{background:linear-gradient(180deg,rgba(255,255,255,.3) 0,rgba(255,255,255,.1) 42%,rgba(var(--navy-rgb),.55) 62%,rgba(var(--navy-rgb),.7));border:1.5px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .scn-front b{font-size:13.5px;line-height:1.2} .scn-front small,.scn-back small{font-size:11px;opacity:.95}
  .scn-back{transform:rotateY(180deg);color:#fff;box-shadow:0 10px 24px rgba(var(--navy-rgb),.25)}
  .scn-card.c0 .scn-back{background:var(--blue)} .scn-card.c1 .scn-back{background:var(--navy)} .scn-card.c2 .scn-back{background:var(--ink)}   /* white text on all three (AA) */
  .scn-say{font-weight:800;font-size:14px;line-height:1.25}
  .scn-card.open .scn-panel{transform:rotateY(180deg)} [dir=rtl] .scn-card.open .scn-panel{transform:rotateY(-180deg)}
  .scn-obj{position:absolute;z-index:2;left:50%;top:8px;width:78px;height:72px;transform:translateX(-50%);pointer-events:none;display:flex;align-items:center;justify-content:center;transition:transform .5s}
  .scn-card.open .scn-obj{transform:translateX(-50%) scale(1.05)}
  .scn-obj .ico{width:64px;height:64px;display:inline-flex;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28))}
  .scn-obj .ico img,.scn-obj .ico svg{width:100%;height:100%;object-fit:contain}
  .scn-card.haspic .scn-ico{display:none}
  .scn-pic.cut{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28))}
  .scn-pic.portrait{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 18%;transform:scale(1);border:3px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.28);background:#fff}
  .scn-bubble{position:absolute;z-index:3;top:6px;inset-inline-end:6px;width:30px;height:24px;border-radius:50%;background:#fff;color:var(--navy);font-weight:900;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25);transform:scale(0);transition:transform .25s .3s cubic-bezier(.3,1.6,.5,1)}
  .scn-card.open .scn-bubble{transform:scale(1)}
  .scn-seen{position:absolute;z-index:3;top:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--teal);font-weight:900;font-size:13px;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .scn-card.seen .scn-seen{display:grid}
  @media (max-width:360px){.scn-cards{gap:6px}.scn-face{padding:74px 5px 8px}.scn-obj{width:64px;height:60px}.scn-front b{font-size:12.5px}}
  @media (prefers-reduced-motion:reduce){.scn-panel,.scn-obj,.scn-bubble{transition:none}}
  /* a two-part icon from icons.json (a list): the person behind, the item in front, one shadow (A61) */
  .icomb{position:relative;display:inline-block;width:100%;height:100%}
  .icomb img{position:absolute;object-fit:contain} .icomb .main{width:70%;height:70%;left:0;top:4%} .icomb .item{width:56%;height:56%;right:0;bottom:0}

  /* x_redLine — a safety rule card (every layout) */
  .redline{display:flex;gap:12px;align-items:flex-start;background:var(--red-tint);border-inline-start:5px solid var(--red);padding:12px 14px;margin:0 0 12px;border-radius:8px;color:var(--ink)}
  .redline .rlic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;display:grid;place-items:center}
  .redline b{display:block;color:var(--red);font-size:14.5px} .redline p{margin:2px 0 0;font-size:14.5px}

/* ============ LAYOUT "corporate" — media-first: a solid dark bar, a white page, square-cornered controls, hairline rules.
   Colours come only from the theme variables (the client's palette): --navy = the bar, --orange = the action colour,
   --sky = rules and progress (non-text), --muted = secondary text. Solid colours; no gradients in the interface. ============ */
body{background:var(--surface-2)}
.app{background:var(--surface)}
/* square corners and hairlines everywhere */
.btn,.opt,.card,.tile,.mcard,.callout,.lead,.q,.fb,.rcard,.scn-card .scn-face,.hpanel,.iitem,.chip,.sortcard,.bucket,.tfcard{border-radius:4px!important}
.btn{box-shadow:none!important}
.btn.primary,.btn.blue{background:var(--orange)!important;color:var(--on-orange)!important;border:2px solid var(--orange)!important}
.btn.primary:hover,.btn.blue:hover{background:var(--orange-d)!important;border-color:var(--orange-d)!important}
.btn.primary:disabled,.btn.blue:disabled{background:var(--line)!important;border-color:var(--line)!important;color:var(--muted)!important}
.btn.cl-back,.btn.ghost{background:var(--surface)!important;color:var(--navy)!important;border:2px solid var(--orange)!important}
.screen{display:flex;flex-direction:column}
.screen>*{flex:none}
.screen>.actions{order:99;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:10px;margin-top:auto;padding-top:14px}
.actions .btn{flex:1}
.actions .btn.cl-back{flex:0 0 34%}
.lead,.q{border-radius:0 4px 4px 0}
.kicker{color:var(--orange)}

/* ---- the bar ---- */
.bar.cl-bar-top{position:sticky;top:0;z-index:30;background:var(--navy)!important;border-bottom:0;padding:10px var(--pad);backdrop-filter:none}
.cl-barrow{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr}   /* same in both languages: logo on the right (brand rule, both design sheets) */
.cl-help span{unicode-bidi:isolate}
.cl-tools{display:flex;align-items:center;gap:8px}
.cl-logo{height:30px;width:auto;display:block}
.cl-lang{display:inline-flex;border:2px solid #fff;border-radius:4px;overflow:hidden}
.cl-lang button{font:inherit;font-weight:700;font-size:13px;min-width:40px;min-height:34px;padding:0 8px;border:0;background:transparent;color:#fff;cursor:pointer}
.cl-lang button.on{background:#fff;color:var(--navy)}
.cl-help{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:13px;min-height:38px;padding:0 12px 0 6px;border:2px solid #fff;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
.cl-help .cl-q{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}
.cl-lang button:focus-visible,.cl-help:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---- lesson meta line ---- */
.cl-lmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cl-crumb{font:inherit;font-weight:700;color:var(--orange);background:none;border:0;padding:6px 0;min-height:32px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cl-crumb::before{content:"‹";font-size:20px;line-height:1}
[dir=rtl] .cl-crumb::before{content:"›"}
.cl-crumb:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---- pages ---- */
.screen.cl-page{padding-top:0}
.cl-hero{position:relative;margin:0 calc(var(--pad)*-1) 0;aspect-ratio:16/9;overflow:hidden;background:var(--sky-tint)}
.cl-hero img,.cl-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cl-ph{position:absolute;inset:0;background:var(--sky-tint);overflow:hidden}
.cl-ph::after{content:"";position:absolute;left:50%;top:50%;width:34%;max-width:120px;aspect-ratio:1/1.15;transform:translate(-50%,-50%);background:var(--sky);opacity:.28;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cl-code{position:absolute;inset-inline-start:var(--pad);bottom:14px;background:var(--navy);color:#fff;font-family:var(--font-display);font-size:15px;padding:4px 12px}
.cl-body{padding-top:14px}
.cl-meta{color:var(--muted);font-size:14px;margin:0 0 4px}
.cl-title{font-size:26px;line-height:1.15;color:var(--navy);margin:0 0 14px}
.cl-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font:inherit;font-weight:700;font-size:15px;color:var(--navy);
  background:none;border:0;border-top:2px solid var(--sky);padding:14px 2px;min-height:52px;cursor:pointer;text-align:start}
.cl-row:focus-visible,.cl-next:focus-visible,.cl-lesson:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.cl-chev{width:10px;height:10px;border-inline-end:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(-45deg);flex:none}
[dir=rtl] .cl-chev{transform:rotate(45deg)}
.cl-row.open .cl-chev{transform:rotate(45deg)}
.cl-outcomes{margin:0 0 10px;padding-inline-start:20px;color:var(--ink);font-size:14.5px;line-height:1.5}
.cl-progress{border-top:2px solid var(--sky);padding:12px 2px 14px}
.cl-progress p{margin:0 0 8px;color:var(--muted);font-size:14px}
.cl-bar{height:8px;background:var(--line);overflow:hidden}
.cl-bar i{display:block;height:100%;background:var(--navy)}
.cl-next{width:100%;display:flex;align-items:center;gap:12px;font:inherit;text-align:start;background:var(--surface);border:2px solid var(--sky);border-radius:4px;padding:10px;margin:0 0 4px;cursor:pointer;position:relative;color:var(--ink)}
.cl-thumb{position:relative;flex:none;width:96px;aspect-ratio:16/10;overflow:hidden;border-radius:2px;display:block}
.cl-thumb.big{width:118px}
.cl-play{position:absolute;inset-inline-start:52px;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.cl-play::after{content:"";position:absolute;left:13px;top:10px;border:7px solid transparent;border-left:11px solid var(--navy);border-right:0}
.cl-nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-nt small{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cl-nt b{font-family:var(--font-display);font-size:17px;color:var(--navy);line-height:1.15}
.cl-nt span{font-size:13px;color:var(--muted)}
.cl-group{margin-top:10px}
.cl-group h3{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-top:2px solid var(--sky);padding-top:8px;margin:0 0 4px}
.cl-group ol{list-style:none;margin:0;padding:0}
.cl-lesson{width:100%;display:flex;align-items:center;gap:12px;font:inherit;text-align:start;background:none;border:0;border-radius:4px;padding:8px 6px;min-height:64px;cursor:pointer;color:var(--ink)}
.cl-lesson.next{background:var(--orange);color:var(--on-orange)}
.cl-lt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cl-lt b{font-size:15.5px;line-height:1.2}
.cl-lt span{font-size:13px;color:var(--muted)}
.cl-lesson.next .cl-lt span{color:var(--on-orange);opacity:.9}
.cl-min{position:absolute;inset-inline-end:0;bottom:0;background:var(--navy);color:#fff;font-size:11px;padding:1px 6px}
.cl-st{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--navy)}
.cl-lesson.done .cl-st{background:var(--orange);border-color:var(--orange);position:relative}
.cl-lesson.done .cl-st::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.cl-lesson.next .cl-st{background:#fff;border-color:#fff;position:relative}
.cl-lesson.next .cl-st::after{content:"";position:absolute;left:8px;top:6px;border:6px solid transparent;border-left:9px solid var(--navy);border-right:0}
[dir=rtl] .cl-lesson.next .cl-st::after{left:auto;right:8px;border-left:0;border-right:9px solid var(--navy)}
@media (prefers-reduced-motion:reduce){.cl-row .cl-chev{transition:none}}

/* ===================== PHASE 2 — lesson screens in the corporate style ===================== */
/* square corners on every card-like component; dots, numbers, avatars and the phone mock-up stay round */
.app .callout,.app .hero,.app .card,.app .opt,.app .tile,.app .si,.app .bucket,.app .scene-wrap,.app .fb,.app .consq,.app .ipt,.app .toks,
.app .frame,.app .soundcard,.app .pnl,.app .exl,.app .rkcard,.app .mapblock,.app .btn,.app .btn.sm,.app .guide,.app .vidwrap,.app .flash,
.app .htile,.app .scene,.app .hot,.app .qframe2,.app .post,.app .chip2,.app .rdecide,.app .moodwrap,.app .scorecard,.app .badge,.app .lstage,
.app .quote,.app .iitem,.app .tfcard,.app .citem,.app .rcard,.app .jaid,.app .jitem,.app .sscore,.app .streak,.app .mbtn,.app .mnode,.app .mchip,
.app .hitem,.app .cchoice,.app .rslot,.app .rpreview,.app .mediaph,.app .simg,.app .moment img,.app .stp,.app .belt,.app .beltcard,.app .bin,
.app .dcard,.app .deckcard,.app .fallback,.app .hcard,.app .mcard,.app .pdesc,.app .phrase,.app .pitem,.app .poolcard,.app .reveal,.app .stamprow,
.app .transcript,.app .uimock,.app .m-done,.app .m-thumbs-paper,.app .m-stamp-paper,.app .m-stack li,.app .m-path li,.app .m-pool>*,.app .tfb,
.app .m-thumbs-row .tfb,.app .skin-speech .opt,.app .skin-feed .opt,.app .gbubble,.app .cbub,.app .timerchip,.app .xp,.app .scn,.app .scn-face{border-radius:4px!important}
.app .card,.app .opt,.app .tile,.app .callout,.app .vidwrap,.app .scene-wrap,.app .scene,.app .rcard,.app .iitem,.app .flash,.app .htile,.app .exl,
.app .rkcard,.app .rdecide,.app .scorecard,.app .tfcard,.app .lead,.app .q,.app .hcard,.app .qframe2,.app .opt[aria-pressed="true"],.app .opt.g-pick{box-shadow:none!important}
.app .lead{background:var(--surface);border-inline-start-width:4px}
.app .q{background:var(--sky-tint);border-inline-start:4px solid var(--orange)}
/* answer rows: full width, a ring that fills when chosen, a thick border on the chosen row (no colour alone) */
.app .opt{background:var(--surface);border:2px solid var(--sky);min-height:56px}
.app .opt .dot{border-color:var(--navy)}
.app .opt.g-pick,.app .opt[aria-pressed="true"]{border:3px solid var(--navy);background:var(--sky-tint)}
.app .opt.g-pick .dot::after,.app .opt[aria-pressed="true"] .dot::after{background:var(--navy)}
/* feedback panel: a solid band with the verdict first */
.app .fb{border:0;border-inline-start:6px solid currentColor;padding:14px 16px}
.app .fb.good{background:var(--teal-tint);color:var(--teal)} .app .fb.good .body,.app .fb.good p{color:var(--ink)}
.app .fb.bad{background:var(--red-tint);color:var(--red)} .app .fb.bad .body,.app .fb.bad p{color:var(--ink)}
/* video: edge to edge on a phone, captions in a solid box */
.app .vidwrap,.app .screen>.mediaph{margin-left:calc(var(--pad)*-1);margin-right:calc(var(--pad)*-1);border-radius:0!important}
.app video::cue{background:var(--navy);color:#fff;font-family:var(--font)}
.app .vc{background:var(--navy);border-radius:2px}
/* tabs on video lessons */
.cl-tabs{display:flex;border-bottom:2px solid var(--sky);margin:6px 0 0}
.cl-tabs button{flex:1;font:inherit;font-size:14.5px;font-weight:700;color:var(--muted);background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 4px;min-height:44px;cursor:pointer}
.cl-tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.cl-tabs button:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.cl-panel{padding:12px 0}
.cl-panel h4{font-family:var(--font);font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.cl-tx{margin:0;padding:0;list-style:none}
.cl-tx li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.cl-vtitle{font-size:21px;line-height:1.2;margin:4px 0 0}

/* ===================== PHASE 3 — tablet and desktop ===================== */
.cl-side,.cl-aside{display:none}
@media (min-width:600px){
  .app{max-width:1000px}
  .screen.cl-page.cl-home{display:grid!important;grid-template-columns:1.1fr 1fr;column-gap:28px;align-items:start}
  .cl-home .cl-hero{grid-column:1;margin:0;aspect-ratio:16/10}
  .cl-home .cl-body{grid-column:1}
  .cl-home .cl-side{display:block;grid-column:2;grid-row:1 / span 4;padding-top:6px}
  .cl-home>.actions{grid-column:1}
  .cl-home .cl-allrow{display:none}
}
@media (min-width:1024px){
  .app{max-width:1180px}
  .stage.cl-withaside{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
  .stage.cl-withaside .cl-aside{display:block;position:sticky;top:72px;border-inline-end:1px solid var(--line);padding-inline-end:16px}
  .cl-aside h3{font-family:var(--font);font-size:12px;font-weight:700;color:var(--muted);margin:6px 0}
  .cl-aside .cl-lesson{min-height:44px;padding:6px}
  .cl-aside .cl-thumb{display:none}
}
/* landscape phone on a video lesson: the chrome steps back, the picture fills the screen */
@media (orientation:landscape) and (max-height:520px){
  body.cl-onvideo .bar,body.cl-onvideo .cl-lmeta,body.cl-onvideo .cl-tabs,body.cl-onvideo .cl-panel,body.cl-onvideo .screen>.actions{display:none!important}
  body.cl-onvideo .vidwrap{position:fixed;inset:0;z-index:60;margin:0;background:#000}
  body.cl-onvideo .vidwrap video{width:100%;height:100%;object-fit:contain}
}

/* a video lesson whose clip is not made yet: its text version sits on the video stage (16:9, edge to edge) */
.app .fallback.cl-vstage{margin:0 calc(var(--pad)*-1) 12px;border:0;border-radius:0!important;background:var(--navy);color:#fff;aspect-ratio:16/9;
  display:flex;align-items:center;justify-content:center;padding:18px 22px;position:relative;overflow:hidden}
.app .fallback.cl-vstage p{color:#fff;font-size:15px;line-height:1.45;text-align:center;margin:0;background:rgba(0,0,0,.35);padding:8px 12px}
.app .fallback.cl-vstage::before{content:"";position:absolute;inset:0;background:var(--blue);opacity:.35;clip-path:polygon(70% 0,100% 0,100% 100%,40% 100%)}
.app .fallback.cl-vstage .fbp{position:relative}
/* desktop: undo the default frame's side-rail bar — this layout keeps the bar on top and centres the page */
@media (min-width:1024px){
  body{padding:0;background:var(--surface-2)}
  .app{display:block!important;max-width:1180px!important;margin:0 auto;min-height:100dvh;border:0;border-radius:0!important;box-shadow:none;background:var(--surface)}
  .bar.cl-bar-top{position:sticky!important;top:0;height:auto!important;overflow:visible!important;display:block!important;padding:12px 28px!important;flex-direction:row}
  .stage{padding:0 28px 28px}
  .btn{min-width:0}
  .actions{align-items:center}
  .screen>.actions .btn{max-width:260px}
}

/* ===================== course features kept in the bar: menu · XP · progress · job aids · timer ===================== */
.cl-end{display:flex;align-items:center;gap:10px}
.cl-menu,.cl-icon{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:13px;min-height:38px;min-width:38px;justify-content:center;
  padding:0 8px;border:2px solid #fff;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
.cl-burger{display:inline-grid;gap:3px}.cl-burger i{display:block;width:16px;height:2px;background:#fff}
.cl-menu:focus-visible,.cl-icon:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.cl-xp{background:#fff!important;color:var(--navy)!important;font-weight:800;font-size:12.5px;padding:4px 8px;border-radius:2px!important;white-space:nowrap}
.bar.cl-bar-top .cl-sub{margin:10px calc(var(--pad)*-1) -10px;padding:8px var(--pad) 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar.cl-bar-top.cl-onpage .cl-sub{display:none}
.cl-sub .barmeta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cl-sub .mtitle{font-size:14px;color:var(--navy);margin:0;line-height:1.2}
.cl-sub .ready{font-size:12px;color:var(--muted);text-align:end;white-space:nowrap}
.cl-sub .ready b{color:var(--navy)}
.cl-sub .stepper{margin-top:8px}
.cl-sub .stepper .node{border-radius:2px!important;width:26px;height:26px;border:2px solid var(--line-2);background:var(--surface);color:var(--muted)}
.cl-sub .stepper .node.current{background:var(--orange);border-color:var(--orange);color:var(--on-orange);box-shadow:none}
.cl-sub .stepper .node.done{background:var(--navy);border-color:var(--navy);color:#fff}
.cl-sub .stepper .link{height:2px;background:var(--line);border-radius:0}
.cl-sub .stepper .link.filled{background:var(--navy)}

.cl-sub .clockline{color:var(--navy)}

function onSwipe(elm,fn){
  var x0=null,y0=null,id=null;
  elm.style.touchAction='pan-y';
  /* swipe is a touch/pen extra; a mouse drag (e.g. selecting text) never answers — mouse users have the buttons */

  function end(e){
    if(x0===null||e.pointerId!==id)return;
    var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;   /* a clear sideways swipe only */
    var fwd=dx<0;if(RTL[LANG])fwd=!fwd;

/* SCORM: report final score + per-question results. items:[{id,response,correct,weight}] */
function reportScore(pct,passed,items){
  /* a pass is never taken back: a later lower attempt keeps the best score and the "passed" status */
  if(window.SCORM&&SCORM.present){
    if(SCORM.get('cmi.core.lesson_status')==='passed')passed=true;
    var prevRaw=parseFloat(SCORM.get('cmi.core.score.raw'));if(!isNaN(prevRaw)&&prevRaw>pct)pct=prevRaw;
  }
  st.finalPct=pct;st.finalPass=passed;
  if(!(window.SCORM&&SCORM.present))return;
  SCORM.set('cmi.core.score.min','0');
  SCORM.set('cmi.core.score.max','100');
  SCORM.set('cmi.core.score.raw',String(pct));
  SCORM.set('cmi.core.lesson_status',passed?'passed':'failed');
  /* interactions are a journal: each attempt adds new records after the existing ones (cmi.interactions._count) */
  var base=parseInt(SCORM.get('cmi.interactions._count'),10);if(isNaN(base))base=0;
  (items||[]).forEach(function(it,j){var i=base+j;
    SCORM.set('cmi.interactions.'+i+'.id',it.id);
    SCORM.set('cmi.interactions.'+i+'.type','choice');
    SCORM.set('cmi.interactions.'+i+'.student_response',String(it.response));
    SCORM.set('cmi.interactions.'+i+'.result',it.correct?'correct':'wrong');
    SCORM.set('cmi.interactions.'+i+'.weighting',String(it.weight||1));
  });
  SCORM.commit();
}

function imgOrPh(file,alt,cls){
  var w=el('<div class="imgwrap"></div>');
  var im=el('<img class="'+(cls||'simg')+'" src="images/'+file+'" alt="'+(alt||'').replace(/"/g,'&quot;')+'">');
  im.addEventListener('error',function(){im.replaceWith(el('<div class="mediaph missing"><span class="mpi">🖼</span><b>'+(alt||U('image'))+'</b><span class="mpf">images/'+file+'</span></div>'));});

   moduleQuiz  — N items drawn at random from the module's quizPool; pass mark; unlimited retakes with feedback
   imageTiles  — pick the right picture / clip (one or several correct)
   chat        — branching conversation with a mood meter (ends calm / sorted-but-cold / escalated)
   + demo replay inside feedback (any item may carry `demo: "clip-name"`)
   + scored finals: limited re-attempts (COURSE.final.maxAttempts), result shows pass / fail */

/* "Watch the demo again" inside a feedback box */
function demoReplay(box,clip){
  if(!clip)return;
  var b=el('<button type="button" class="btn sm ghost demoagain">▶ '+U('watchAgain')+'</button>');
  b.addEventListener('click',function(){b.remove();var slot=el('<div class="demoslot"></div>');box.appendChild(slot);vidSlot(slot,clip.replace(/\.mp4$/,''),{placeholder:UI.videoSoon});});
  box.appendChild(b);
