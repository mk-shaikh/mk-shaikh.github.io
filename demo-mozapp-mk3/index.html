function optRating(o){return o.rating||(o.correct===true?'best':o.correct===false?'wrong':'wrong');}
function seededShuffle(arr,seed){var a=arr.slice(),s=seed>>>0;for(var i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;var j=s%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Draw the quiz for one attempt (indexes into pool):
   perObjective → that many items from every objective (stratified), then fill up to count from the rest;
   variantGroup → at most one item of a group per attempt; randomise false → keep the pool's order. */
function quizDraw(pool,count,attempt,s){
  var seed=attempt*7919+pool.length*31,used={},picked=[];
  var idx=s.randomise===false?pool.map(function(_,i){return i;}):seededShuffle(pool.map(function(_,i){return i;}),seed);
  function take(i){var g=pool[i].variantGroup;if(picked.indexOf(i)>=0||(g&&used[g]))return false;picked.push(i);if(g)used[g]=1;return true;}
  function lo(q){var l=q.lo;l=Array.isArray(l)?l:[l];for(var k=0;k<l.length;k++)if(typeof l[k]==='number')return l[k];return null;}
  if(s.perObjective){
    var objs=[];idx.forEach(function(i){var n=lo(pool[i]);if(n!==null&&objs.indexOf(n)<0)objs.push(n);});
    objs.sort(function(a,b){return a-b;});
    objs.forEach(function(n){var got=0;idx.forEach(function(i){if(got<s.perObjective&&lo(pool[i])===n&&take(i))got++;});});
  }
  idx.forEach(function(i){if(picked.length<count)take(i);});
  picked=picked.slice(0,count);
  return s.randomise===false?picked.sort(function(a,b){return a-b;}):seededShuffle(picked,seed+1);
}

/* ============ SCRIPT TYPES (part 4) — simulations ============
   Ported from the reference course's hand-written screens so the script skill can use them by data.
   Structured fields may come plain or `x_`-prefixed (schema 2.0 allows only x_ extension fields):
     phoneChat   groupName, messages[]{who, text}, options[]{text, score|rating, feedback}
     chips       rounds[]{scene, answer, choices[]}            — name the step / category
     spotErrors  tokens[]{text, problem}, hint                 — tap the problem phrases in a text
     buildMessage slots[]{label, fragments[]{text, clear}}     — build a radio message from fragments

/* ============ SCHEMA 2.0 ADAPTER ============
   The script skill (elearning-module-designer) writes script.json "schema 2.0":
     strings {sid, en, ar?}, section as string, one answer model (score 0/1/2), media = asset ids,
     consequence {outcome, why, next}, multiselect options[], imageTiles tiles[]{media, score, feedback},
     branch goto, order feedbackCorrect/feedbackWrong, placeholder {id, owner, note}, module.quiz, module.passMark {percent, display}.
   This file normalises such a script in place so the runtime (built for the earlier shape) renders it unchanged.
   Runs before buildFromScript(). Idempotent. */

function sc2_rating(o){if(o.rating)return o.rating;if('score' in o)return o.score===2?'best':o.score===1?'ok':'wrong';return o.correct===true?'best':'wrong';}
function sc2_assetFile(id,kind){
  if(!id||/\.(mp4|jpg|jpeg|png|webp|gif|svg)$/i.test(id))return id;
  var a=(COURSE.assets||{})[id];
  if(a&&a.file)return a.file;
  return id+(((a&&a.kind)==='video'||kind==='video')?'.mp4':'.jpg');
}
function adaptSchema2(S){
  if(!S||S.__adapted)return S;S.__adapted=true;
  var M=S.module||{};
  if(M.passMark&&typeof M.passMark==='object'){COURSE.passDisplay=M.passMark.display;}
  (M.sections||[]).forEach(function(sec){if(typeof sec.n==='string'&&/^\d+$/.test(sec.n))sec.n=+sec.n;});
  var Q=M.quiz||null;
  function fixMedia(s){
    if(!s.media)return;
    var arr=Array.isArray(s.media)?s.media:[s.media];
    s.media=arr.map(function(m){return sc2_assetFile(m,s.type==='video'?'video':null);});
  }
  function fixScreen(s){
    if(typeof s.section==='string'&&/^\d+$/.test(s.section))s.section=+s.section;
    fixMedia(s);
    if(s.placeholder&&typeof s.placeholder==='object'){s.x_placeholder=true;if(!s.x_placeholderNote)s.x_placeholderNote=s.placeholder.note||s.placeholder.id;}
    (s.options||[]).forEach(function(o){if(!o.rating)o.rating=sc2_rating(o);if(o.goto&&!o.goTo)o.goTo=o.goto;});
    switch(s.type){
      case 'multiselect':
        if(!s.items&&s.options){s.items=s.options.map(function(o){return {text:o.text,correct:sc2_rating(o)!=='wrong',icon:o.icon,why:o.feedback};});}
        if(s.feedbackCorrect&&!s.x_feedbackCorrect)s.x_feedbackCorrect=s.feedbackCorrect;
        break;
      case 'imageTiles':
        (s.tiles||[]).forEach(function(t){if(t.correct===undefined&&'score' in t)t.correct=t.score===2;if(!t.why&&t.feedback)t.why=t.feedback;if(t.media)t.media=sc2_assetFile(t.media,null);});
        break;
      case 'consequence':
        if(!s.headline&&s.outcome)s.headline=s.outcome;
        if(!s.lines&&s.why)s.lines=[s.why];
        if(!s.tone)s.tone='mixed';
        if(s.next&&!s.x_next)s.x_next=s.next;
        break;
      case 'branch':
        if(!s.situation&&s.scene)s.situation=s.scene;
        break;
      case 'order':
        if(!s.okText&&s.feedbackCorrect)s.okText=s.feedbackCorrect;
        if(!s.noText&&s.feedbackWrong)s.noText=s.feedbackWrong;
        break;
      case 'moduleQuiz':
        if(Q){if(s.count===undefined)s.count=Q.itemsShown;if(s.passMark===undefined)s.passMark=Q.passPercent;if(s.retries===undefined)s.retries=Q.retries;if(s.feedbackAfterEach===undefined)s.feedbackAfterEach=Q.feedbackAfterEach!==false;
          if(s.perObjective===undefined)s.perObjective=Q.perObjective;if(s.shuffleOptions===undefined)s.shuffleOptions=Q.shuffleOptions;if(s.randomise===undefined)s.randomise=Q.randomise;}
        if(!s.lines&&s.intro)s.lines=[s.intro];
        break;
      case 'flashcards':
        (s.cards||[]).forEach(function(c){if(c.media)c.media=sc2_assetFile(c.media,null);});
        break;
      case 'finalQuestion':
        if(typeof s.learnIn==='string'&&!s.learnInText)s.x_learnInCode=s.learnIn;
        break;
    }
  }
  (S.screens||[]).forEach(fixScreen);
  (S.quizPool||[]).forEach(function(q){fixScreen(q);if(!q.stem&&q.task)q.stem=q.task;});
  return S;
}

/* ============ SCRIPT TYPES (part 5): story and release helpers ============
   Loaded after script-schema2.js. Adds, for any module:
     x_hideUntilFilled   screen is dropped while its media is missing (build.py sets x_mediaMissing) — no empty screens
     x_variants          consequence text that depends on an earlier branch pick: [{when:{screen,option}, headline, lines}]
     x_storyScore        score line for a story: {branches:[ids], bonus:n, label?} → "You scored 5 of 6. Best path earns 10 bonus points."
     x_jobAid            an in-course job aid {title, lines[]} shown in the Job aids panel (📎), with the PDFs; works offline
     chips streak        "3 right in a row" counter on the phrase game (plain words, never timed)            */

/* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============
   The same content (script.json) can be played with different mechanics, so a module never feels like
   "the same sort again". A screen picks one with `x_mechanic`; when it does not, the engine rotates through
   the mechanics that fit the content, seeded by the module id (different modules → different order).
   Every mechanic: buttons first (tap + keyboard; swipe/drag only as extras), mirrored in RTL, never timed,
   feedback says why, first-time-correct XP only when no mistake was made.

     sort        buckets (tap card → column) · deck (one card at a time, two big choices, swipe optional)
                 · belt (cards queue on a conveyor, send each to a bin) · stamps (a sheet: stamp every line, then check)
     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe) · stamp (True / Not true stamp on a paper) · thumbs (big 👍 / 👎)
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)
     match       pairs (tap an item, then its partner) · memory (face-down cards, turn two at a time)  [new type]
     hotspot     findAll (several correct spots on a picture: "Found 2 of 4") — explicit only                       */

var MECH={
  sort:['buckets','deck','belt','stamps'],
  mcq:['list','tiles','doors','chat'],
  order:['list','stack','path'],
  trueFalse:['card','stamp','thumbs'],
  match:['pairs','memory']
};
var _mechSeed=(function(){var h=0,id=String(COURSE.id||'');for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h;})();
var _mechCount={};
function mechFits(type,m,s){
  if(type==='mcq'){
    var o=s.options||[];
    if(m==='doors')return o.length>=2&&o.length<=3;
    if(m==='chat')return o.length&&o.every(function(x){return /^\s*['"‘“]/.test(T(x.text));});
    if(m==='tiles')return o.length>=3&&o.length<=4&&o.every(function(x){return T(x.text).length<=70;});
  }
  if(type==='sort'&&m==='stamps')return (s.cards||[]).length<=10;
  if(type==='match'&&m==='memory')return (s.pairs||[]).length<=6;
  return true;
}
/* the mechanic for this screen: explicit x_mechanic, else the module's rotation over the mechanics that fit */
function mechanicFor(type,s){
  var list=MECH[type]||[],want=s.x_mechanic||s.mechanic;
  if(want&&list.indexOf(want)>=0&&mechFits(type,want,s))return want;
  if(!s._mech){
    var k=_mechCount[type]=(_mechCount[type]||0)+1,fits=list.filter(function(m){return mechFits(type,m,s);});
    s._mech=fits.length?fits[(_mechSeed+k)%fits.length]:list[0];
  }
  return s._mech;
}
/* the rotation must not depend on the order screens are visited: number every screen once, in course order */
(function(){var _bfs=buildFromScript;buildFromScript=function(){
  (SCRIPT.screens||[]).forEach(function(s){if(MECH[s.type])mechanicFor(s.type,s);});
  _bfs();};})();

function seededOrder(n,seedStr){var a=[],s=0,i;for(i=0;i<n;i++)a.push(i);for(i=0;i<seedStr.length;i++)s=(s*31+seedStr.charCodeAt(i))>>>0;

/* ============ SCRIPT TYPES (part 6): access and completeness helpers — loaded last ============
   For every screen type:
     x_fallback        text shown instead of a video or picture that has not arrived yet (build.py sets x_mediaMissing)
                       — a string, or {panels:[string | {heading, lines[]}]}; never an empty box, never "coming soon"
     x_transcript      "Show transcript" under the screen: what is seen and said (client-filmed scenes, WCAG 1.2.3)
     a11y.transcriptFrom:"captions"  the same button, built from the caption cues in the learner's language
     audio media       a play button for recorded audio assets (<id>.m4a, or <id>.<lang>.m4a per language)
     x_phrase          phrases the learner says, shown as a phrase strip (with the audio when the screen has it)
     x_completeText    a "you finished" line when the screen's activity is done (its Continue appears)
   moduleComplete: x_nextText replaces the engine's own sentence (the engine never invents course text). */

function accText(x){return typeof x==='string'?x:T(x);}

/* ---- media that has not arrived: the text version takes its place ---- */
function fallbackBox(fb){
  var parts=(fb&&fb.panels)?fb.panels:[fb];
  var html='<div class="fallback" role="note">'+parts.map(function(p){
    if(p&&p.heading)return '<div class="fbp"><b>'+T(p.heading)+'</b>'+(p.lines||[]).map(function(l){return '<p>'+T(l)+'</p>';}).join('')+'</div>';
    return '<div class="fbp"><p>'+T(p)+'</p></div>';}).join('')+'</div>';
  return el(html);
}
function applyFallback(s,h){
  if(!s.x_fallback||s.x_mediaMissing!==true)return;
  var spots=h.querySelectorAll('.mediaph, .vidwrap, video, .scene-wrap img');
  var box=fallbackBox(s.x_fallback);
  if(spots.length){var first=spots[0].closest('.vidwrap')||spots[0];first.parentNode.insertBefore(box,first);
    Array.prototype.forEach.call(h.querySelectorAll('.mediaph, .vidwrap'),function(x){x.remove();});}
  else{var anchor=h.querySelector('h2');if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(box,anchor.nextSibling);else h.insertBefore(box,h.firstChild);}
}

/* ---- transcript: written by the designer, or built from the caption cues ---- */
function transcriptLines(s){
  if(s.x_transcript)return [T(s.x_transcript)];
  if(!(s.a11y&&s.a11y.transcriptFrom==='captions'))return null;
  var lines=[];(Array.isArray(s.media)?s.media:[]).forEach(function(m){
    var t=(COURSE.transcripts||{})[m];if(!t)return;var l=t[LANG]||t.en||[];lines=lines.concat(l);});
  return lines.length?lines:null;

  groupLearn:{en:'Learn'},groupPractise:{en:'Practise'},groupCheck:{en:'Check yourself'},lessonOf:{en:'Lesson {a} of {b}'},
  minutes:{en:'{m} min'},typeInteractive:{en:'Interactive'},typeGame:{en:'Game'},typeQuiz:{en:'Quiz'},statusDone:{en:'Done'},
  statusNotStarted:{en:'Not started'},menu:{en:'Menu'},zoom:{en:'Zoom'},reset:{en:'Reset'},describeImage:{en:'Describe image'},tabOverview:{en:'Overview'},tabTranscript:{en:'Transcript'},tabResources:{en:'Resources'},
  transcriptSoon:{en:'The words of the video appear here when the video is ready.'},openJobAids:{en:'Open the job aids'}
});
var CL=(function(){
  var SC=(typeof SCRIPT!=='undefined'&&SCRIPT)||{screens:[],meta:{},module:{}};
  var ML=(SC.meta&&SC.meta.microLessons)||[];
  function screensOf(secs){return (SC.screens||[]).filter(function(s){return secs.indexOf(String(s.section))>=0;});}
  var lessons=[];
  COURSE.sections.forEach(function(sec,i){
    var n=String(sec.n),m=ML.filter(function(x){return (x.sections||[]).map(String).indexOf(n)>=0;})[0];
    var secs=m?(m.sections||[]).map(String):[n];
    if(m&&lessons.some(function(l){return l.ml===m;})){var L=lessons[lessons.length-1];L.idx.push(i+1);return;}
    var scs=screensOf(secs),types=scs.map(function(s){return s.type;});
    var kind=types.indexOf('moduleQuiz')>=0?'check':(types.indexOf('chips')>=0?'practise':'learn');
    var pic=null;scs.some(function(s){var md=Array.isArray(s.media)?s.media:(s.media?[s.media]:[]);
      return md.some(function(f){if(/\.(jpg|jpeg|png|webp)$/i.test(f)){pic=f;return true;}return false;});});
    lessons.push({ml:m||null,idx:[i+1],title:sec.title,minutes:m?m.minutes:null,kind:kind,pic:pic,
      first:scs.length?scs[0].id:sec.start});
  });
  function lessonDone(L){return L.idx.every(function(i){return !!done[i];});}
  function lessonOfSec(sec){for(var k=0;k<lessons.length;k++){var L=lessons[k];if(L.idx.indexOf(sec)>=0)return k;
      if(sec===0&&k===0&&L.ml&&(L.ml.sections||[]).map(String).indexOf('0')>=0)return 0;}return -1;}
  function upNext(){for(var k=0;k<lessons.length;k++)if(!lessonDone(lessons[k]))return k;return -1;}
  function total(){return (SC.module&&SC.module.minutes)||lessons.reduce(function(a,L){return a+(L.minutes||0);},0);}
  return {lessons:lessons,done:lessonDone,of:lessonOfSec,next:upNext,total:total};
})();
function clKind(L){return L.kind==='check'?U('typeQuiz'):L.kind==='practise'?U('typeGame'):U('typeInteractive');}
function clThumb(L,big){
  var ph='<span class="cl-ph" aria-hidden="true"><i></i></span>';
  return '<span class="cl-thumb'+(big?' big':'')+'">'+ph+(L.pic?'<img src="images/'+L.pic+'" alt="" onerror="this.remove()">':'')+
    (L.minutes&&!big?'<b class="cl-min">'+L.minutes+'′</b>':'')+'</span>';
}
function clStart(k){var L=CL.lessons[k];if(!L)return;
  /* continue where the learner is in this lesson, else its first screen */
  var last=st.clLast&&S[idxOf(st.clLast)];if(last&&CL.of(last.sec)===k&&st.clLast!=='H.home'){goTo(st.clLast);return;}
  goTo(L.first);}
/* ---- the two navigation pages ---- */
function clHome(h){
  h.classList.add('cl-page');
  var L0=CL.lessons,nx=CL.next(),nd=L0.filter(CL.done).length,code=(SCRIPT.module&&SCRIPT.module.code)||'';
  var hero=null;(SCRIPT.screens||[]).some(function(s){var md=Array.isArray(s.media)?s.media:[];return md.some(function(f){if(/\.(jpg|jpeg|png|webp)$/i.test(f)){hero=f;return true;}return false;});});
  h.innerHTML='<div class="cl-hero"><span class="cl-ph" aria-hidden="true"><i></i></span>'+(hero?'<img src="images/'+hero+'" alt="" onerror="this.remove()">':'')+
    (code?'<b class="cl-code">'+code+'</b>':'')+'</div>'+
    '<div class="cl-body"><p class="cl-meta">'+U('homeMeta',{m:CL.total(),n:L0.length})+'</p>'+
    '<h2 class="cl-title">'+T(COURSE.titleI18n||COURSE.title)+'</h2></div>';
  var body=h.querySelector('.cl-body');
  var objs=((SCRIPT.meta&&SCRIPT.meta.objectivesScreen)||null);
  var outl=el('<button type="button" class="cl-row" aria-expanded="false"><span>'+U('outcomes')+'</span><span class="cl-chev" aria-hidden="true"></span></button>');
  var objScreen=(SCRIPT.screens||[]).filter(function(s){return s.role==='objectives';})[0];
  var list=el('<ul class="cl-outcomes" hidden>'+(objScreen?(objScreen.lines||[]).map(function(l){return '<li>'+T(l)+'</li>';}).join(''):'')+'</ul>');
  outl.addEventListener('click',function(){var o=list.hidden;list.hidden=!o;outl.setAttribute('aria-expanded',o?'true':'false');outl.classList.toggle('open',o);});
  body.appendChild(outl);body.appendChild(list);
  body.appendChild(el('<div class="cl-progress"><p>'+U('lessonsDone',{a:nd,b:L0.length})+'</p><div class="cl-bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+L0.length+'" aria-valuenow="'+nd+'"><i style="width:'+(L0.length?Math.round(nd*100/L0.length):0)+'%"></i></div></div>'));
  if(nx>=0){var L=L0[nx];
    var card=el('<button type="button" class="cl-next">'+clThumb(L,true)+'<span class="cl-play" aria-hidden="true"></span><span class="cl-nt"><small>'+U('upNext')+'</small><b>'+T(L.title)+'</b><span>'+clKind(L)+(L.minutes?' · '+U('minutes',{m:L.minutes}):'')+'</span></span></button>');
    card.addEventListener('click',function(){clStart(nx);});body.appendChild(card);}
  var all=el('<button type="button" class="cl-row cl-allrow"><span>'+U('allLessonsN',{n:L0.length})+'</span><span class="cl-chev" aria-hidden="true"></span></button>');
  all.addEventListener('click',function(){goTo('H.lessons');});body.appendChild(all);
  var ja=el('<button type="button" class="cl-row"><span>'+U('jobAids')+'</span><span class="cl-chev" aria-hidden="true"></span></button>');
  ja.addEventListener('click',openJobAids);body.appendChild(ja);
  actions(h).appendChild(contBtn(U('cont'),function(){clStart(nx>=0?nx:0);}));
  h.classList.add('cl-home');
  var side=el('<div class="cl-side"></div>');clListInto(side);h.insertBefore(side,h.querySelector(':scope > .actions'));
}
function clLessons(h){
  h.classList.add('cl-page');
  h.innerHTML='<button type="button" class="cl-crumb">'+U('moduleHome')+'</button><h2 class="cl-title">'+U('allLessons')+'</h2>';
  h.querySelector('.cl-crumb').addEventListener('click',function(){goTo('H.home');});
  clListInto(h);
  var nx=CL.next();actions(h).appendChild(contBtn(U('cont'),function(){clStart(nx>=0?nx:0);}));
}
function clListInto(h,curK){
  var L0=CL.lessons,nx=CL.next();
  [['learn','groupLearn'],['practise','groupPractise'],['check','groupCheck']].forEach(function(g2){
    var ks=[];L0.forEach(function(L,k){if(L.kind===g2[0])ks.push(k);});if(!ks.length)return;
    var grp=el('<section class="cl-group"><h3>'+U(g2[1])+' · '+ks.length+'</h3><ol></ol></section>');
    ks.forEach(function(k){var L=L0[k],dn=CL.done(L),isNext=(k===nx);
      var stt=dn?U('statusDone'):isNext?U('upNext'):clKind(L);
      var li=el('<li><button type="button" class="cl-lesson'+(isNext?' next':'')+(dn?' done':'')+'">'+clThumb(L)+
        '<span class="cl-lt"><b>'+T(L.title)+'</b><span>'+stt+'</span></span><span class="cl-st" aria-hidden="true"></span></button></li>');
      var b=li.querySelector('button');
      b.setAttribute('aria-label',U('lessonOf',{a:k+1,b:L0.length})+': '+T(L.title)+' — '+(dn?U('statusDone'):isNext?U('upNext'):U('statusNotStarted'))+(L.minutes?' — '+U('minutes',{m:L.minutes}):''));
      if(k===curK)b.setAttribute('aria-current','page');
      b.addEventListener('click',function(){clStart(k);});grp.querySelector('ol').appendChild(li);});
    h.appendChild(grp);
  });
}
/* ---- the bar: AR | EN · Help · logo (right). The old controls stay in the page, hidden, so the engine's code still finds them ---- */
(function(){
  var bar=g('bar');if(!bar)return;
  var b=COURSE.brand||{},logo=b.logoOnDark||b.logo;
  var keep=el('<div class="cl-keep" hidden></div>');
  ['backBtn','langBtn'].forEach(function(id){var x=g(id);if(x)keep.appendChild(x);});      /* replaced by Back beside Continue and AR | EN */
  var hb=g('helpBtn'),jb=g('jobBtn'),xp=g('xpPill'),meta=bar.querySelector('.barmeta'),stp=g('stepper'),clk=bar.querySelector('.clockline');
  bar.innerHTML='';bar.classList.add('cl-bar-top');
  var row=el('<div class="cl-barrow"><div class="cl-tools"></div><div class="cl-end"></div></div>');
  var tools=row.querySelector('.cl-tools'),end=row.querySelector('.cl-end');
  var mb=el('<button type="button" class="cl-menu" aria-haspopup="true"><span class="cl-burger" aria-hidden="true"><i></i><i></i><i></i></span><span class="cl-mlabel"></span></button>');
  mb.addEventListener('click',function(){goTo('H.lessons');});tools.appendChild(mb);
  if(LANGS.length>1){var seg=el('<div class="cl-lang" role="group"></div>');
    LANGS.forEach(function(l){var x=el('<button type="button" data-l="'+l+'" lang="'+l+'">'+l.toUpperCase()+'</button>');
      x.addEventListener('click',function(){setLang(l);});seg.appendChild(x);});tools.appendChild(seg);}
  if(hb){hb.className='cl-help';tools.appendChild(hb);}
  if(jb){jb.className='cl-icon';tools.appendChild(jb);}
  if(xp){if(xp.nextSibling&&xp.nextSibling.nodeName==='BR')xp.nextSibling.remove();xp.className='xp cl-xp';end.appendChild(xp);}
  if(logo)end.appendChild(el('<img class="cl-logo" src="'+logo+'" alt="'+(b.name||'')+'">'));
  var sub=el('<div class="cl-sub"></div>');
  if(meta)sub.appendChild(meta);if(stp)sub.appendChild(stp);if(clk)sub.appendChild(clk);
  bar.appendChild(row);bar.appendChild(sub);bar.appendChild(keep);
})();
var _clApply=applyLang;
applyLang=function(){_clApply();
  document.querySelectorAll('.cl-lang button').forEach(function(x){var on=x.dataset.l===LANG;x.setAttribute('aria-pressed',on?'true':'false');x.classList.toggle('on',on);});
  var gr=document.querySelector('.cl-lang');if(gr)gr.setAttribute('aria-label',U('switchTo'));
  var hb=g('helpBtn');if(hb)hb.innerHTML='<span class="cl-q" aria-hidden="true">?</span><span class="cl-hl">'+U('help')+'</span>';
  var ml=document.querySelector('.cl-mlabel');if(ml)ml.textContent=U('menu');
  var mb=document.querySelector('.cl-menu');if(mb)mb.setAttribute('aria-label',U('menu')+': '+U('allLessons'));
};
/* the bar shows on every screen except the language choice and the very end */
var _clUpdateBar=updateBar;
updateBar=function(sec){_clUpdateBar(sec);var id=S[cur]&&S[cur].id;g('bar').hidden=(id==='0.0');
  g('bar').classList.toggle('cl-onpage',!!id&&id.charAt(0)==='H');};   /* the progress row shows on lesson screens; the pages show their own   /* the hidden stepper keeps its state (progress, resume) */
/* the two pages go first (after the language choice); every lesson screen gets its meta line and Back */
S.unshift({id:'H.lessons',sec:0,build:clLessons});
S.unshift({id:'H.home',sec:0,build:clHome});
/* one action row per screen, always shown last (Back + the screen's own button), as the design's Back / Next */
var _clActions=actions;
actions=function(host){var a=host.querySelector(':scope > .actions');return a||_clActions(host);};
var _clRender=render;
render=function(i){
  _clRender(i);
  var d=S[cur];if(!d)return;
  if(d.id.charAt(0)!=='H'&&d.id!=='0.0'){
    st.clLast=d.id;
    var host=g('stage').querySelector('.screen'),k=CL.of(d.sec);
    if(host&&k>=0){var L=CL.lessons[k];
      var meta=el('<div class="cl-lmeta"><button type="button" class="cl-crumb">'+U('allLessons')+'</button><span>'+U('lessonOf',{a:k+1,b:CL.lessons.length})+(L.minutes?' · '+U('minutes',{m:L.minutes}):'')+'</span></div>');
      meta.querySelector('button').addEventListener('click',function(){goTo('H.lessons');});
      host.insertBefore(meta,host.firstChild);
      var a=host.querySelector(':scope > .actions')||actions(host);
      if(!a.querySelector('.cl-back')&&cur>0){var bk=el('<button type="button" class="btn cl-back">'+U('back')+'</button>');
        bk.addEventListener('click',function(){render(cur-1);});a.insertBefore(bk,a.firstChild);}
      var sc=(SCRIPT.screens||[]).filter(function(x){return x.id===d.id;})[0];
      if(sc&&sc.type==='video')clVideo(host,sc,meta);
      if(host.querySelector('.m-findall'))clHazard(host);
      var stage=g('stage'),aside=el('<nav class="cl-aside" aria-label="'+U('allLessons')+'"><h3>'+U('allLessons')+'</h3></nav>');
      clListInto(aside,k);stage.insertBefore(aside,stage.firstChild);stage.classList.add('cl-withaside');
    }
  }else g('stage').classList.remove('cl-withaside');
  document.body.classList.toggle('cl-onvideo',!!(g('stage').querySelector('.cl-tabs')&&g('stage').querySelector('.vidwrap')));
};
/* a video lesson, media first: the clip (or its placeholder / text version) at the top, the lesson line and the title,
   then Overview (the screen's own text) · Transcript (the caption file, else the text version) · Resources (job aids) */
function clVideo(host,sc,meta){
  var media=host.querySelector(':scope > .vidwrap')||host.querySelector(':scope > .mediaph')||host.querySelector(':scope > .fallback');
  var mph=host.querySelector(':scope > .mediaph');
  if(media){host.insertBefore(media,host.firstChild);if(mph&&mph!==media)host.insertBefore(mph,media);}
  var h2=host.querySelector(':scope > h2'),kick=host.querySelector(':scope > .kicker');
  if(kick)kick.remove();
  if(h2){h2.classList.add('cl-vtitle');meta.after(h2);}
  var tabs=el('<div class="cl-tabs" role="tablist"></div>'),panels=[];
  var after=h2||meta;
  var over=el('<div class="cl-panel" role="tabpanel"></div>');
  /* Overview = everything the screen says besides the clip, the title and the buttons */
  Array.prototype.slice.call(host.children).forEach(function(c){
    if(c===media||c===mph||c===meta||c===h2||c.classList.contains('actions')||c.classList.contains('vidwrap')||c.classList.contains('mediaph'))return;
    if(c.classList.contains('transcript')){c.remove();return;}
    over.appendChild(c);});
  if(media&&media.classList.contains('fallback'))media.classList.add('cl-vstage');   // the text version takes the clip's place as a stage
  var tx=el('<div class="cl-panel" role="tabpanel" hidden><ul class="cl-tx"></ul></div>');
  var res=el('<div class="cl-panel" role="tabpanel" hidden></div>');
  var jb=contBtn(U('openJobAids'),openJobAids,'ghost');res.appendChild(jb);
  panels=[over,tx,res];
  ['tabOverview','tabTranscript','tabResources'].forEach(function(k2,i){
    var b=el('<button type="button" role="tab" aria-selected="'+(i?'false':'true')+'">'+U(k2)+'</button>');
    b.addEventListener('click',function(){tabs.querySelectorAll('button').forEach(function(x,j){x.setAttribute('aria-selected',j===i?'true':'false');panels[j].hidden=j!==i;});
      if(i===1)clFillTranscript(tx,sc);});
    b.addEventListener('keydown',function(e){var bs=tabs.querySelectorAll('button'),n=bs.length,dirn=(e.key==='ArrowRight')!==(document.documentElement.dir==='rtl')?1:-1;
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();var t=bs[(i+dirn+n)%n];t.focus();t.click();}});
    tabs.appendChild(b);});
  after.after(tabs);tabs.after(over);over.after(tx);tx.after(res);
  host.classList.add('cl-video');
}
/* hazard hunt: Zoom · Reset · Describe image under the picture; "Found a of b" as numbered squares that fill in */
function clHazard(host){
  var wrap=host.querySelector('.m-findall'),cnt=host.querySelector('.findcount'),list=host.querySelector('.findlist');
  var n=wrap.querySelectorAll('.hz2').length,img=wrap.querySelector('img');
  var ctl=el('<div class="cl-hzctl"><button type="button" class="btn ghost" aria-pressed="false">'+U('zoom')+'</button><button type="button" class="btn ghost">'+U('reset')+'</button><button type="button" class="btn ghost" aria-expanded="false">'+U('describeImage')+'</button></div>');
  var bz=ctl.children[0],br=ctl.children[1],bd=ctl.children[2];
  var desc=el('<div class="cl-desc" hidden>'+(img&&img.alt?'<p>'+img.alt+'</p>':'')+'</div>');
  if(list){list.classList.add('cl-spots');desc.appendChild(list);}
  bz.addEventListener('click',function(){var z=wrap.classList.toggle('cl-zoom');bz.setAttribute('aria-pressed',z?'true':'false');});
  br.addEventListener('click',function(){wrap.classList.remove('cl-zoom');bz.setAttribute('aria-pressed','false');wrap.scrollLeft=0;wrap.scrollTop=0;});
  bd.addEventListener('click',function(){desc.hidden=!desc.hidden;bd.setAttribute('aria-expanded',desc.hidden?'false':'true');});
  wrap.after(ctl);ctl.after(desc);
  if(cnt){var sq=el('<div class="cl-found" aria-hidden="true">'+Array.apply(null,{length:n}).map(function(_,i){return '<i>'+(i+1)+'</i>';}).join('')+'</div>');
    cnt.after(sq);var upd=function(){var f=wrap.querySelectorAll('.hz2.g-ok').length;sq.querySelectorAll('i').forEach(function(x,i){x.classList.toggle('on',i<f);});};
    new MutationObserver(upd).observe(cnt,{childList:true,characterData:true,subtree:true});upd();
    desc.after(cnt);cnt.after(sq);}
}
function clFillTranscript(box,sc){
  var ul=box.querySelector('.cl-tx');if(ul.dataset.done)return;ul.dataset.done='1';
  var lines=(typeof transcriptLines==='function'&&transcriptLines(sc))||null;
  function show(ls){ul.innerHTML=ls.map(function(l){return '<li>'+l+'</li>';}).join('');}
  if(lines){show(lines);return;}
  var m=(Array.isArray(sc.media)?sc.media:[])[0];
  var name=m?String(m).replace(/\.mp4$/,''):'';
  var soon=function(){show([sc.x_fallback?T(sc.x_fallback):U('transcriptSoon')]);};
  if(!name||!window.fetch){soon();return;}
  fetch('captions/'+name+(LANGS.length>1?'.'+LANG:'')+'.vtt').then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(v){
    var out=v.split(/\r?\n\r?\n/).map(function(b){return b.split(/\r?\n/).filter(function(l){return l&&!/-->/.test(l)&&!/^\d+$/.test(l)&&!/^(WEBVTT|NOTE)/.test(l);}).join(' ');}).filter(Boolean);
    out.length?show(out):soon();}).catch(soon);
}


boot();
